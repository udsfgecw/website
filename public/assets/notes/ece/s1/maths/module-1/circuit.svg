<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 650" role="img" aria-labelledby="title desc"><title id="title">Two-loop DC network</title><desc id="desc">Three branches between nodes Q and P. Left branch has a 20 ohm resistor and an 80 volt source, center branch a 10 ohm resistor, and right branch a 10 ohm resistor, 90 volt source, and 15 ohm resistor. Branch currents i1 and i3 point down; i2 points up.</desc><rect width="100%" height="100%" fill="white"/><text x="525" y="42" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#16324f">Kirchhoff network</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0b72b9"/></marker></defs><g stroke="#203246" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M525 110V170M525 470V535M185 110H280M390 110H525M525 110H650M760 110H865M185 535H525M525 535H700M820 535H865M185 110V225M185 320V535M865 110V225M865 320V400M865 490V535M525 170V245M525 355V470"/><path d="M280 110l12-18 18 36 18-36 18 36 18-36 18 36 8-18M650 110l12-18 18 36 18-36 18 36 18-36 18 36 8-18M525 245l-18 12 36 18-36 18 36 18-36 18 18 8"/></g><g stroke="#203246" stroke-width="5"><line x1="155" y1="250" x2="215" y2="250"/><line x1="140" y1="285" x2="230" y2="285"/><line x1="835" y1="250" x2="895" y2="250"/><line x1="820" y1="285" x2="910" y2="285"/></g><g fill="#203246" font-family="Arial" font-size="25"><text x="525" y="91" text-anchor="middle" font-weight="700">Q</text><text x="525" y="582" text-anchor="middle" font-weight="700">P</text><text x="335" y="76" text-anchor="middle">20 Ω</text><text x="705" y="76" text-anchor="middle">10 Ω</text><text x="525" y="314" text-anchor="middle">10 Ω</text><text x="760" y="495" text-anchor="middle">15 Ω</text><text x="107" y="284" text-anchor="middle">80 V</text><text x="945" y="284" text-anchor="middle">90 V</text></g><g stroke="#0b72b9" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M115 155V215"/><path d="M465 440V370"/><path d="M925 155V215"/></g><g fill="#0b72b9" font-family="Arial" font-size="22" font-weight="700"><text x="80" y="146">i₁</text><text x="430" y="466">i₂</text><text x="930" y="146">i₃</text></g><g fill="#203246" font-family="Arial" font-size="18"><text x="111" y="342">source polarity:</text><text x="111" y="365">short plate above long</text></g><g fill="#203246" font-family="Arial" font-size="18"><text x="732" y="620">Current reference directions are shown by arrows.</text></g></svg>