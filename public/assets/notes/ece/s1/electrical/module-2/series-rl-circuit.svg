<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">Series RL circuit on an AC supply</title><desc id="desc">Resistor R and inductor L in series across an AC supply V. The same current I flows through both elements, with voltage drop V_R across R and V_L across L.</desc><defs><marker id="arb" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0b72b9"/></marker></defs><rect width="100%" height="100%" fill="white"/><g stroke="#203246" stroke-width="3" fill="none" stroke-linejoin="round"><path d="M120 120H260M420 120H460M620 120H700V320H120V248M120 192V120"/><path d="M260 120H280L290 100L310 140L330 100L350 140L370 100L390 140L400 120H420"/><path d="M460 120a16 16 0 0 1 32 0a16 16 0 0 1 32 0a16 16 0 0 1 32 0a16 16 0 0 1 32 0a16 16 0 0 1 32 0"/></g><circle cx="120" cy="220" r="28" fill="white" stroke="#203246" stroke-width="3"/><path d="M160 120H210" stroke="#0b72b9" stroke-width="4" fill="none" marker-end="url(#arb)"/><g fill="#16324f" font-family="Arial"><text x="120" y="230" text-anchor="middle" font-size="30">~</text><text x="80" y="228" text-anchor="end" font-size="20">V</text><text x="185" y="98" text-anchor="middle" font-size="20" fill="#0b72b9">I</text><text x="340" y="80" text-anchor="middle" font-size="20">V<tspan baseline-shift="sub" font-size="14">R</tspan></text><text x="540" y="80" text-anchor="middle" font-size="20">V<tspan baseline-shift="sub" font-size="14">L</tspan></text><text x="340" y="176" text-anchor="middle" font-size="22">R</text><text x="540" y="176" text-anchor="middle" font-size="22">L</text></g></svg>
