<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc"><title id="title">Magnetic core with centre gap and side gap and its magnetic circuit</title><desc id="desc">Part (a): a two-window core with a coil carrying current I on the left leg. Gap a is an air gap in the centre limb between the two windows and Gap b is an air gap in the right outer leg. A dashed flux path runs around the core and through the centre limb. Part (b): the magnetic circuit with reluctances Sa (centre branch), Sb (right branch) and a left branch containing the magnetomotive force F, with fluxes Φ, Φa and Φb.</desc><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#203246"/></marker></defs><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="#203246" stroke-width="4" stroke-linejoin="round"><path d="M110 60H510V150H450"/><path d="M450 160H510V300H110V60"/><path d="M450 150V100H360V175H300V100H160V260H300V185H360V260H450V160"/></g><g fill="none" stroke="#203246" stroke-width="2" stroke-dasharray="7 5"><path d="M118 80H480V280H118Z"/><path d="M330 80V280"/></g><g fill="none" stroke="#203246" stroke-width="2"><ellipse cx="135" cy="130" rx="18" ry="4"/><ellipse cx="135" cy="144" rx="18" ry="4"/><ellipse cx="135" cy="158" rx="18" ry="4"/><ellipse cx="135" cy="172" rx="18" ry="4"/><ellipse cx="135" cy="186" rx="18" ry="4"/><ellipse cx="135" cy="200" rx="18" ry="4"/><ellipse cx="135" cy="214" rx="18" ry="4"/><path d="M60 130H117M60 214H117" stroke-width="2.5"/><path d="M252 196L298 182"/></g><g fill="#203246"><circle cx="56" cy="130" r="4"/><circle cx="56" cy="214" r="4"/><polygon points="100,130 90,125 90,135"/><polygon points="78,214 88,209 88,219"/></g><g font-family="Arial" fill="#16324f"><text x="76" y="118" font-size="18" font-style="italic">I</text><text x="206" y="204" font-size="16">Gap <tspan font-style="italic">a</tspan></text><text x="518" y="165" font-size="16">Gap <tspan font-style="italic">b</tspan></text><text x="330" y="330" text-anchor="middle" font-size="16">(a) Core</text></g><g fill="none" stroke="#203246" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M110 380H490"/><path d="M110 380V433M110 477V530H490V500M300 380V400M300 500V530"/><path d="M490 380V400M490 500V530"/><path d="M300 400L288 406L312 414L288 422L312 430L288 438L312 446L288 454L312 462L300 468V500"/><path d="M490 400L478 406L502 414L478 422L502 430L478 438L502 446L478 454L502 462L490 468V500"/></g><circle cx="110" cy="455" r="22" fill="white" stroke="#203246" stroke-width="4"/><path d="M170 380H220" fill="none" stroke="#203246" stroke-width="2.5" marker-end="url(#ah)"/><path d="M340 415V455" fill="none" stroke="#203246" stroke-width="2.5" marker-end="url(#ah)"/><path d="M420 415V455" fill="none" stroke="#203246" stroke-width="2.5" marker-end="url(#ah)"/><g font-family="Arial" fill="#16324f"><text x="110" y="461" text-anchor="middle" font-size="18" font-style="italic">F</text><text x="84" y="425" font-size="20">+</text><text x="84" y="494" font-size="20">−</text><text x="190" y="366" font-size="18" font-style="italic">Φ</text><text x="270" y="440" text-anchor="end" font-size="18" font-style="italic">S<tspan font-size="12" dy="4">a</tspan></text><text x="516" y="440" font-size="18" font-style="italic">S<tspan font-size="12" dy="4">b</tspan></text><text x="352" y="440" font-size="18" font-style="italic">Φ<tspan font-size="12" dy="4">a</tspan></text><text x="432" y="440" font-size="18" font-style="italic">Φ<tspan font-size="12" dy="4">b</tspan></text><text x="300" y="575" text-anchor="middle" font-size="16">(b) Magnetic circuit</text></g></svg>
