<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" role="img" aria-labelledby="title desc"><title id="title">Balanced three-phase voltage phasors</title><desc id="desc">Three phasors of equal magnitude E_ph from a common origin: E_R at 0 degrees, E_Y at -120 degrees and E_B at 120 degrees. Their phasor sum is zero.</desc><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#203246"/></marker><marker id="arb" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0b72b9"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M430 235A70 70 0 0 0 325 174.4" stroke="#203246" stroke-width="2" fill="none"/><path d="M430 235A70 70 0 0 1 325 295.6" stroke="#203246" stroke-width="2" fill="none"/><path d="M360 235H560" stroke="#0b72b9" stroke-width="4" fill="none" marker-end="url(#arb)"/><path d="M360 235L260 61.8" stroke="#203246" stroke-width="4" fill="none" marker-end="url(#ar)"/><path d="M360 235L260 408.2" stroke="#203246" stroke-width="4" fill="none" marker-end="url(#ar)"/><circle cx="360" cy="235" r="5" fill="#203246"/><g fill="#16324f" font-family="Arial"><text x="580" y="241" font-size="20" font-weight="700" fill="#0b72b9">E<tspan baseline-shift="sub" font-size="14">R</tspan> (0°)</text><text x="240" y="50" text-anchor="end" font-size="20" font-weight="700">E<tspan baseline-shift="sub" font-size="14">B</tspan> (120°)</text><text x="240" y="424" text-anchor="end" font-size="20" font-weight="700">E<tspan baseline-shift="sub" font-size="14">Y</tspan> (-120°)</text><text x="412" y="150" text-anchor="middle" font-size="18">120°</text><text x="412" y="326" text-anchor="middle" font-size="18">120°</text></g></svg>
