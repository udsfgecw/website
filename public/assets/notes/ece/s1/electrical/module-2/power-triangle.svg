<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">Power triangle</title><desc id="desc">Right triangle relating apparent power S = VI in VA, reactive power Q = VI sin(phi) in VAR, and active power P = VI cos(phi) in W. Angle phi lies between S and P.</desc><rect width="100%" height="100%" fill="white"/><g stroke="#203246" stroke-width="3.5" fill="none" stroke-linejoin="round"><path d="M150 300H450V120Z"/><path d="M210 300A60 60 0 0 0 201.4 269.1"/><path d="M430 300V280H450" stroke-width="2"/></g><g fill="#16324f" font-family="Arial"><text x="250" y="188" text-anchor="end" font-size="20">S = VI</text><text x="250" y="212" text-anchor="end" font-size="18">[VA]</text><text x="470" y="200" font-size="20">Q = VI sin(φ)</text><text x="470" y="226" font-size="18">[Reactive Power, VAR]</text><text x="242" y="282" text-anchor="middle" font-size="20">φ</text><text x="300" y="346" text-anchor="middle" font-size="20">P = VI cos(φ)  [Active Power, W]</text></g></svg>
