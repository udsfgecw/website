<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" role="img" aria-labelledby="title desc"><title id="title">Magnetic field around a straight current-carrying conductor</title><desc id="desc">A vertical straight conductor carries current I upward. Concentric circular magnetic field lines surround the conductor, drawn as ellipses in perspective, with arrows showing the field direction. The conductor is labelled Conductor and the field lines are labelled Magnetic field.</desc><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="#203246" stroke-width="2.5"><path d="M100 330A150 40 0 0 1 400 330"/><path d="M145 330A105 28 0 0 1 355 330"/><path d="M190 330A60 14 0 0 1 310 330"/></g><rect x="236" y="40" width="28" height="380" rx="14" fill="white" stroke="#203246" stroke-width="3"/><g fill="none" stroke="#203246" stroke-width="2.5"><path d="M400 330A150 40 0 0 1 100 330"/><path d="M355 330A105 28 0 0 1 145 330"/><path d="M310 330A60 14 0 0 1 190 330"/></g><g fill="#203246"><polygon points="309,364.7 295,359.7 295,369.7"/><polygon points="309,351.6 295,346.6 295,356.6"/><polygon points="309,334.7 295,329.7 295,339.7"/></g><line x1="300" y1="300" x2="300" y2="214" stroke="#203246" stroke-width="2.5"/><polygon points="300,198 294,214 306,214" fill="#203246"/><text x="314" y="196" font-family="Arial" font-size="20" font-style="italic" fill="#16324f">I</text><text x="40" y="145" font-family="Arial" font-size="16" fill="#16324f">Conductor</text><line x1="118" y1="136" x2="226" y2="149" stroke="#203246" stroke-width="2"/><polygon points="235,150.2 225.6,145 224.6,153" fill="#203246"/><text x="330" y="416" font-family="Arial" font-size="16" fill="#16324f">Magnetic field</text><line x1="330" y1="404" x2="322" y2="380" stroke="#203246" stroke-width="2"/><polygon points="318,371 325.4,378.8 318,381.8" fill="#203246"/><text x="250" y="468" text-anchor="middle" font-family="Arial" font-size="16" fill="#16324f">(b)</text></svg>
