<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="title desc"><title id="title">Simple series magnetic circuit and its electrical equivalent</title><desc id="desc">Left: a square magnetic core with a coil of N turns on the left leg carrying current I, and a dashed closed flux path Φ labelled Flux. Right: the equivalent electrical circuit, a source of magnetomotive force F = NI with a series reluctance S, with the drop Hl across S, and the flux Φ shown around the loop.</desc><rect width="100%" height="100%" fill="white"/><rect x="130" y="120" width="270" height="210" fill="white" stroke="#203246" stroke-width="4"/><rect x="180" y="160" width="165" height="130" fill="white" stroke="#203246" stroke-width="4"/><rect x="155" y="140" width="217" height="170" fill="none" stroke="#203246" stroke-width="2" stroke-dasharray="7 5"/><g fill="none" stroke="#203246" stroke-width="2"><ellipse cx="155" cy="180" rx="20" ry="4"/><ellipse cx="155" cy="194" rx="20" ry="4"/><ellipse cx="155" cy="208" rx="20" ry="4"/><ellipse cx="155" cy="222" rx="20" ry="4"/><ellipse cx="155" cy="236" rx="20" ry="4"/><ellipse cx="155" cy="250" rx="20" ry="4"/><ellipse cx="155" cy="264" rx="20" ry="4"/><path d="M60 180H135M60 264H135M80 166H120"/></g><g fill="#203246"><circle cx="56" cy="180" r="4"/><circle cx="56" cy="264" r="4"/><polygon points="124,166 116,161 116,171"/><polygon points="86,264 94,259 94,269"/></g><text x="92" y="158" font-family="Arial" font-size="18" font-style="italic" fill="#16324f">I</text><text x="250" y="136" font-family="Arial" font-size="16" fill="#16324f">Φ</text><text x="200" y="240" font-family="Arial" font-size="22" font-style="italic" fill="#16324f">N</text><line x1="421" y1="242" x2="380" y2="231" stroke="#203246" stroke-width="1.5"/><polygon points="373,229 383.7,227.7 381.6,235.5" fill="#203246"/><text x="425" y="247" font-family="Arial" font-size="16" fill="#16324f">Flux</text><polygon points="418,208 450,208 450,198 472,215 450,232 450,222 418,222" fill="#203246"/><g fill="none" stroke="#203246" stroke-width="4" stroke-linecap="round"><path d="M530 120H840V200"/><path d="M840 260V330H530V251"/><path d="M530 120V199"/><path d="M840 200L840 208L828 214L852 222L828 230L852 238L828 246L852 254L840 260"/></g><circle cx="530" cy="225" r="26" fill="white" stroke="#203246" stroke-width="4"/><path d="M530 251V330" stroke="#203246" stroke-width="4" fill="none"/><line x1="650" y1="120" x2="686" y2="120" stroke="#203246" stroke-width="3"/><polygon points="694,120 684,115 684,125" fill="#203246"/><g font-family="Arial" fill="#16324f"><text x="664" y="104" font-size="18" font-style="italic">Φ</text><text x="512" y="190" font-size="20">+</text><text x="512" y="278" font-size="20">−</text><text x="566" y="232" font-size="18"><tspan font-style="italic">F</tspan>=NI</text><text x="862" y="192" font-size="20">+</text><text x="862" y="278" font-size="20">−</text><text x="806" y="240" font-size="18" text-anchor="end" font-style="italic">Hl</text><text x="880" y="236" font-size="20" font-style="italic">S</text></g><text x="450" y="390" text-anchor="middle" font-family="Arial" font-size="16" fill="#16324f">Figure 3.7: Simple magnetic circuit</text></svg>
