<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-labelledby="title desc"><title id="title">Phasor diagram of leading and lagging phase</title><desc id="desc">Voltage phasor V and current phasor I drawn from the origin, measured counter-clockwise from the real reference axis at angles phi1 and phi2. V leads I by phi, the difference phi1 minus phi2.</desc><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#203246"/></marker><marker id="arb" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0b72b9"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M60 300H640" stroke="#203246" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M300 330V40" stroke="#203246" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M360 300A60 60 0 0 0 338.6 254" stroke="#203246" stroke-width="2" fill="none"/><path d="M390 300A90 90 0 0 0 384.6 269.2" stroke="#203246" stroke-width="2" fill="none"/><path d="M300 300L441.4 131.5" stroke="#0b72b9" stroke-width="4" fill="none" marker-end="url(#arb)"/><path d="M300 300L487.9 231.6" stroke="#16324f" stroke-width="4" fill="none" marker-end="url(#ar)"/><g fill="#16324f" font-family="Arial"><text x="300" y="26" text-anchor="middle" font-size="18">Imaginary (+j)</text><text x="640" y="326" text-anchor="end" font-size="18">Real (Reference Axis)</text><text x="346" y="200" text-anchor="middle" font-size="20">φ<tspan baseline-shift="sub" font-size="14">1</tspan></text><text x="408" y="285" text-anchor="middle" font-size="20">φ<tspan baseline-shift="sub" font-size="14">2</tspan></text><text x="455" y="118" font-size="20" font-weight="700" fill="#0b72b9">V (Leads I by φ)</text><text x="500" y="245" font-size="20" font-weight="700">I (Lags V)</text></g></svg>
