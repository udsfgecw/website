<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 600" role="img" aria-labelledby="title desc"><title id="title">Magnetic core with Gap a and Gap b and its magnetic circuit</title><desc id="desc">Part (a): a core with two windows and a centre limb carrying a coil with current I. Gap a is a slot in the left outer leg and Gap b is a slot in the right outer leg. A dashed flux path runs around the core and through the centre limb. Part (b): the magnetic circuit with reluctances Sa (left branch), Sb (right branch) and Sc (centre branch), a magnetomotive force F in the centre branch, and fluxes Φa, Φb and Φc.</desc><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#203246"/></marker></defs><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="#203246" stroke-width="4" stroke-linejoin="round"><path d="M165 40H515V150H485"/><path d="M485 160H515V275H165V160H205"/><path d="M205 145H165V40"/><path d="M205 145V75H315V240H205V160"/><path d="M355 75H485V150"/><path d="M485 160V240H355V75"/><path d="M315 75V240M355 75V240"/></g><rect x="185" y="58" width="310" height="200" fill="none" stroke="#203246" stroke-width="2" stroke-dasharray="7 5"/><path d="M335 58V258" fill="none" stroke="#203246" stroke-width="2" stroke-dasharray="7 5"/><g fill="none" stroke="#203246" stroke-width="2"><ellipse cx="335" cy="110" rx="18" ry="4"/><ellipse cx="335" cy="128" rx="18" ry="4"/><ellipse cx="335" cy="146" rx="18" ry="4"/><ellipse cx="335" cy="164" rx="18" ry="4"/><ellipse cx="335" cy="182" rx="18" ry="4"/><ellipse cx="335" cy="200" rx="18" ry="4"/><path d="M240 110H317M240 200H317" stroke-width="2.5"/></g><g fill="#203246"><circle cx="240" cy="110" r="3.5"/><circle cx="240" cy="200" r="3.5"/><polygon points="278,110 268,105 268,115"/><polygon points="262,200 272,195 272,205"/></g><text x="262" y="96" font-family="Arial" font-size="18" font-style="italic" fill="#16324f">I</text><text x="148" y="157" text-anchor="end" font-family="Arial" font-size="16" fill="#16324f">Gap <tspan font-style="italic">a</tspan></text><text x="528" y="165" font-family="Arial" font-size="16" fill="#16324f">Gap <tspan font-style="italic">b</tspan></text><text x="340" y="310" text-anchor="middle" font-family="Arial" font-size="16" fill="#16324f">(a) Core</text><g fill="none" stroke="#203246" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M150 370H530"/><path d="M150 520H530"/><path d="M150 370V395"/><path d="M150 495V520"/><path d="M530 370V395"/><path d="M530 495V520"/><path d="M150 395L138 401L162 409L138 417L162 425L138 433L162 441L138 449L162 457L150 463V495"/><path d="M530 395L518 401L542 409L518 417L542 425L518 433L542 441L518 449L542 457L530 463V495"/><path d="M340 370V380"/><path d="M340 380V384L328 390L352 398L328 406L352 414L340 420V436"/><path d="M340 480V520"/></g><circle cx="340" cy="458" r="22" fill="white" stroke="#203246" stroke-width="4"/><path d="M270 400Q215 445 270 490" fill="none" stroke="#203246" stroke-width="2.5" marker-end="url(#ah)"/><path d="M410 400Q465 445 410 490" fill="none" stroke="#203246" stroke-width="2.5" marker-end="url(#ah)"/><path d="M372 500V452" fill="none" stroke="#203246" stroke-width="2.5" marker-end="url(#ah)"/><g font-family="Arial" fill="#16324f"><text x="340" y="465" text-anchor="middle" font-size="18" font-style="italic">F</text><text x="316" y="432" font-size="20">+</text><text x="352" y="498" font-size="20">−</text><text x="120" y="446" text-anchor="end" font-size="18" font-style="italic">S<tspan font-size="12" dy="4">a</tspan></text><text x="556" y="446" font-size="18" font-style="italic">S<tspan font-size="12" dy="4">b</tspan></text><text x="356" y="404" font-size="18" font-style="italic">S<tspan font-size="12" dy="4">c</tspan></text><text x="200" y="450" text-anchor="end" font-size="18" font-style="italic">Φ<tspan font-size="12" dy="4">a</tspan></text><text x="474" y="450" font-size="18" font-style="italic">Φ<t