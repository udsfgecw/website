<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">Magnetic core with two windows and two windings</title><desc id="desc">Part (a): a core with two windows, a left-leg winding carrying current I1 and a right-leg winding carrying current I2. Dashed flux paths are labelled l1, A1 (top path), l2, A2 (right path) and l3, A3 (centre limb path).</desc><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#203246"/></marker></defs><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="#203246" stroke-width="4" stroke-linejoin="round"><path d="M100 50H500V290H100Z"/><path d="M160 90H290V250H160Z"/><path d="M350 90H440V250H350Z"/></g><g fill="none" stroke="#203246" stroke-width="2" stroke-dasharray="7 5"><path d="M112 70H488V270H112Z"/><path d="M320 70V270"/></g><g fill="none" stroke="#203246" stroke-width="2"><ellipse cx="130" cy="130" rx="18" ry="4"/><ellipse cx="130" cy="144" rx="18" ry="4"/><ellipse cx="130" cy="158" rx="18" ry="4"/><ellipse cx="130" cy="172" rx="18" ry="4"/><ellipse cx="130" cy="186" rx="18" ry="4"/><ellipse cx="130" cy="200" rx="18" ry="4"/><ellipse cx="130" cy="214" rx="18" ry="4"/><ellipse cx="470" cy="130" rx="18" ry="4"/><ellipse cx="470" cy="144" rx="18" ry="4"/><ellipse cx="470" cy="158" rx="18" ry="4"/><ellipse cx="470" cy="172" rx="18" ry="4"/><ellipse cx="470" cy="186" rx="18" ry="4"/><ellipse cx="470" cy="200" rx="18" ry="4"/><ellipse cx="470" cy="214" rx="18" ry="4"/><path d="M60 130H112M60 214H112M488 130H560M488 214H560" stroke-width="2.5"/></g><g fill="#203246"><circle cx="56" cy="130" r="4"/><circle cx="56" cy="214" r="4"/><circle cx="564" cy="130" r="4"/><circle cx="564" cy="214" r="4"/><polygon points="96,130 86,125 86,135"/><polygon points="84,214 94,209 94,219"/><polygon points="548,130 538,125 538,135"/><polygon points="548,214 538,209 538,219"/></g><g font-family="Arial" font-size="1