<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Types of induced EMF</title><desc id="desc">Induced EMF divides into dynamically induced EMF and statically induced EMF. Statically induced EMF divides into self-induced EMF, in the same coil, and mutually induced EMF, in a neighboring coil.</desc><rect width="100%" height="100%" fill="white"/><g stroke="#203246" stroke-width="3" fill="none" stroke-linecap="round"><path d="M450 80V110M220 110H600M220 110V150M600 110V150M600 280V320M480 320H760M480 320V360M760 320V360"/></g><g stroke="#203246" stroke-width="3" fill="white"><rect x="340" y="30" width="220" height="50" rx="6"/><rect x="60" y="150" width="320" height="90" rx="6"/><rect x="420" y="150" width="360" height="130" rx="6"/><rect x="350" y="360" width="260" height="70" rx="6"/><rect x="630" y="360" width="260" height="70" rx="6"/></g><g fill="#16324f" font-family="Arial" text-anchor="middle"><text x="450" y="61" font-size="22" font-weight="700">Induced EMF</text><text x="220" y="184" font-size="20" font-weight="700">Dynamically Induced EMF</text><text x="220" y="210" font-size="18">(Conductor moves OR</text><text x="220" y="232" font-size="18">field moves physically)</text><text x="600" y="184" font-size="20" font-weight="700">Statically Induced EMF</text><text x="600" y="210" font-size="18">(Both conductor and magnet</text><text x="600" y="232" font-size="18">are stationary; flux magnitude</text><text x="600" y="254" font-size="18">varies with time)</text><text x="480" y="393" font-size="20" font-weight="700">Self-Induced EMF</text><text x="480" y="417" font-size="18">(In the same coil)</text><text x="760" y="393" font-size="20" font-weight="700">Mutually Induced EMF</text><text x="760" y="417" font-size="18">(In a neighboring coil)</text></g></svg>
