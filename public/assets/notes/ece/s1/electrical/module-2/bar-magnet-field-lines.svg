<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">Bar magnet field lines</title><desc id="desc">Closed magnetic field lines leave the North (N) pole on the left of a bar magnet, loop around it, and enter the South (S) pole on the right. Arrows show the field direction from N to S outside the magnet.</desc><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="#203246" stroke-width="2.5" stroke-linecap="round"><path d="M232 180C200 160 400 160 368 180"/><path d="M232 180C170 130 430 130 368 180"/><path d="M232 180C140 100 460 100 368 180"/><path d="M232 180C110 70 490 70 368 180"/><path d="M368 216C400 236 200 236 232 216"/><path d="M368 216C430 266 170 266 232 216"/><path d="M368 216C460 296 140 296 232 216"/><path d="M368 216C490 326 110 326 232 216"/></g><g fill="#203246"><polygon points="308,165 294,160 294,170"/><polygon points="308,142.5 294,137.5 294,147.5"/><polygon points="308,120 294,115 294,125"/><polygon points="308,97.5 294,92.5 294,102.5"/><polygon points="292,231 306,226 306,236"/><polygon points="292,253.5 306,248.5 306,258.5"/><polygon points="292,276 306,271 306,281"/><polygon points="292,298.5 306,293.5 306,303.5"/></g><rect x="230" y="180" width="140" height="36" fill="white" stroke="#203246" stroke-width="3"/><line x1="300" y1="180" x2="300" y2="216" stroke="#203246" stroke-width="2"/><g fill="#16324f" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle"><text x="265" y="205">N</text><text x="335" y="205">S</text></g><text x="300" y="342" text-anchor="middle" font-family="Arial" font-size="15" fill="#16324f">Figure 3.1: Magnetic field around a bar magnet</text></svg>
