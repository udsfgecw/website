/text><text x="502" y="218" font-size="18" text-anchor="middle">2</text><g font-size="16" font-weight="700"><text x="236" y="52">A</text><text x="430" y="64">B</text><text x="598" y="80">C</text><text x="600" y="342">D</text><text x="430" y="334">E</text><text x="244" y="324">F</text></g></g><text x="330" y="372" text-anchor="middle" font-family="Arial" font-size="16" fill="#16324f">Figure 3.12: A series-parallel magnetic circuit</text></svg>
