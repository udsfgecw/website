<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-labelledby="title desc"><title id="title">Coil rotating between N and S poles</title><desc id="desc">A rectangular coil rotates with angular velocity omega inside a magnetic field B between an N-pole and an S-pole. Coil positions (a) and (b) are shown, with the axis of coil rotation through the centre O.</desc><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#203246"/></marker></defs><rect width="100%" height="100%" fill="white"/><g stroke="#203246" stroke-width="3" fill="white"><rect x="40" y="60" width="170" height="260"/><rect x="470" y="60" width="170" height="260"/></g><path d="M222 190H300" stroke="#203246" stroke-width="3" fill="none" marker-end="url(#ar)"/><path d="M340 90V300" stroke="#203246" stroke-width="2" stroke-dasharray="8 6" fill="none"/><path d="M374.5 161.1A45 45 0 0 1 374.5 218.9" stroke="#0b72b9" stroke-width="3" fill="none"/><path d="M321 262L359 118" stroke="#203246" stroke-width="7" stroke-linecap="round"/><circle cx="340" cy="190" r="4" fill="#203246"/><circle cx="359" cy="118" r="6" fill="#0b72b9"/><circle cx="321" cy="262" r="6" fill="#0b72b9"/><g fill="#16324f" font-family="Arial"><text x="125" y="44" text-anchor="middle" font-size="22" font-weight="700">N-Pole</text><text x="555" y="44" text-anchor="middle" font-size="22" font-weight="700">S-Pole</text><text x="125" y="198" text-anchor="middle" font-size="26" font-weight="700">B</text><text x="555" y="198" text-anchor="middle" font-size="26" font-weight="700">B</text><text x="384" y="114" font-size="18">(b)</text><text x="292" y="288" text-anchor="end" font-size="18">(a)</text><text x="350" y="214" font-size="18">O</text><text x="402" y="197" font-size="22" fill="#0b72b9">ω</text><text x="340" y="340" text-anchor="middle" font-size="18">Axis of coil rotation</text></g></svg>
