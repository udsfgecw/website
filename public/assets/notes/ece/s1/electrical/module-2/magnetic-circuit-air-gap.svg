" dy="4">g</tspan></text></g><polygon points="352,163 388,163 388,153 410,173 388,193 388,183 352,183" fill="#203246"/><g fill="none" stroke="#203246" stroke-width="4" stroke-linecap="round"><path d="M460 110H530"/><path d="M600 110H690"/><path d="M530 110L538 104L548 116L558 104L568 116L578 104L588 116L596 110"/><path d="M690 110V170"/><path d="M690 170V176L678 182L702 190L678 198L702 206L678 214L690 220V240"/><path d="M690 240V300H460V239"/><path d="M460 110V191"/></g><circle cx="460" cy="215" r="24" fill="white" stroke="#203246" stroke-width="4"/><polygon points="460,96 454,110 466,110" fill="#203246"/><g font-family="Arial" fill="#16324f"><text x="460" y="220" text-anchor="middle" font-size="16"><tspan font-style="italic">N</tspan>I</text><text x="424" y="200" font-size="20">+</text><text x="424" y="248" font-size="20">−</text><text x="426" y="150" font-size="16" font-style="italic">Φ</text><text x="552" y="94" font-size="16" text-anchor="middle"><tspan font-style="italic">S</tspan><tspan font-size="12" dy="4">i</tspan></text><text x="566" y="142" font-size="16" text-anchor="middle">+ <tspan font-style="italic">H</tspan><tspan font-size="12" dy="4">i</tspan><tspan font-style="italic" dy="-4">l</tspan><tspan font-size="12" dy="4">i</tspan><tspan dy="-4"> −</tspan></text><text x="660" y="205" font-size="16" text-anchor="end"><tspan font-style="italic">H</tspan><tspan font-size="12" dy="4">g</tspan><tspan font-style="italic" dy="-4">l</tspan><tspan font-size="12" dy="4">g</tspan></text><text x="702" y="166" font-size="20">+</text><text x="702" y="262" font-size="20">−</text></g><text x="400" y="340" text-anchor="middle" font-family="Arial" font-size="16" fill="#16324f">Figure 3.8: Magnetic circuit with air gap</text></svg>
