<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-labelledby="title desc"><title id="title">AC source across a resistor</title><desc id="desc">An AC voltage source v(t) is connected across a pure resistor R. The current i(t) flows around the loop in the direction of the arrow.</desc><defs><marker id="arb" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0b72b9"/></marker></defs><rect width="100%" height="100%" fill="white"/><g stroke="#203246" stroke-width="3" fill="none" stroke-linejoin="round"><path d="M300 120H150V192M150 248V320H650V120H500"/><path d="M300 120H320L330 100L350 140L370 100L390 140L410 100L430 140L450 100L470 140L480 120H500"/></g><circle cx="150" cy="220" r="28" fill="white" stroke="#203246" stroke-width="3"/><path d="M200 120H250" stroke="#0b72b9" stroke-width="4" fill="none" marker-end="url(#arb)"/><g fill="#16324f" font-family="Arial"><text x="150" y="230" text-anchor="middle" font-size="30">~</text><text x="104" y="228" text-anchor="end" font-size="20">v(t)</text><text x="400" y="88" text-anchor="middle" font-size="22">R</text><text x="225" y="98" text-anchor="middle" font-size="20" fill="#0b72b9">i(t)</text></g></svg>
