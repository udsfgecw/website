<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Voltage and impedance triangles for series RL</title><desc id="desc">Voltage triangle for a series RL circuit with sides V_R equal to I R, V_L equal to I X_L, and hypotenuse V at angle phi. Impedance triangle with sides R, X_L and hypotenuse Z at angle phi.</desc><rect width="100%" height="100%" fill="white"/><g stroke="#203246" stroke-width="3.5" fill="none" stroke-linejoin="round"><path d="M60 300H260V120Z"/><path d="M500 300H700V120Z"/><path d="M110 300A50 50 0 0 0 97.2 266.5"/><path d="M550 300A50 50 0 0 0 537.2 266.5"/></g><g fill="#16324f" font-family="Arial"><text x="160" y="80" text-anchor="middle" font-size="22" font-weight="700">Voltage Triangle (RL)</text><text x="600" y="80" text-anchor="middle" font-size="22" font-weight="700">Impedance Triangle (RL)</text><text x="134" y="206" text-anchor="end" font-size="20">V</text><text x="278" y="214" font-size="20">V<tspan baseline-shift="sub" font-size="14">L</tspan> = I·X<tspan baseline-shift="sub" font-size="14">L</tspan></text><text x="160" y="336" text-anchor="middle" font-size="20">V<tspan baseline-shift="sub" font-size="14">R</tspan> = I·R</text><text x="128" y="282" text-anchor="middle" font-size="20">φ</text><text x="616" y="170" text-anchor="end" font-size="20">Z</text><text x="716" y="215" font-size="20">X<tspan baseline-shift="sub" font-size="14">L</tspan></text><text x="600" y="336" text-anchor="middle" font-size="20">R</text><text x="568" y="282" text-anchor="middle" font-size="20">φ</text></g></svg>
