<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Balanced delta (mesh) connection</title><desc id="desc">Balanced delta connection. Three phase impedances Z_ph form a closed loop. Line conductors R, Y and B connect to its three corners. Phase currents are I_RY = I_ph, I_YB and I_BR, and line currents are I_R, I_Y and I_B.</desc><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#203246"/></marker></defs><rect width="100%" height="100%" fill="white"/><g stroke="#203246" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M420 130L300 330H540Z"/><path d="M120 130H420M180 130H230" marker-end="url(#ar)"/><path d="M120 330H300M180 330H230" marker-end="url(#ar)"/><path d="M720 330H540M660 330H610" marker-end="url(#ar)"/></g><g fill="#203246"><circle cx="420" cy="130" r="6"/><circle cx="300" cy="330" r="6"/><circle cx="540" cy="330" r="6"/></g><g fill="#16324f" font-family="Arial"><text x="120" y="108" font-size="20">Line R (I<tspan baseline-shift="sub" font-size="14">R</tspan>)</text><text x="120" y="308" font-size="20">Line B (I<tspan baseline-shift="sub" font-size="14">B</tspan>)</text><text x="630" y="308" text-anchor="middle" font-size="20">Line Y (I<tspan baseline-shift="sub" font-size="14">Y</tspan>)</text><text x="322" y="222" text-anchor="end" font-size="20">[Z<tspan baseline-shift="sub" font-size="14">ph</tspan>] (I<tspan baseline-shift="sub" font-size="14">BR</tspan>)</text><text x="530" y="222" font-size="20">[Z<tspan baseline-shift="sub" font-size="14">ph</tspan>] (I<tspan baseline-shift="sub" font-size="14">RY</tspan> = I<tspan baseline-shift="sub" font-size="14">ph</tspan>)</text><text x="420" y="372" text-anchor="middle" font-size="20">[Z<tspan baseline-shift="sub" font-size="14">ph</tspan>] (I<tspan baseline-shift="sub" font-size="14">YB</tspan>)</text></g></svg>
