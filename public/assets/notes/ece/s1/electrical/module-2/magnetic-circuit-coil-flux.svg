<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-labelledby="title desc"><title id="title">Magnetic core with coil carrying current I producing flux Φ</title><desc id="desc">A square magnetic core with a window. A coil of turns on the left leg is fed by current I through two leads. The dashed closed path inside the core shows the magnetic flux Φ, labelled Flux. The panel is titled Magnetic circuit and is captioned: the closed path for magnetic flux is called magnetic circuit; the last caption line reads: the cause of generation of flux (cut off in the source scan).</desc><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="#203246" stroke-width="2"><rect x="4" y="4" width="392" height="56"/><rect x="4" y="60" width="392" height="270"/><rect x="4" y="330" width="392" height="96"/></g><text x="200" y="38" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#16324f">Magnetic circuit</text><rect x="90" y="110" width="210" height="160" fill="white" stroke="#203246" stroke-width="4"/><rect x="125" y="140" width="140" height="100" fill="white" stroke="#203246" stroke-width="4"/><g fill="none" stroke="#203246" stroke-width="2"><ellipse cx="107" cy="150" rx="16" ry="4"/><ellipse cx="107" cy="164" rx="16" ry="4"/><ellipse cx="107" cy="178" rx="16" ry="4"/><ellipse cx="107" cy="192" rx="16" ry="4"/><ellipse cx="107" cy="206" rx="16" ry="4"/><ellipse cx="107" cy="220" rx="16" ry="4"/><ellipse cx="107" cy="234" rx="16" ry="4"/></g><g stroke="#203246" stroke-width="2" fill="none"><path d="M50 150H91"/><path d="M50 234H91"/><path d="M60 136H100"/><rect x="108" y="122" width="174" height="136" stroke-dasharray="7 5" stroke-width="2"/></g><g fill="#203246"><circle cx="46" cy="150" r="4"/><circle cx="46" cy="234" r="4"/><polygon points="104,136 96,131 96,141"/><polygon points="70,234 78,229 78,239"/></g><text x="72" y="128" font-family="Arial" font-size="18" font-style="italic" fill="#16324f">I</text><text x="196" y="136" font-family="Arial" font-size="16" fill="#16324f">Φ</text><line x1="314" y1="198" x2="288" y2="198" stroke="#203246" stroke-width="1.5"/><polygon points="284,198 292,194 292,202" fill="#203246"/><text x="318" y="203" font-family="Arial" font-size="14" fill="#16324f">Flux</text><g font-family="Arial" font-size="15" fill="#16324f"><text x="20" y="356">The closed path for magnetic</text><text x="20" y="374">flux is called magnetic circuit.</text><text x="20" y="402">The cause of generation of flux</text></g></svg>
