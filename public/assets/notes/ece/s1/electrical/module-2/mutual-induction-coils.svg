<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="title desc"><title id="title">Mutually induced EMF between two coils</title><desc id="desc">Current i1 in Coil 1 with N1 turns produces flux Phi-12, part of which links Coil 2 with N2 turns. The changing flux induces emf e_M2 in Coil 2.</desc><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#203246"/></marker><marker id="arb" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0b72b9"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M30 105H86" stroke="#203246" stroke-width="3" fill="none" marker-end="url(#ar)"/><rect x="90" y="60" width="140" height="90" rx="6" fill="white" stroke="#203246" stroke-width="3"/><path d="M232 105H426" stroke="#0b72b9" stroke-width="6" fill="none" marker-end="url(#arb)"/><rect x="430" y="60" width="140" height="90" rx="6" fill="white" stroke="#203246" stroke-width="3"/><path d="M572 105H720" stroke="#203246" stroke-width="3" fill="none" marker-end="url(#ar)"/><g fill="#16324f" font-family="Arial"><text x="40" y="92" font-size="20">i₁</text><text x="160" y="98" text-anchor="middle" font-size="20" font-weight="700">Coil 1</text><text x="160" y="126" text-anchor="middle" font-size="18">(N₁)</text><text x="330" y="92" text-anchor="middle" font-size="20">Φ<tspan baseline-shift="sub" font-size="14">12</tspan></text><text x="500" y="98" text-anchor="middle" font-size="20" font-weight="700">Coil 2</text><text x="500" y="126" text-anchor="middle" font-size="18">(N₂)</text><text x="646" y="92" text-anchor="middle" font-size="18">Induced emf</text><text x="646" y="132" text-anchor="middle" font-size="20">e<tspan baseline-shift="sub" font-size="14">M2</tspan></text></g></svg>
