<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Series RLC circuit</title><desc id="desc">Resistor R, inductor L and capacitor C in series across an AC supply V with a common current I. Voltage drops V_R, V_L and V_C are shown across the three elements.</desc><defs><marker id="arb" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#0b72b9"/></marker></defs><rect width="100%" height="100%" fill="white"/><g stroke="#203246" stroke-width="3" fill="none" stroke-linejoin="round"><path d="M120 120H220M380 120H420M580 120H630M650 120H740V320H120V248M120 192V120"/><path d="M220 120H240L250 100L270 140L290 100L310 140L330 100L350 140L370 100L380 120"/><path d="M420 120a16 16 0 0 1 32 0a16 16 0 0 1 32 0a16 16 0 0 1 32 0a16 16 0 0 1 32 0a16 16 0 0 1 32 0"/><path d="M630 100V140M650 100V140" stroke-width="5"/></g><circle cx="120" cy="220" r="28" fill="white" stroke="#203246" stroke-width="3"/><path d="M150 120H200" stroke="#0b72b9" stroke-width="4" fill="none" marker-end="url(#arb)"/><g fill="#16324f" font-family="Arial"><text x="120" y="230" text-anchor="middle" font-size="30">~</text><text x="80" y="228" text-anchor="end" font-size="20">V</text><text x="175" y="98" text-anchor="middle" font-size="20" fill="#0b72b9">I</text><text x="300" y="80" text-anchor="middle" font-size="20">V<tspan baseline-shift="sub" font-size="14">R</tspan></text><text x="500" y="80" text-anchor="middle" font-size="20">V<tspan baseline-shift="sub" font-size="14">L</tspan></text><text x="640" y="80" text-anchor="middle" font-size="20">V<tspan baseline-shift="sub" font-size="14">C</tspan></text><text x="300" y="176" text-anchor="middle" font-size="22">R</text><text x="500" y="176" text-anchor="middle" font-size="22">L</text><text x="640" y="176" text-anchor="middle" font-size="22">C</text></g></svg>
