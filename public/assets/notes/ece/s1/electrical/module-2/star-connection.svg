<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="title desc"><title id="title">Balanced star (wye) connection</title><desc id="desc">Balanced star connection. Line terminals R, Y and B feed three phase impedances Z_ph that join at the neutral point N. The line current I_L equals the phase current I_ph. Phase voltages are V_RN, V_YN and V_BN, and a neutral wire leaves N.</desc><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#203246"/></marker></defs><rect width="100%" height="100%" fill="white"/><g stroke="#203246" stroke-width="3" fill="none" stroke-linecap="round"><path d="M120 120H380M180 120H230" marker-end="url(#ar)"/><path d="M380 120V280"/><path d="M380 280L241.4 360"/><path d="M380 280L518.6 360"/><path d="M241.4 360H170"/><path d="M518.6 360H620"/><path d="M60 280H640"/></g><rect x="352" y="182" width="56" height="36" fill="white" stroke="#203246" stroke-width="3"/><rect transform="translate(310.7 320) rotate(-30)" x="-28" y="-18" width="56" height="36" fill="white" stroke="#203246" stroke-width="3"/><rect transform="translate(449.3 320) rotate(30)" x="-28" y="-18" width="56" height="36" fill="white" stroke="#203246" stroke-width="3"/><circle cx="380" cy="280" r="6" fill="#203246"/><g fill="#16324f" font-family="Arial"><text x="120" y="104" font-size="20">Line R</text><text x="275" y="104" text-anchor="middle" font-size="20">I<tspan baseline-shift="sub" font-size="14">L</tspan> = I<tspan baseline-shift="sub" font-size="14">ph</tspan></text><text x="424" y="196" font-size="20">[Z<tspan baseline-shift="sub" font-size="14">ph</tspan>]</text><text x="424" y="224" font-size="20">(V<tspan baseline-shift="sub" font-size="14">ph</tspan> = V<tspan baseline-shift="sub" font-size="14">RN</tspan>)</text><text x="262" y="318" text-anchor="end" font-size="20">(V<tspan baseline-shift="sub" font-size="14">YN</tspan>) [Z<tspan baseline-shift="sub" font-size="14">ph</tspan>]</text><text x="498" y="318" font-size="20">[Z<tspan baseline-shift="sub" font-size="14">ph</tspan>] (V<tspan baseline-shift="sub" font-size="14">BN</tspan>)</text><text x="60" y="366" font-size="20">Line Y</text><text x="632" y="366" font-size="20">Line B</text><text x="60" y="268" font-size="20">Neutral N</text><text x="656" y="286" font-size="20">(Neutral Wire)</text></g></svg>
