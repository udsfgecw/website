<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="title desc"><title id="title">CE output characteristics</title><desc id="desc">Collector current I_C against collector-emitter voltage V_CE for base currents of 0, 10, 20, 30 and 40 microamps, with the saturation, active and cut-off regions labelled.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#0b72b9"/></marker></defs><path d="M120 60 L120 380 L740 380" fill="none" stroke="#203246" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="120,54 114,68 126,68" fill="#203246" stroke="#203246" stroke-width="2" stroke-linejoin="round"/><polygon points="746,380 732,374 732,386" fill="#203246" stroke="#203246" stroke-width="2" stroke-linejoin="round"/><path d="M128 380 L140 330 L640 324" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="652" y="336" text-anchor="start" font-family="Arial" font-size="18" fill="#16324f">I<tspan baseline-shift="sub" font-size="13">B</tspan> = 10 µA</text><path d="M128 380 L140 280 L640 274" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="652" y="286" text-anchor="start" font-family="Arial" font-size="18" fill="#16324f">I<tspan baseline-shift="sub" font-size="13">B</tspan> = 20 µA</text><path d="M128 380 L140 230 L640 224" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="652" y="236" text-anchor="start" font-family="Arial" font-size="18" fill="#16324f">I<tspan baseline-shift="sub" font-size="13">B</tspan> = 30 µA</text><path d="M128 380 L140 180 L640 174" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="652" y="186" text-anchor="start" font-family="Arial" font-size="18" fill="#16324f">I<tspan baseline-shift="sub" font-size="13">B</tspan> = 40 µA</text><text x="520" y="366" text-anchor="middle" font-family="Arial" font-size="18" fill="#16324f">I<tspan baseline-shift="sub" font-size="13">B</tspan> = 0 (Cut-off)</text><text x="380" y="258" text-anchor="middle" font-family="Arial" font-size="18" fill="#16324f">Active Region (I<tspan baseline-shift="sub" font-size="13">C</tspan> = β I<tspan baseline-shift="sub" font-size="13">B</tspan>)</text><text x="160" y="150" text-anchor="start" font-family="Arial" font-size="18" fill="#16324f">Saturation</text><text x="112" y="402" text-anchor="end" font-family="Arial" font-size="16" fill="#16324f">0</text><text x="150" y="402" text-anchor="start" font-family="Arial" font-size="16" fill="#16324f">V<tspan baseline-shift="sub" font-size="11">CE(sat)</tspan> (~0.2 V)</text><text x="128" y="44" text-anchor="start" font-family="Arial" font-size="20" fill="#16324f">I<tspan baseline-shift="sub" font-size="14">C</tspan> (mA)</text><text x="690" y="412" text-anchor="middle" font-family="Arial" font-size="20" fill="#16324f">V<tspan baseline-shift="sub" font-size="14">CE</tspan> (V)</text></svg>
