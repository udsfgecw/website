<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 250" role="img" aria-labelledby="title desc"><title id="title">Regulated DC power supply block diagram</title><desc id="desc">Four stages in series: transformer, rectifier, filter and voltage regulator, converting 230 V 50 Hz AC mains to regulated DC output.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#0b72b9"/></marker></defs><rect x="200" y="95" width="160" height="80" fill="none" stroke="#203246" stroke-width="3.5"/><text x="280" y="141" text-anchor="middle" font-family="Arial" font-size="20" fill="#16324f" font-weight="700">Transformer</text><text x="280" y="196" text-anchor="middle" font-family="Arial" font-size="20" fill="#16324f"><tspan x="280" dy="0">Steps down AC</tspan></text><rect x="400" y="95" width="160" height="80" fill="none" stroke="#203246" stroke-width="3.5"/><text x="480" y="141" text-anchor="middle" font-family="Arial" font-size="20" fill="#16324f" font-weight="700">Rectifier</text><text x="480" y="196" text-anchor="middle" font-family="Arial" font-size="20" fill="#16324f"><tspan x="480" dy="0">AC to</tspan><tspan x="480" dy="24">Pulsating DC</tspan></text><rect x="600" y="95" width="160" height="80" fill="none" stroke="#203246" stroke-width="3.5"/><text x="680" y="141" text-anchor="middle" font-family="Arial" font-size="20" fill="#16324f" font-weight="700">Filter</text><text x="680" y="196" text-anchor="middle" font-family="Arial" font-size="20" fill="#16324f"><tspan x="680" dy="0">Smooths ripples</tspan></text><rect x="800" y="95" width="160" height="80" fill="none" stroke="#203246" stroke-width="3.5"/><text x="880" y="141" text-anchor="middle" font-family="Arial" font-size="20" fill="#16324f" font-weight="700">Regulator</text><text x="880" y="196" text-anchor="middle" font-family="Arial" font-size="20" fill="#16324f"><tspan x="880" dy="0">Constant DC</tspan><tspan x="880" dy="24">voltage</tspan></text><path d="M360 135 L400 135" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M560 135 L600 135" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M760 135 L800 135" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="20" y="122" text-anchor="start" font-family="Arial" font-size="18" fill="#16324f">230V, 50Hz</text><text x="20" y="146" text-anchor="start" font-family="Arial" font-size="18" fill="#16324f">AC Mains</text><path d="M130 135 L200 135" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M960 135 L1010 135" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="1020" y="122" text-anchor="start" font-family="Arial" font-size="18" fill="#16324f">Regulated</text><text x="1020" y="146" text-anchor="start" font-family="Arial" font-size="18" fill="#16324f">DC Output</text><text x="1020" y="170" text-anchor="start" font-family="Arial" font-size="18" fill="#16324f">(Load)</text></svg>
