<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 470" role="img" aria-labelledby="title desc"><title id="title">BJT low-side switch</title><desc id="desc">Control signal drives NPN base through R_B. Load connects from VCC to the collector, and emitter returns to ground.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#0b72b9"/></marker></defs><text x="320" y="40" text-anchor="middle" font-family="Arial" font-size="20" fill="#16324f" font-weight="700">VCC</text><path d="M320 50 L320 90" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="275" y="90" width="90" height="60" fill="none" stroke="#203246" stroke-width="3.5"/><text x="320" y="126" text-anchor="middle" font-family="Arial" font-size="20" fill="#16324f">Load</text><path d="M320 150 L320 180" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 215 L320 200 L320 180" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 285 L320 300 L320 400" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 215 L300 285" fill="none" stroke="#203246" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M308 293 L318 300" fill="none" stroke="#0b72b9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M320 400 L320 412" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M304 412 L336 412" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M310 419 L330 419" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M316 426 L324 426" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 250 L120 250" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 250 L138.75 250 L141.875 259 L145 241 L148.125 259 L151.25 241 L154.375 259 L157.5 241 L160.625 259 L163.75 241 L166.875 259 L170 241 L173.125 259 L176.25 250 L195 250" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M195 250 L300 250" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="236" text-anchor="start" font-family="Arial" font-size="18" fill="#16324f">Control</text><text x="157" y="226" text-anchor="middle" font-family="Arial" font-size="18" fill="#16324f">R<tspan baseline-shift="sub" font-size="13">B</tspan></text><text x="262" y="240" text-anchor="end" font-family="Arial" font-size="20" fill="#16324f">B</text><text x="335" y="198" text-anchor="start" font-family="Arial" font-size="20" fill="#16324f">C</text><text x="335" y="312" text-anchor="start" font-family="Arial" font-size="20" fill="#16324f">E</text><text x="350" y="262" text-anchor="start" font-family="Arial" font-size="18" fill="#16324f">NPN</text><text x="338" y="442" text-anchor="start" font-family="Arial" font-size="18" fill="#16324f">ground</text></svg>
