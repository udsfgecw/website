0" text-anchor="start" font-family="Arial" font-size="18" fill="#16324f">forward conduction</text><text x="200" y="440" text-anchor="end" font-family="Arial" font-size="18" fill="#16324f">breakdown region</text><text x="432" y="420" text-anchor="start" font-family="Arial" font-size="18" fill="#16324f">small reverse saturation current (−I<tspan baseline-shift="sub" font-size="13">S</tspan>)</text></svg>
