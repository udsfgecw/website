<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">PN junction at formation (unbiased)</title><desc id="desc">P-region with holes, depletion region with immobile acceptor and donor ions, and N-region with electrons. Barrier potential V0 and depletion width Wd are marked.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#0b72b9"/></marker></defs><rect x="60" y="120" width="780" height="180" fill="none" stroke="#203246" stroke-width="3.5"/><path d="M340 120 L340 300" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 120 L560 300" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 120 L450 300" fill="none" stroke="#203246" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><text x="200" y="90" text-anchor="middle" font-family="Arial" font-size="22" fill="#16324f" font-weight="700">P-region</text><text x="200" y="114" text-anchor="middle" font-family="Arial" font-size="18" fill="#16324f">(Majority: Holes)</text><text x="450" y="90" text-anchor="middle" font-family="Arial" font-size="22" fill="#16324f" font-weight="700">Depletion</text><text x="450" y="114" text-anchor="middle" font-family="Arial" font-size="18" fill="#16324f">Region</text><text x="700" y="90" text-anchor="middle" font-family="Arial" font-size="22" fill="#16324f" font-weight="700">N-region</text><text x="700" y="114" text-anchor="middle" font-family="Arial" font-size="18" fill="#16324f">(Majority: Electrons)</text><text x="115" y="167" text-anchor="middle" font-family="Arial" font-size="20" fill="#16324f">(+)</text><text x="200" y="167" text-anchor="middle" font-family="Arial" font-size="20" fill="#16324f">(+)</text><text x="285