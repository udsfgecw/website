<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">NPN and PNP transistor layer structure</title><desc id="desc">NPN has N emitter, thin P base and N collector. PNP has P emitter, thin N base and P collector. The emitter arrow points out for NPN and in for PNP.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6L0 12Z" fill="#0b72b9"/></marker></defs><rect x="60" y="120" width="130" height="140" fill="none" stroke="#203246" stroke-width="3.5"/><rect x="190" y="120" width="60" height="140" fill="none" stroke="#203246" stroke-width="3.5"/><rect x="250" y="120" width="150" height="140" fill="none" stroke="#203246" stroke-width="3.5"/><text x="125" y="200" text-anchor="middle" font-family="Arial" font-size="24" fill="#16324f" font-weight="700">N</text><text x="220" y="200" text-anchor="middle" font-family="Arial" font-size="24" fill="#16324f" font-weight="700">P</text><text x="325" y="200" text-anchor="middle" font-family="Arial" font-size="24" fill="#16324f" font-weight="700">N</text><path d="M20 190 L60 190" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M56 190 L24 190" fill="none" stroke="#0b72b9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="32" y="172" text-anchor="middle" font-family="Arial" font-size="20" fill="#16324f">E</text><path d="M400 190 L440 190" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="452" y="196" text-anchor="start" font-family="Arial" font-size="20" fill="#16324f">C</text><path d="M220 260 L220 330" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="232" y="348" text-anchor="start" font-family="Arial" font-size="20" fill="#16324f">B</text><text x="230" y="95" text-anchor="middle" font-family="Arial" font-size="22" fill="#16324f" font-weight="700">NPN Transistor</text><text x="230" y="400" text-anchor="middle" font-family="Arial" font-size="18" fill="#16324f">Arrow on Emitter points OUT:</text><text x="230" y="424" text-anchor="middle" font-family="Arial" font-size="18" fill="#16324f">&quot;Not Pointing iN&quot;</text><rect x="560" y="120" width="130" height="140" fill="none" stroke="#203246" stroke-width="3.5"/><rect x="690" y="120" width="60" height="140" fill="none" stroke="#203246" stroke-width="3.5"/><rect x="750" y="120" width="150" height="140" fill="none" stroke="#203246" stroke-width="3.5"/><text x="625" y="200" text-anchor="middle" font-family="Arial" font-size="24" fill="#16324f" font-weight="700">P</text><text x="720" y="200" text-anchor="middle" font-family="Arial" font-size="24" fill="#16324f" font-weight="700">N</text><text x="825" y="200" text-anchor="middle" font-family="Arial" font-size="24" fill="#16324f" font-weight="700">P</text><path d="M520 190 L560 190" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M524 190 L556 190" fill="none" stroke="#0b72b9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="530" y="172" text-anchor="middle" font-family="Arial" font-size="20" fill="#16324f">E</text><path d="M900 190 L940 190" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="952" y="196" text-anchor="start" font-family="Arial" font-size="20" fill="#16324f">C</text><path d="M720 260 L720 330" fill="none" stroke="#203246" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="732" y="348" text-anchor="start" font-family="Arial" font-size="20" fill="#16324f">B</text><text x="730" y="95" text-anchor="middle" font-family="Arial" font-size="22" fill="#16324f" font-weight="700">PNP Transistor</text><text x="730" y="400" text-anchor="middle" font-family="Arial" font-size="18" fill="#16324f">Arrow on Emitter points IN:</text><text x="730" y="424" text-anchor="middle" font-family="Arial" font-size="18" fill="#16324f">&quot;Pointing iN Proudly&quot;</text></svg>
