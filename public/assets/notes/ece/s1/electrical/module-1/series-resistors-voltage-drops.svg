" text-anchor="middle" font-size="24" fill="#16324f">V<tspan font-size="16" dy="6">2</tspan></text><text x="655" y="262" text-anchor="middle" font-size="24" fill="#16324f">V<tspan font-size="16" dy="6">3</tspan></text></g></svg>
