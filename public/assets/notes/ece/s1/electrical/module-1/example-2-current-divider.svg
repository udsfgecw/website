<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 395" role="img" aria-labelledby="title desc"><title id="title">Example 2: current source with parallel resistors</title><desc id="desc">A 20 A current source supplies two parallel branches, a 20 Ω resistor and a 40 Ω resistor. The source arrow points up.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#0b72b9"/></marker></defs><g stroke="#203246" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="160,120 160,184"/><polyline points="160,236 160,300"/><polyline points="160,120 330,120"/><polyline points="470,120 640,120"/><polyline points="160,300 330,300"/><polyline points="470,300 640,300"/><polyline points="640,120 640,300"/><polyline points="330,120 358,120 365,106 379,134 393,106 407,134 421,106 435,134 442,120 470,120"/><polyline points="330,300 358,300 365,286 379,314 393,286 407,314 421,286 435,314 442,300 470,300"/></g><circle cx="160" cy="210" r="26" fill="white" stroke="#203246" stroke-width="5"/><line x1="160" y1="224" x2="160" y2="196" stroke="#0b72b9" stroke-width="4" marker-end="url(#arr)"/><g font-family="Arial"><text x="118" y="217" text-anchor="end" font-size="24" fill="#16324f">20 A</text><text x="400" y="92" text-anchor="middle" font-size="24" fill="#16324f">20 Ω</text><text x="400" y="340" text-anchor="middle" font-size="24" fill="#16324f">40 Ω</text><text x="400" y="380" text-anchor="middle" font-size="22" fill="#16324f">(parallel branches)</text></g></svg>
