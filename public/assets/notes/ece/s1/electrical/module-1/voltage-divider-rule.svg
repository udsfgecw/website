<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="title desc"><title id="title">Voltage divider rule</title><desc id="desc">Series resistors R1 and R2 between source voltage Vs and 0 V. Current I flows left to right. Voltages V1 and V2 are shown across R1 and R2.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto"><path d="M0 0L16 8L0 16Z" fill="#0b72b9"/></marker></defs><g stroke="#203246" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="110,170 230,170"/><polyline points="350,170 430,170"/><polyline points="550,170 650,170"/><polyline points="230,170 254,170 260,156 272,184 284,156 296,184 308,156 320,184 326,170 350,170"/><polyline points="430,170 454,170 460,156 472,184 484,156 496,184 508,156 520,184 526,170 550,170"/></g><line x1="175" y1="85" x2="335" y2="85" stroke="#0b72b9" stroke-width="4" marker-end="url(#arr)"/><g font-family="Arial"><text x="30" y="178" text-anchor="start" font-size="24" fill="#16324f">V<tspan font-size="16" dy="6">s</tspan></text><text x="675" y="178" text-anchor="start" font-size="24" fill="#16324f">0 V</text><text x="255" y="62" text-anchor="middle" font-size="24" fill="#0b72b9">I</text><text x="290" y="135" text-anchor="middle" font-size="24" fill="#16324f">R<tspan font-size="16" dy="6">1</tspan></text><text x="490" y="135" text-anchor="middle" font-size="24" fill="#16324f">R<tspan font-size="16" dy="6">2</tspan></text><text x="290" y="240" text-anchor="middle" font-size="24" fill="#16324f">V<tspan font-size="16" dy="6">1</tspan></text><text x="490" y="240" text-anchor="middle" font-size="24" fill="#16324f">V<tspan font-size="16" dy="6">2</tspan></text></g></svg>
