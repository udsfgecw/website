<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">Cathode-ray oscilloscope signal paths</title><desc id="desc">Vertical path: input, attenuator/vertical amplifier, vertical deflection. Horizontal path: trigger circuit, time-base generator, horizontal amplifier, horizontal deflection.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#203246"/></marker><marker id="arrL" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M12 0L0 6L12 12Z" fill="#203246"/></marker></defs><rect x="25" y="90" width="200" height="90" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="125.0" y="141.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">Input</text><rect x="275" y="90" width="200" height="90" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="375.0" y="130.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">attenuator/</text><text x="375.0" y="152.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">vertical amplifier</text><rect x="525" y="90" width="200" height="90" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="625.0" y="141.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">vertical deflection</text><line x1="229" y1="135.0" x2="271" y2="135.0" stroke="#203246" stroke-width="3" marker-end="url(#arr)"/><line x1="479" y1="135.0" x2="521" y2="135.0" stroke="#203246" stroke-width="3" marker-end="url(#arr)"/><rect x="25" y="220" width="200" height="90" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="125.0" y="271.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">Trigger circuit</text><rect x="275" y="220" width="200" height="90" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="375.0" y="260.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">time-base</text><text x="375.0" y="282.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">generator</text><rect x="525" y="220" width="200" height="90" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="625.0" y="260.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">horizontal</text><text x="625.0" y="282.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">amplifier</text><rect x="775" y="220" width="200" height="90" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="875.0" y="260.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">horizontal</text><text x="875.0" y="282.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">deflection</text><line x1="229" y1="265.0" x2="271" y2="265.0" stroke="#203246" stroke-width="3" marker-end="url(#arr)"/><line x1="479" y1="265.0" x2="521" y2="265.0" stroke="#203246" stroke-width="3" marker-end="url(#arr)"/><line x1="729" y1="265.0" x2="771" y2="265.0" stroke="#203246" stroke-width="3" marker-end="url(#arr)"/></svg>
