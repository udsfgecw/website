<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 470" role="img" aria-labelledby="title desc"><title id="title">Superheterodyne receiver</title><desc id="desc">Antenna, RF tuner/amplifier, mixer fed by a local oscillator, IF amplifier/filter, detector/demodulator, audio amplifier and loudspeaker.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#203246"/></marker><marker id="arrL" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M12 0L0 6L12 12Z" fill="#203246"/></marker></defs><rect x="50" y="170" width="200" height="90" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="150.0" y="221.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">Antenna</text><rect x="330" y="170" width="200" height="90" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="430.0" y="210.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">RF tuner/</text><text x="430.0" y="232.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">amplifier</text><rect x="610" y="170" width="200" height="90" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="710.0" y="221.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">Mixer</text><rect x="890" y="170" width="200" height="90" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="990.0" y="210.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">IF amplifier/</text><text x="990.0" y="232.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">filter</text><line x1="254" y1="215.0" x2="326" y2="215.0" stroke="#203246" stroke-width="3" marker-end="url(#arr)"/><line x1="534" y1="215.0" x2="606" y2="215.0" stroke="#203246" stroke-width="3" marker-end="url(#arr)"/><line x1="814" y1="215.0" x2="886" y2="215.0" stroke="#203246" stroke-width="3" marker-end="url(#arr)"/><rect x="610" y="50" width="200" height="70" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="710.0" y="91.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">Local oscillator</text><line x1="710" y1="124" x2="710" y2="166" stroke="#203246" stroke-width="3" marker-end="url(#arr)"/><rect x="890" y="340" width="200" height="90" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="990.0" y="380.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">detector/</text><text x="990.0" y="402.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">demodulator</text><rect x="610" y="340" width="200" height="90" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="710.0" y="380.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">audio</text><text x="710.0" y="402.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">amplifier</text><rect x="330" y="340" width="200" height="90" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="430.0" y="391.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">loudspeaker</text><line x1="990" y1="262" x2="990" y2="336" stroke="#203246" stroke-width="3" marker-end="url(#arr)"/><line x1="886" y1="385" x2="814" y2="385" stroke="#203246" stroke-width="3" marker-end="url(#arr)"/><line x1="606" y1="385" x2="534" y2="385" stroke="#203246" stroke-width="3" marker-end="url(#arr)"/></svg>
