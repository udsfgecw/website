<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 340" role="img" aria-labelledby="title desc"><title id="title">GSM network architecture</title><desc id="desc">Mobile station (MS) linked by radio to the BTS and BSC, which together form the base station subsystem (BSS), connected to the MSC/GMSC and then to other networks.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#203246"/></marker><marker id="arrL" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M12 0L0 6L12 12Z" fill="#203246"/></marker></defs><rect x="25" y="200" width="170" height="80" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="110.0" y="235.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">Mobile Station</text><text x="110.0" y="257.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">(MS)</text><rect x="255" y="200" width="170" height="80" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="340.0" y="246.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">BTS</text><rect x="485" y="200" width="170" height="80" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="570.0" y="246.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">BSC</text><rect x="715" y="200" width="170" height="80" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="800.0" y="246.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">MSC/GMSC</text><rect x="945" y="200" width="170" height="80" rx="8" fill="white" stroke="#203246" stroke-width="3"/><text x="1030.0" y="246.3" font-family="Arial" font-size="18" fill="#16324f" text-anchor="middle">other networks</text><line x1="199" y1="240" x2="251" y2="240" stroke="#203246" stroke-width="3" marker-end="url(#ar