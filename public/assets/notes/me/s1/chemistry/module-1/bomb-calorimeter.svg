<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 440" role="img" aria-labelledby="title desc"><title id="title">Bomb calorimeter</title><desc id="desc">Cross-section of a bomb calorimeter: bomb with fuse wire, crucible, electrodes, oxygen valve, thermometer and stirrer inside a copper calorimeter with water and air jackets.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><rect x="110" y="50" width="380" height="350" rx="18" fill="#e7b98a" stroke="#7a4a1e" stroke-width="3" /><rect x="128" y="70" width="344" height="310" rx="14" fill="#d7ecf8" stroke="#7a4a1e" stroke-width="2" /><rect x="104" y="44" width="392" height="362" rx="24" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 6"/><rect x="215" y="120" width="170" height="230" rx="30" fill="#dfe4ea" stroke="#5b6670" stroke-width="3" /><rect x="236" y="300" width="128" height="36" rx="6" fill="#aeb7c0" stroke="#5b6670" stroke-width="2" /><circle cx="300" cy="318" r="14" fill="#4a3320" stroke="#4a3320" stroke-width="1" /><polyline points="248.0,283.0 352.0,283.0" fill="none" stroke="#b03a2e" stroke-width="2" stroke-dasharray="4 3"/><polyline points="255.0,120.0 255.0,270.0" fill="none" stroke="#1d2b36" stroke-width="3"/><polyline points="345.0,120.0 345.0,270.0" fill="none" stroke="#1d2b36" stroke-width="3"/><rect x="283" y="84" width="34" height="30" rx="4" fill="#f4f4f4" stroke="#1d2b36" stroke-width="2" /><polyline points="300.0,84.0 300.0,60.0" fill="none" stroke="#1d2b36" stroke-width="3"/><polyline points="232.0,130.0 232.0,40.0 190.0,40.0" fill="none" stroke="#1d2b36" stroke-width="2"/><circle cx="186" cy="40" r="6" fill="#1d2b36" stroke="#1d2b36" stroke-width="2.5" /><polyline points="410.0,170.0 440.0,170.0 440.0,110.0" fill="none" stroke="#1d2b36" stroke-width="2"/><rect x="420" y="70" width="60" height="40" rx="6" fill="#e8e8e8" stroke="#1d2b36" stroke-width="2" /><text x="450" y="96" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">6 V</text><text x="20" y="40" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="end" fill="#1d2b36">Beckmann's thermometer</text><polyline points="26.0,34.0 186.0,40.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="455" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Oxygen valve</text><polyline points="449.0,24.0 317.0,84.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="20" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="end" fill="#1d2b36">Electrodes</text><polyline points="26.0,174.0 255.0,180.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="20" y="262" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="end" fill="#b03a2e">Fuse wire</text><polyline points="26.0,256.0 248.0,283.0" fill="none" stroke="#b03a2e" stroke-width="1.6"/><text x="20" y="320" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="end" fill="#1d2b36">Stainless steel bomb</text><polyline points="26.0,314.0 2