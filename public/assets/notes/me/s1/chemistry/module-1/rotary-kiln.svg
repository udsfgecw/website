<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 385" role="img" aria-labelledby="title desc"><title id="title">Rotary kiln</title><desc id="desc">Slanted rotating kiln on roller bearings with drying, calcination and clinkering zones, feed tank, chimney, flame, air blower and clinker outlet.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><path d="M 150 160 L 560 190 L 560 240 L 150 210 Z" fill="#e9dccb" stroke="#6b5b4a" stroke-width="3"/><path d="M 150 160 L 260 170 L 260 220 L 150 210 Z" fill="#f2c8a0" stroke="#6b5b4a" stroke-width="2"/><path d="M 260 170 L 400 180 L 400 230 L 260 220 Z" fill="#f0a36b" stroke="#6b5b4a" stroke-width="2"/><path d="M 400 180 L 560 190 L 560 240 L 400 230 Z" fill="#d9733f" stroke="#6b5b4a" stroke-width="2"/><rect x="120" y="232" width="40" height="40" rx="6" fill="#bdbdbd" stroke="#1d2b36" stroke-width="2" /><rect x="480" y="240" width="60" height="40" rx="6" fill="#bdbdbd" stroke="#1d2b36" stroke-width="2" /><rect x="170" y="40" width="40" height="90" rx="4" fill="#cfcfcf" stroke="#1d2b36" stroke-width="2" /><rect x="40" y="60" width="90" height="60" rx="6" fill="#f5f5f5" stroke="#1d2b36" stroke-width="2" /><polyline points="130.0,90.0 170.0,120.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><text x="210" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Chimney</text><polyline points="204.0,24.0 200.0,44.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="230" y="110" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#b03a2e">Flue gases</text><polyline points="224.0,104.0 200.0,110.0" fill="none" stroke="#b03a2e" stroke-width="1.6"/><text x="40" y="150" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="end" fill="#1d2b36">Dry mix or slurry feed tank</text><polyline points="46.0,144.0 90.0,120.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="210" y="200" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Drying zone</text><polyline points="204.0,194.0 205.0,200.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="330" y="260" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Calcination zone</text><polyline points="324.0,254.0 330.0,230.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="500" y="276" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Clinkering zone</text><polyline points="494.0,270.0 500.0,240.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="600" y="150" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#b03a2e">Hot flame (fuel oil or powdered coal)</text><polyline points="594.0,144.0 560.0,170.0" fill="none" stroke="#b03a2e" stroke-width="1.6"/><text x="500" y="330" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Air inlet</text><polyline points="494.0,324.0 490.0,280.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="580" y="230" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Clinker out</text><polyline points="574.0,224.0 560.0,230.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="300" y="150" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="end" fill="#1d2b36">Refractory bricks lining</text><polyline points="306.0,144.0 300.0,172.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="60" y="362" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="end" fill="#1d2b36">Air blower and dust catcher</text><polyline points="66.0,356.0 140.0,262.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="380" y="362" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Roller bearings and concrete supports</text><polyline points="374.0,356.0 300.0,262.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/></g></svg>
