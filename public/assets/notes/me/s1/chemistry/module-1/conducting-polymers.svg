<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc"><title id="title">Conducting polymers flowchart</title><desc id="desc">Conducting polymers split into intrinsically and extrinsically conducting types, each with two sub-classes.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><rect x="260.0" y="24" width="200" height="52" rx="8" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2.2" /><text x="360" y="46" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Conducting polymers</text><polyline points="360.0,76.0 180.0,120.0" fill="none" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#acc)"/><polyline points="360.0,76.0 540.0,120.0" fill="none" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#acc)"/><rect x="30.0" y="124" width="300" height="52" rx="8" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2.2" /><text x="180" y="146" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Intrinsically conducting</text><rect x="390.0" y="124" width="300" height="52" rx="8" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2.2" /><text x="540" y="146" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Extrinsically conducting</text><polyline points="180.0,176.0 110.0,220.0" fill="none" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#acc)"/><polyline points="180.0,176.0 260.0,220.0" fill="none" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#acc)"/><polyline points="540.0,176.0 440.0,220.0" fill="none" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#acc)"/><polyline points="540.0,176.0 620.0,220.0" fill="none" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#acc)"/><rect x="15.0" y="224" width="190" height="52" rx="8" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2.2" /><text x="110" y="246" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Conjugated π</text><text x="110" y="264" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">electrons</text><rect x="165.0" y="224" width="190" height="52" rx="8" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2.2" /><text x="260" y="246" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Doped conducting</text><text x="260" y="264" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">polymers</text><rect x="345.0" y="224" width="190" height="52" rx="8" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2.2" /><text x="440" y="246" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Conductive-element</text><text x="440" y="264" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">filled polymers</text><rect x="525.0" y="224" width="190" height="52" rx="8" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2.2" /><text x="620" y="246" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Blended conducting</text><text x="620" y="264" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">polymers</text></g></svg>
