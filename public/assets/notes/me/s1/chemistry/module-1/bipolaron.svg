<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 170" role="img" aria-labelledby="title desc"><title id="title">n-doping and bipolaron</title><desc id="desc">Addition of an electron to polyacetylene forms a radical anion (polaron), which propagates along the conjugated chain.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><rect x="40" y="26" width="640" height="44" rx="10" fill="#f7fafc" stroke="#1f6f8b" stroke-width="2" /><text x="360.0" y="56" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#1d2b36">(–CH=CH–)ₙ  +1e⁻→  (–CH=CH–)ₙ⁻•   (polaron)</text><rect x="40" y="72" width="640" height="44" rx="10" fill="#f7fafc" stroke="#1f6f8b" stroke-width="2" /><text x="360.0" y="102" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#1d2b36">Bipolaron propagation through the conjugated chain by shifting double bonds</text></g></svg>
