<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc"><title id="title">Sewage treatment flow</title><desc id="desc">Raw sewage goes through screening and sedimentation (primary), then trickling filter, activated sludge or UASB (secondary), and finally tertiary treatment.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><rect x="20" y="150" width="130" height="46" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="85.0" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Raw sewage</text><rect x="190" y="150" width="130" height="46" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="255.0" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Screening</text><text x="255.0" y="186" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">(residue</text><text x="255.0" y="202" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">removed)</text><rect x="360" y="150" width="150" height="46" rx="6" fill="#fff7e8" stroke="#1f6f8b" stroke-width="2" /><text x="435.0" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Sedimentation</text><text x="435.0" y="186" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">(coagulants added)</text><polyline points="150.0,173.0 190.0,173.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="320.0,173.0 360.0,173.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><text x="440" y="136" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#8a3b10">Primary treatment</text><rect x="560" y="60" width="150" height="46" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="635.0" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Trickling filter</text><rect x="560" y="140" width="150" height="46" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="635.0" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Activated sludge</text><rect x="560" y="220" width="150" height="46" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="635.0" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">UASB process</text><polyline points="510.0,173.0 560.0,83.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="510.0,173.0 560.0,163.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="510.0,173.0 560.0,243.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><text x="635" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#8a3b10">Secondary treatment</text><rect x="200" y="320" width="260" height="46" rx="6" fill="#eaf6ee" stroke="#1f6f8b" stroke-width="2" /><text x="330.0" y="340" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Tertiary: precipitation, N₂</text><text x="330.0" y="356" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">stripping, chlorination</text><polyline points="635.0,270.0 480.0,330.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="560.0,243.0 480.0,340.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/></g></svg>
