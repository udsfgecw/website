<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Reverse osmosis</title><desc id="desc">Sea water above a semi-permeable membrane with a piston applying pressure; pure water passes through to the lower compartment.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><rect x="140" y="60" width="240" height="300" rx="8" fill="none" stroke="#1d2b36" stroke-width="3" /><rect x="143" y="180" width="234" height="176" rx="0" fill="#d9ecf7" stroke="none" stroke-width="0" /><rect x="150" y="160" width="220" height="10" rx="2" fill="#c9a227" stroke="#1d2b36" stroke-width="1.5" /><rect x="190" y="40" width="140" height="60" rx="4" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2.5" /><polyline points="260.0,40.0 260.0,40.0" fill="none" stroke="#1d2b36" stroke-width="2"/><polyline points="260.0,10.0 260.0,36.0" fill="none" stroke="#b03a2e" stroke-width="3" marker-end="url(#red)"/><text x="330" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#b03a2e">Pressure</text><text x="260" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1d2b36">Sea water</text><text x="260" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1f4e9a">Pure water</text><polyline points="380.0,280.0 420.0,280.0" fill="none" stroke="#1f4e9a" stroke-width="3" marker-end="url(#blue)"/><text x="440" y="286" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1f4e9a">pure water out</text><text x="20" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="end" fill="#c9a227">Semi-permeable membrane</text><polyline points="26.0,164.0 150.0,170.0" fill="none" stroke="#c9a227" stroke-width="1.6"/><text x="20" y="80" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="end" fill="#1d2b36">Piston</text><polyline points="26.0,74.0 190.0,75.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/></g></svg>
