<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Hydrogen-oxygen fuel cell</title><desc id="desc">Acid fuel cell: H2 at the negative anode, O2 at the positive cathode, H3PO4 electrolyte, H+ moving from anode to cathode, and an external circuit.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><polyline points="90.0,80.0 90.0,40.0 530.0,40.0 530.0,80.0" fill="none" stroke="#1d2b36" stroke-width="2.5"/><text x="310" y="30" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#b03a2e">external circuit: e⁻ flow</text><polyline points="200.0,40.0 420.0,40.0" fill="none" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#red)"/><rect x="120" y="110" width="90" height="210" rx="6" fill="#e05a4f" stroke="#1d2b36" stroke-width="2.5" /><rect x="400" y="110" width="90" height="210" rx="6" fill="#4fa86a" stroke="#1d2b36" stroke-width="2.5" /><rect x="210" y="110" width="180" height="210" rx="6" fill="#fff7f0" stroke="#1d2b36" stroke-width="2.5" /><text x="310" y="200" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#1f4e9a">H₃PO₄(aq)</text><text x="310" y="230" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1f4e9a">electrolyte</text><text x="165" y="350" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2b36">anode (−)</text><text x="445" y="350" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2b36">cathode (+)</text><polyline points="40.0,170.0 120.0,170.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><text x="40" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">H₂ in</text><polyline points="480.0,170.0 560.0,170.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><text x="560" y="160" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#1d2b36">O₂ in</text><polyline points="220.0,300.0 300.0,300.0" fill="none" stroke="#1f4e9a" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#blue)"/><text x="260" y="290" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1f4e9a">H⁺</text><polyline points="120.0,360.0 40.0,400.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><text x="340" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1d2b36">H₂O out</text></g></svg>
