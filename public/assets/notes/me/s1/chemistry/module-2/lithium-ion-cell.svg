<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc"><title id="title">Lithium-ion cell</title><desc id="desc">Anode, separator and cathode inside an electrolyte; arrows show lithium ions moving during charge and discharge through an ammeter.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><rect x="40" y="110" width="540" height="220" rx="12" fill="#eef6f9" stroke="#1d2b36" stroke-width="3" /><text x="310" y="150" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1f4e9a">Electrolyte</text><rect x="70" y="170" width="120" height="120" rx="12" fill="#e05a4f" stroke="#1d2b36" stroke-width="2" /><text x="130" y="236" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Anode</text><rect x="250" y="170" width="120" height="120" rx="6" fill="#fff7b0" stroke="#1d2b36" stroke-width="2" stroke-dasharray="8 6"/><text x="310" y="236" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">Separator</text><rect x="430" y="170" width="120" height="120" rx="12" fill="#4fa86a" stroke="#1d2b36" stroke-width="2" /><text x="490" y="236" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Cathode</text><polyline points="360.0,80.0 230.0,80.0" fill="none" stroke="#1f4e9a" stroke-width="2.5" marker-end="url(#blue)"/><polyline points="260.0,80.0 380.0,80.0" fill="none" stroke="#1f4e9a" stroke-width="2.5" marker-end="url(#blue)"/><text x="310" y="72" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1f4e9a">Discharge (←) / Charge (→)</text><circle cx="310" cy="40" r="16" fill="none" stroke="#1d2b36" stroke-width="2" /><text x="310" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1d2b36">A</text><polyline points="195.0,210.0 245.0,210.0" fill="none" stroke="#b03a2e" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#red)"/><polyline points="245.0,230.0 195.0,230.0" fill="none" stroke="#b03a2e" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#red)"/><text x="220" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#b03a2e">Li⁺</text></g></svg>
