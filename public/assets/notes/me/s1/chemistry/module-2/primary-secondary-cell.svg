<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Primary and secondary cells</title><desc id="desc">Two boxes comparing primary cells (used once, not rechargeable) with secondary cells (rechargeable many times).</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><rect x="30" y="30" width="270" height="260" rx="10" fill="#fbe6d4" stroke="#c8662b" stroke-width="2.5" /><text x="165" y="66" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#8a3b10">PRIMARY CELL</text><text x="165" y="100.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">A battery designed to be used</text><text x="165" y="120.25" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">once and discarded. The</text><text x="165" y="140.5" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">electrochemical reaction is</text><text x="165" y="160.75" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">not reversible, so the cell</text><text x="165" y="181.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">cannot be recharged.</text><rect x="320" y="30" width="270" height="260" rx="10" fill="#f9dfe7" stroke="#b0365a" stroke-width="2.5" /><text x="455" y="66" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#7a1f38">SECONDARY CELL</text><text x="455" y="100.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">A battery that can be charged,</text><text x="455" y="120.25" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">discharged into a load and</text><text x="455" y="140.5" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">recharged many times, unlike a</text><text x="455" y="160.75" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">primary battery supplied fully</text><text x="455" y="181.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">charged and discarded after</text><text x="455" y="201.25" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">use.</text></g></svg>
