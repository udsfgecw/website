<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-labelledby="title desc"><title id="title">Sacrificial anodic protection</title><desc id="desc">A magnesium anode connected by a wire to a buried steel pipe, with electrons flowing to the pipe and Mg2+ released from the anode.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><rect x="230" y="150" width="300" height="80" rx="40" fill="#c9d0d6" stroke="#1d2b36" stroke-width="3" /><rect x="40" y="130" width="70" height="120" rx="6" fill="#8c96a0" stroke="#1d2b36" stroke-width="2.5" /><text x="75" y="190" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">Mg</text><polyline points="110.0,190.0 230.0,190.0" fill="none" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#red)"/><text x="170" y="175" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#b03a2e">e⁻</text><polyline points="40.0,110.0 40.0,90.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><text x="60" y="90" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">Mg²⁺</text><text x="380" y="280" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">protected pipe (cathode)</text><rect x="20" y="280" width="560" height="40" rx="0" fill="#e9d7b6" stroke="none" stroke-width="0" /><text x="300" y="330" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1d2b36">earth / soil</text><text x="300" y="380" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1d2b36">Sacrificial anodic protection</text></g></svg>
