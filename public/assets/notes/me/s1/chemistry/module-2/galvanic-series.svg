<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Galvanic series</title><desc id="desc">Metals and alloys ordered from active or anodic (magnesium, at the top) to noble or cathodic (platinum, at the bottom).</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><polyline points="40.0,470.0 40.0,40.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><text x="70" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#1d2b36">Active or anodic</text><text x="70" y="476" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#1d2b36">Noble or cathodic</text><text x="90" y="72" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">1. Mg</text><text x="90" y="87.5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">2. Mg alloy</text><text x="90" y="103.0" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">3. Zn</text><text x="90" y="118.5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">4. Al</text><text x="90" y="134.0" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">5. Cd</text><text x="90" y="149.5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">6. Al alloy</text><text x="90" y="165.0" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">7. Mild steel</text><text x="90" y="180.5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">8. Cast iron</text><text x="90" y="196.0" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">9. High-Ni cast iron</text><text x="90" y="211.5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">10. Pb-Sn solder</text><text x="90" y="227.0" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">11. Pb</text><text x="90" y="242.5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">12. Sn</text><text x="90" y="258.0" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">13. Inconel</text><text x="90" y="273.5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">14. Ni-Mo-Fe alloys</text><text x="90" y="289.0" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">15. Brass</text><text x="90" y="304.5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">16. Monel (30% Cu, 7% Ni, rest Fe)</text><text x="90" y="320.0" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">17. Ag solder</text><text x="90" y="335.5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">18. Cu</text><text x="90" y="351.0" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">19. Ni</text><text x="90" y="366.5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">20. Cr stainless steel</text><text x="90" y="382.0" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">21. 18-8 stainless steel</text><text x="90" y="397.5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">22. 18-8 Mo stainless steel</text><text x="90" y="413.0" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">23. Ag</text><text x="90" y="428.5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">24. Ti</text><text x="90" y="444.0" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">25. Graphite</text><text x="90" y="459.5" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">26. Au</text><text x="90" y="475.0" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">27. Pt</text></g></svg>
