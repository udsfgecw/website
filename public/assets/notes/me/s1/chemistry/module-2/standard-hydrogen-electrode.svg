<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" role="img" aria-labelledby="title desc"><title id="title">Standard hydrogen electrode</title><desc id="desc">Glass vessel with 1 M HCl, hydrogen gas inlet at 1 atm, platinised platinum electrode and a voltmeter.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><rect x="170" y="110" width="210" height="260" rx="10" fill="none" stroke="#1d2b36" stroke-width="3" /><rect x="186" y="150" width="178" height="210" rx="6" fill="#d9ecf7" stroke="#1d2b36" stroke-width="2" /><rect x="255" y="40" width="40" height="90" rx="4" fill="#f4f4f4" stroke="#1d2b36" stroke-width="2" /><polyline points="275.0,20.0 275.0,40.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><text x="275" y="14" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1d2b36">H₂(g), 1 atm</text><rect x="255" y="130" width="40" height="20" rx="3" fill="#f4f4f4" stroke="#1d2b36" stroke-width="1.5" /><polyline points="275.0,130.0 275.0,150.0" fill="none" stroke="#1d2b36" stroke-width="2"/><rect x="245" y="300" width="60" height="20" rx="3" fill="#2b2b2b" stroke="#1d2b36" stroke-width="1" /><polyline points="275.0,300.0 275.0,320.0" fill="none" stroke="#1d2b36" stroke-width="3"/><polyline points="325.0,280.0 460.0,280.0 460.0,380.0 275.0,380.0 275.0,320.0" fill="none" stroke="#1d2b36" stroke-width="2"/><rect x="430" y="340" width="70" height="40" rx="6" fill="#ffffff" stroke="#1d2b36" stroke-width="2" /><text x="465" y="366" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d2b36">V</text><text x="110" y="240" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="end" fill="#1d2b36">1 M HCl</text><polyline points="116.0,234.0 186.0,240.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="110" y="320" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="end" fill="#1d2b36">Platinised Pt (platinum black)</text><polyline points="116.0,314.0 245.0,310.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="470" y="80" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Hydrogen gas inlet</text><polyline points="464.0,74.0 295.0,80.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="500" y="230" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">High resistance voltmeter</text><polyline points="494.0,224.0 460.0,280.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="110" y="150" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="end" fill="#1d2b36">Outer glass jacket</text><polyline points="116.0,144.0 170.0,150.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/></g></svg>
