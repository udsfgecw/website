<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 440" role="img" aria-labelledby="title desc"><title id="title">Galvanic cell</title><desc id="desc">Zinc anode in ZnSO4 and copper cathode in CuSO4 joined by a KCl salt bridge and a voltmeter, with electrons flowing from anode to cathode.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><rect x="60" y="170" width="200" height="190" rx="0" fill="none" stroke="#1d2b36" stroke-width="3" /><rect x="62" y="240" width="196" height="118" rx="0" fill="#d9ecf7" stroke="none" stroke-width="0" /><rect x="380" y="170" width="200" height="190" rx="0" fill="none" stroke="#1d2b36" stroke-width="3" /><rect x="382" y="240" width="196" height="118" rx="0" fill="#7fb6e0" stroke="none" stroke-width="0" /><rect x="150" y="120" width="20" height="170" rx="2" fill="#9aa5b1" stroke="#1d2b36" stroke-width="1.5" /><rect x="470" y="120" width="20" height="170" rx="2" fill="#c77b30" stroke="#1d2b36" stroke-width="1.5" /><polyline points="160.0,120.0 160.0,60.0 270.0,60.0" fill="none" stroke="#1d2b36" stroke-width="2.5"/><polyline points="480.0,120.0 480.0,60.0 370.0,60.0" fill="none" stroke="#1d2b36" stroke-width="2.5"/><rect x="270" y="30" width="100" height="56" rx="6" fill="#ffffff" stroke="#1d2b36" stroke-width="2.5" /><text x="320" y="66" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1d2b36">V</text><path d="M 262 300 Q 320 380 378 300" fill="none" stroke="#c9a227" stroke-width="16"/><text x="320" y="400" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">KCl salt bridge</text><polyline points="160.0,100.0 160.0,50.0" fill="none" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#red)"/><text x="138" y="95" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="end" fill="#b03a2e">e⁻</text><text x="160" y="110" font-family="Arial, sans-serif" font-size="1" font-weight="normal" text-anchor="middle" fill="#1d2b36"></text><text x="160" y="110" font-family="Arial, sans-serif" font-size="1" font-weight="normal" text-anchor="middle" fill="#1d2b36"></text><text x="160" y="158" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1d2b36">Zn</text><text x="480" y="158" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1d2b36">Cu</text><text x="160" y="390" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">Anode (−): oxidation</text><text x="480" y="390" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">Cathode (+): reduction</text><text x="160" y="258" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">ZnSO₄ solution</text><text x="480" y="258" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">CuSO₄ solution</text><text x="160" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1d2b36">Zn → Zn²⁺ + 2e⁻</text><text x="480" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1d2b36">Cu²⁺ + 2e⁻ → Cu</text><text x="320" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#b03a2e">electrons flow anode → cathode</text></g></svg>
