<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-labelledby="title desc"><title id="title">Calomel electrode</title><desc id="desc">Glass tube with mercury at the bottom, Hg and Hg2Cl2 paste above it, a platinum wire and a side tube with saturated KCl.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><rect x="220" y="60" width="120" height="300" rx="8" fill="none" stroke="#1d2b36" stroke-width="3" /><rect x="224" y="290" width="112" height="66" rx="0" fill="#b8b8c0" stroke="none" stroke-width="0" /><rect x="224" y="250" width="112" height="40" rx="0" fill="#d8d0c8" stroke="none" stroke-width="0" /><rect x="224" y="130" width="112" height="120" rx="0" fill="#f4f7fa" stroke="none" stroke-width="0" /><polyline points="280.0,60.0 280.0,300.0" fill="none" stroke="#8a6f2e" stroke-width="4"/><rect x="340" y="170" width="90" height="22" rx="4" fill="#f4f7fa" stroke="#1d2b36" stroke-width="2" /><text x="110" y="110" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="end" fill="#1d2b36">Pt wire</text><polyline points="116.0,104.0 280.0,120.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="110" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="end" fill="#1d2b36">Saturated KCl</text><polyline points="116.0,164.0 226.0,170.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="110" y="260" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="end" fill="#1d2b36">Hg + Hg₂Cl₂ paste</text><polyline points="116.0,254.0 226.0,265.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="110" y="330" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="end" fill="#1d2b36">Hg</text><polyline points="116.0,324.0 226.0,330.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="500" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Side tube to KCl bridge</text><polyline points="494.0,174.0 430.0,180.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/></g></svg>
