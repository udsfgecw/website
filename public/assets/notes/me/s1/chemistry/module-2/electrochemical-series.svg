<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 400" role="img" aria-labelledby="title desc"><title id="title">Electrochemical series</title><desc id="desc">Half reactions ordered by standard reduction potential, from F2 (+2.87 V) at the top to Li (−3.05 V) at the bottom.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><text x="300" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d2b36">Half reaction</text><text x="500" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d2b36">E° (V)</text><text x="60" y="72" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">F₂ + 2e⁻ ⇌ 2F⁻</text><text x="500" y="72" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">+2.87</text><text x="60" y="99" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Cl₂ + 2e⁻ ⇌ 2Cl⁻</text><text x="500" y="99" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">+1.36</text><text x="60" y="126" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">O₂ + 4H⁺ + 4e⁻ ⇌ 2H₂O</text><text x="500" y="126" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">+1.23</text><text x="60" y="153" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Ag⁺ + e⁻ ⇌ Ag</text><text x="500" y="153" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">+0.80</text><text x="60" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Cu²⁺ + 2e⁻ ⇌ Cu</text><text x="500" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">+0.34</text><text x="60" y="207" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">2H⁺ + 2e⁻ ⇌ H₂</text><text x="500" y="207" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">0.00</text><text x="60" y="234" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Pb²⁺ + 2e⁻ ⇌ Pb</text><text x="500" y="234" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">−0.13</text><text x="60" y="261" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Ni²⁺ + 2e⁻ ⇌ Ni</text><text x="500" y="261" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">−0.25</text><text x="60" y="288" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Fe²⁺ + 2e⁻ ⇌ Fe</text><text x="500" y="288" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">−0.44</text><text x="60" y="315" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Zn²⁺ + 2e⁻ ⇌ Zn</text><text x="500" y="315" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">−0.76</text><text x="60" y="342" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Al³⁺ + 3e⁻ ⇌ Al</text><text x="500" y="342" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">−1.66</text><text x="60" y="369" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Mg²⁺ + 2e⁻ ⇌ Mg</text><text x="500" y="369" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">−2.37</text><text x="60" y="396" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#1d2b36">Li⁺ + e⁻ ⇌ Li</text><text x="500" y="396" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">−3.05</text><polyline points="30.0,330.0 30.0,70.0" fill="none" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#red)"/><text x="-8" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#b03a2e">stronger oxidizing agent</text><polyline points="580.0,70.0 580.0,330.0" fill="none" stroke="#1f4e9a" stroke-width="2.5" marker-end="url(#blue)"/><text x="596" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1f4e9a">stronger reducing agent</text></g></svg>
