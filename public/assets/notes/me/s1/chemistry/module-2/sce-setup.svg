<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 420" role="img" aria-labelledby="title desc"><title id="title">SCE setup</title><desc id="desc">Zinc electrode in ZnSO4 joined by a digital voltmeter to a saturated calomel electrode, with a salt bridge between the two half-cells.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><rect x="40" y="200" width="170" height="150" rx="0" fill="none" stroke="#1d2b36" stroke-width="3" /><rect x="42" y="260" width="166" height="88" rx="0" fill="#d9ecf7" stroke="none" stroke-width="0" /><rect x="40" y="130" width="170" height="0" rx="0" fill="none" stroke="none" stroke-width="0" /><rect x="90" y="180" width="16" height="110" rx="2" fill="#9aa5b1" stroke="#1d2b36" stroke-width="1.5" /><rect x="400" y="200" width="170" height="150" rx="0" fill="none" stroke="#1d2b36" stroke-width="3" /><rect x="402" y="240" width="166" height="110" rx="0" fill="#f4f7fa" stroke="none" stroke-width="0" /><polyline points="495.0,200.0 495.0,170.0" fill="none" stroke="#8a6f2e" stroke-width="4"/><path d="M 210 300 Q 300 380 400 300" fill="none" stroke="#c9a227" stroke-width="14"/><rect x=