<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc"><title id="title">Symmetric stretching of CO₂</title><desc id="desc">Both O atoms move outward from the carbon. No change in dipole moment, so IR inactive.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><text x="170" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d2b36">Symmetric stretching of CO₂</text><polyline points="90.0,140.0 250.0,140.0" fill="none" stroke="#1d2b36" stroke-width="3"/><polyline points="90.0,140.0 250.0,140.0" fill="none" stroke="#1d2b36" stroke-width="0"/><circle cx="170" cy="140" r="12" fill="#444" stroke="#1d2b36" stroke-width="2" /><text x="90" y="146" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#1d2b36">O</text><text x="250" y="146" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#1d2b36">O</text><text x="170" y="146" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#ffffff">C</text><polyline points="70.0,140.0 40.0,140.0" fill="none" stroke="#b03a2e" stroke-width="3" marker-end="url(#red)"/><polyline points="270.0,140.0 300.0,140.0" fill="none" stroke="#b03a2e" stroke-width="3" marker-end="url(#red)"/><text x="170" y="250" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2b36">O=C=O (symmetric stretch)</text><text x="170" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#b03a2e">No change in dipole moment: IR inactive</text></g></svg>
