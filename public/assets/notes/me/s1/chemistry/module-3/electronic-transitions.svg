<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="title desc"><title id="title">Electronic transitions</title><desc id="desc">Molecular orbitals sigma, pi, n, pi* and sigma* with arrows for sigma to sigma*, pi to pi*, n to pi* and n to sigma* transitions.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><polyline points="160.0,60.0 420.0,60.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="440" y="66" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#1d2b36">σ*</text><polyline points="160.0,150.0 420.0,150.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="440" y="156" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#1d2b36">n</text><polyline points="160.0,180.0 420.0,180.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="440" y="186" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#1d2b36">π*</text><polyline points="160.0,240.0 420.0,240.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="440" y="246" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#1d2b36">π</text><polyline points="160.0,320.0 420.0,320.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="440" y="326" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#1d2b36">σ</text><polyline points="120.0,340.0 120.0,40.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><text x="100" y="200" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#1d2b36">Energy</text><polyline points="190.0,320.0 190.0,60.0" fill="none" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#red)"/><text x="190" y="46" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#b03a2e">σ→σ*</text><polyline points="250.0,240.0 250.0,180.0" fill="none" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#red)"/><text x="250" y="166" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#b03a2e">π→π*</text><polyline points="310.0,150.0 310.0,180.0" fill="none" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#red)"/><text x="310" y="166" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#b03a2e">n→π*</text><polyline points="370.0,150.0 370.0,60.0" fill="none" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#red)"/><text x="370" y="46" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#b03a2e">n→σ*</text></g></svg>
