<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 220" role="img" aria-labelledby="title desc"><title id="title">Vibrational modes of water</title><desc id="desc">Symmetric stretching, asymmetric stretching and bending in-plane modes of the H2O molecule with arrows showing atomic motion.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><text x="120" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d2b36">Symmetric stretching</text><polyline points="60.0,150.0 120.0,110.0 180.0,150.0" fill="none" stroke="#1d2b36" stroke-width="2.5"/><circle cx="120" cy="110" r="16" fill="#e05a4f" stroke="#1d2b36" stroke-width="2" /><text x="120" y="116" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#ffffff">O</text><text x="60" y="170" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">H</text><text x="180" y="170" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">H</text><polyline points="40.0,120.0 0.0,90.0" fill=