<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 230" role="img" aria-labelledby="title desc"><title id="title">Hydrogen bonding in phenols</title><desc id="desc">Left: intermolecular H-bonds between p-hydroxy phenol molecules. Right: intramolecular H-bond within o-hydroxy phenol.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><text x="200" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d2b36">Intermolecular H-bonding</text><polygon points="149.4,103.0 149.4,137.0 120.0,154.0 90.6,137.0 90.6,103.0 120.0,86.0" fill="none" stroke="#1d2b36" stroke-width="2.5" /><polygon points="309.4,103.0 309.4,137.0 280.0,154.0 250.6,137.0 250.6,103.0 280.0,86.0" fill="none" stroke="#1d2b36" stroke-width="2.5" /><text x="120" y="126" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">p-OH</text><text x="280" y="126" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">p-OH</text><polyline points="120.0,86.0 120.0,40.0 150.0,40.0" fill="none" stroke="#1d2b36" stroke-width="2"/><polyline points="200.0,110.0 240.0,110.0" fill="none" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="5 4"/><text x="200" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f4e9a">H···O</text><text x="200" y="180" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">p-hydroxy phenol</text><text x="540" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d2b36">Intramolecular H-bonding</text><polygon points="474.6,110.0 474.6,150.0 440.0,170.0 405.4,150.0 405.4,110.0 440.0,90.0" fill="none" stroke="#1d2b36" stroke-width="2.5" /><text x="440" y="136" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">o-OH</text><polyline points="470.0,100.0 505.0,70.0" fill="none" stroke="#1d2b36" stroke-width="2"/><polyline points="440.0,90.0 490.0,60.0" fill="none" stroke="#1f4e9a" stroke-width="2" stroke-dasharray="5 4"/><text x="440" y="200" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">o-hydroxy phenol</text></g></svg>
