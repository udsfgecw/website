<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">DTA instrumentation</title><desc id="desc">Two thermocouples feed amplifiers and a computer; the furnace holds reference and sample, powered by a source and linked to environment control.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><rect x="40" y="40" width="110" height="40" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="95" y="65" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">Thermocouple 1</text><rect x="40" y="210" width="110" height="40" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="95" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">Thermocouple 2</text><rect x="200" y="40" width="110" height="40" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="255" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Amplifier</text><rect x="200" y="210" width="110" height="40" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="255" y="235" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Amplifier</text><rect x="380" y="120" width="150" height="40" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="455" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Computer</text><polyline points="150.0,60.0 200.0,60.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="150.0,230.0 200.0,230.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="310.0,70.0 380.0,130.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="310.0,230.0 380.0,150.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><rect x="120" y="300" width="260" height="60" rx="10" fill="#fff7e8" stroke="#c8662b" stroke-width="2" /><text x="250" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Furnace: reference and sample</text><polyline points="250.0,300.0 250.0,260.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><rect x="420" y="300" width="170" height="50" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="505" y="330" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">Environment control</text><polyline points="380.0,325.0 420.0,325.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><rect x="20" y="360" width="120" height="36" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="80" y="382" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">Source of power</text><polyline points="140.0,378.0 180.0,330.0" fill="none" stroke="#1d2b36" stroke-