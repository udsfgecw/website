<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" role="img" aria-labelledby="title desc"><title id="title">Benzene MO diagram</title><desc id="desc">Molecular orbitals psi1 to psi6 for benzene with psi2 and psi3 as the HOMO, psi5 as the LUMO, a 255 nm transition, and the benzene ring.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><polyline points="80.0,300.0 240.0,300.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="55" y="306" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#1d2b36">ψ₁</text><polyline points="80.0,250.0 240.0,250.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="55" y="256" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#1d2b36">ψ₂</text><polyline points="80.0,200.0 240.0,200.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="55" y="206" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#1d2b36">ψ₃</text><polyline points="80.0,150.0 240.0,150.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="55" y="156" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#1d2b36">ψ₄</text><polyline points="80.0,110.0 240.0,110.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="55" y="116" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#1d2b36">ψ₅</text><polyline points="80.0,70.0 240.0,70.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="55" y="76" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#1d2b36">ψ₆</text><polyline points="160.0,205.0 160.0,240.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="190.0,205.0 190.0,240.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="130.0,200.0 130.0,300.0" fill="none" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#red)"/><polyline points="200.0,280.0 200.0,110.0" fill="none" stroke="#b03a2e" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#red)"/><text x="245" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#b03a2e">λ = 255 nm</text><text x="170" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1d2b36">(a) HOMO → LUMO</text><polygon points="460.6,145.0 460.6,215.0 400.0,250.0 339.4,215.0 339.4,145.0 400.0,110.0" fill="none" stroke="#1d2b36" stroke-width="3" /><polygon points="445.0,154.0 445.0,206.0 400.0,232.0 355.0,206.0 355.0,154.0 400.0,128.0" fill="none" stroke="#1f4e9a" stroke-width="1.5" /><text x="400" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1d2b36">(b) benzene</text></g></svg>
