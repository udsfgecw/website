<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 350" role="img" aria-labelledby="title desc"><title id="title">Gas chromatography schematic</title><desc id="desc">Carrier gas through a regulator and injector into a coiled column in an oven, then a detector and a computer chromatogram.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><rect x="20" y="20" width="600" height="320" rx="12" fill="none" stroke="#1d2b36" stroke-width="2" /><text x="320" y="46" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d2b36">Gas chromatography</text><rect x="40" y="100" width="110" height="50" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="95" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Carrier gas</text><rect x="180" y="100" width="110" height="50" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="235" y="130" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">Gas flow regulator</text><rect x="320" y="100" width="110" height="50" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="375" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Injector port</text><polyline points="150.0,125.0 180.0,125.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="290.0,125.0 320.0,125.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><text x="375" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">Sample (syringe)</text><polyline points="375.0,186.0 375.0,150.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><rect x="230" y="210" width="200" height="80" rx="10" fill="#fff7e8" stroke="#c8662b" stroke-width="2" /><text x="330" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Oven</text><path d="M 280 230 Q 300 260 320 230 Q 340 260 360 230 Q 380 260 400 230" fill="none" stroke="#1d2b36" stroke-width="2"/><text x="330" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">Column (coiled)</text><polyline points="430.0,125.0 470.0,125.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><rect x="470" y="100" width="110" height="50" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="525" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Detector</text><polyline points="525.0,150.0 525.0,200.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><rect x="470" y="200" width="110" height="50" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="525" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Waste</text><rect x="40" y="210" width="150" height="90" rx="4" fill="#ffffff" stroke="#1d2b36" stroke-width="1.5" /><polyline points="55.0,290.0 80.0,260.0 100.0,280.0 120.0,232.0 150.0,290.0" fill="none" stroke="#1f4e9a" stroke-width="2"/><text x="115" y="320" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">Chromatogram</text></g></svg>
