<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 360" role="img" aria-labelledby="title desc"><title id="title">UV-Visible spectrophotometer</title><desc id="desc">Source, monochromator, beam splitter, sample and reference cuvettes, detector and a computer plot of absorbance against wavelength.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><rect x="30" y="60" width="120" height="50" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2.2" /><text x="90" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">UV-VIS source</text><rect x="180" y="60" width="120" height="50" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2.2" /><text x="240" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Monochromator</text><rect x="330" y="60" width="120" height="50" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2.2" /><text x="390" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Beam splitter</text><polyline points="150.0,85.0 180.0,85.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="300.0,85.0 330.0,85.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><rect x="470" y="40" width="120" height="40" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2.2" /><text x="530" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Sample cuvette</text><rect x="470" y="110" width="120" height="40" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2.2" /><text x="530" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Reference cuvette</text><polyline points="450.0,75.0 470.0,60.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="450.0,95.0 470.0,130.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><rect x="470" y="180" width="120" height="40" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2.2" /><text x="530" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Detector</text><polyline points="530.0,80.0 530.0,180.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="530.0,150.0 530.0,180.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><rect x="30" y="200" width="380" height="130" rx="6" fill="#fdfdfd" stroke="#1d2b36" stroke-width="2" /><text x="220" y="228" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" fill="#1d2b36">log(I₀/I) = A  vs  wavelength λ (nm)</text><polyline points="60.0,300.0 120.0,300.0 160.0,260.0 200.0,240.0 240.0,220.0 280.0,240.0 330.0,300.0 380.0,300.0" fill="none" stroke="#1f4e9a" stroke-width="2.5"/><text x="220" y="270" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f4e9a">absorbance curve (computer)</text></g></svg>
