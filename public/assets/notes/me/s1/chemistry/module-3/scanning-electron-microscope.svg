<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">SEM schematic</title><desc id="desc">Vertical schematic of a scanning electron microscope: electron source, anodes, condenser lens, scan coils, objective lens, sample and a secondary electron detector.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><text x="260" y="36" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2b36">Scanning electron microscope</text><rect x="160" y="60" width="200" height="40" rx="6" fill="#fff7e8" stroke="#c8662b" stroke-width="2" /><text x="260" y="86" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">Electron source</text><polyline points="260.0,100.0 260.0,130.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><rect x="170" y="130" width="80" height="30" rx="4" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="210" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">Anode</text><rect x="270" y="130" width="80" height="30" rx="4" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="310" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">Anode</text><circle cx="260" cy="200" r="40" fill="none" stroke="#1d2b36" stroke-width="2" /><text x="260" y="205" font-family="Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d2b36">Condenser lens</text><polyline points="260.0,240.0 260.0,262.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><rect x="170" y="262" width="80" height="24" rx="4" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="210" y="279" font-family="Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d2b36">Scan coils</text><rect x="270" y="262" width="80" height="24" rx="4" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="310" y="279" font-family="Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d2b36">Scan coils</text><circle cx="260" cy="320" r="28" fill="none" stroke="#1d2b36" stroke-width="2" /><text x="260" y="325" font-family="Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d2b36">Objective</text><polyline points="260.0,348.0 260.0,380.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><rect x="170" y="380" width="180" height="24" rx="4" fill="#e9d7b6" stroke="#1d2b36" stroke-width="2" /><text x="260" y="397" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">Sample</text><rect x="60" y="320" width="70" height="40" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="95" y="344" font-family="Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d2b36">Secondary</text><text x="95" y="356" font-family="Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d2b36">e⁻ detector</text><polyline points="130.0,340.0 170.0,392.0" fill="none" stroke="#1d2b36" stroke-width="1.5" stroke-dasharray="4 3"/></g></svg>
