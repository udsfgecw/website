<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 400" role="img" aria-labelledby="title desc"><title id="title">Ground and excited state</title><desc id="desc">Left: electrons paired in psi1 to psi3, with psi4 to psi6 empty. Right: one electron promoted from the HOMO to the LUMO.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><text x="170" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d2b36">Ground state</text><polyline points="60.0,80.0 260.0,80.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="275" y="85" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2b36">ψ₆</text><polyline points="60.0,130.0 260.0,130.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="275" y="135" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2b36">ψ₅ (LUMO)</text><polyline points="60.0,180.0 260.0,180.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="275" y="185" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2b36">ψ₄</text><polyline points="60.0,230.0 260.0,230.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="275" y="235" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2b36">ψ₃ (HOMO)</text><polyline points="60.0,280.0 260.0,280.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="275" y="285" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2b36">ψ₂</text><polyline points="60.0,330.0 260.0,330.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="275" y="335" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2b36">ψ₁</text><polyline points="120.0,232.0 120.0,212.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="170.0,212.0 170.0,232.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="120.0,282.0 120.0,262.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="170.0,262.0 170.0,282.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="120.0,332.0 120.0,312.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="170.0,312.0 170.0,332.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><text x="440" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d2b36">Excited state</text><polyline points="330.0,80.0 530.0,80.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="545" y="85" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2b36">ψ₆</text><polyline points="330.0,130.0 530.0,130.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="545" y="135" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2b36">ψ₅ (LUMO)</text><polyline poi