<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 330" role="img" aria-labelledby="title desc"><title id="title">TGA apparatus and thermogram</title><desc id="desc">Block diagram of a thermogravimetric analyser and a weight-loss thermogram of calcium oxalate monohydrate with steps near 100, 226, 346, 420, 660, 840 and 980 °C.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><text x="170" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d2b36">TGA apparatus block diagram</text><rect x="20" y="50" width="130" height="40" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="85" y="75" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">Temperature sensor</text><rect x="20" y="110" width="130" height="40" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="85" y="135" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">Amplifier</text><rect x="170" y="110" width="130" height="40" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="235" y="135" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">Computer</text><rect x="20" y="170" width="130" height="40" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="85" y="195" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">Thermo balance</text><rect x="170" y="170" width="130" height="40" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="235" y="195" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">Sample holder</text><rect x="170" y="230" width="130" height="40" rx="6" fill="#f3f8fb" stroke="#1f6f8b" stroke-width="2" /><text x="235" y="255" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">Programmable furnace</text><polyline points="150.0,130.0 170.0,130.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="235.0,150.0 235.0,170.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="360.0,60.0 360.0,230.0 600.0,230.0" fill="none" stroke="#1d2b36" stroke-width="2"/><polyline points="360.0,230.0 360.0,236.0" fill="none" stroke="#1d2b36" stroke-width="1.5"/><text x="360.0" y="254" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">0</text><polyline points="420.0,230.0 420.0,236.0" fill="none" stroke="#1d2b36" stroke-width="1.5"/><text x="420.0" y="254" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">250</text><polyline points="480.0,230.0 480.0,236.0" fill="none" stroke="#1d2b36" stroke-width="1.5"/><text x="480.0" y="254" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">500</text><polyline points="540.0,230.0 540.0,236.0" fill="none" stroke="#1d2b36" stroke-width="1.5"/><text x="540.0" y="254" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">750</text><polyline points="600.0,230.0 600.0,236.0" fill="none" stroke="#1d2b36" stroke-width="1.5"/><text x="600.0" y="254" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">1000</text><polyline points="354.0,230.0 360.0,230.0" fill="none" stroke="#1d2b36" stroke-width="1.5"/><text x="350" y="235.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#1d2b36">0</text><polyline points="354.0,152.7 360.0,152.7" fill="none" stroke="#1d2b36" stroke-width="1.5"/><text x="350" y="157.72727272727275" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#1d2b36">50</text><polyline points="354.0,75.5 360.0,75.5" fill="none" stroke="#1d2b36" stroke-width="1.5"/><text x="350" y="80.45454545454547" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#1d2b36">100</text><text x="480.0" y="278" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#1d2b36">Temperature (°C)</text><text transform="translate(308,145.0) rotate(-90)" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1d2b36">Weight (mg)</text><polyline points="360.0,75.5 384.0,75.5 384.0,94.0 414.2,94.0 414.2,109.5 443.0,109.5 443.0,121.8 460.8,121.8 460.8,137.3 518.4,137.3 518.4,160.5 561.6,160.5 561.6,175.9 595.2,175.9 595.2,183.6 600.0,183.6" fill="none" stroke="#1f4e9a" stroke-width="2.5"/><text x="260" y="290" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Thermogram: calcium oxalate</text></g></svg>
