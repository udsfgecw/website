<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-labelledby="title desc"><title id="title">Hexatriene MO diagram</title><desc id="desc">Psi1 to psi6 for 1,3,5-hexatriene: psi3 is the HOMO and an electron is promoted from psi3 to psi4* at 258 nm (111 kcal/mol).</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(190,0)"><text x="180" y="40" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2b36">Ground state</text><text x="400" y="40" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2b36">Excited state</text><polyline points="90.0,300.0 270.0,300.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="60" y="306" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#1d2b36">ψ₁</text><polyline points="310.0,300.0 490.0,300.0" fill="none" stroke="#1d2b36" stroke-width="3"/><polyline points="90.0,250.0 270.0,250.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="60" y="256" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#1d2b36">ψ₂</text><polyline points="310.0,250.0 490.0,250.0" fill="none" stroke="#1d2b36" stroke-width="3"/><polyline points="90.0,200.0 270.0,200.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="60" y="206" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#1d2b36">ψ₃</text><polyline points="310.0,200.0 490.0,200.0" fill="none" stroke="#1d2b36" stroke-width="3"/><polyline points="90.0,150.0 270.0,150.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="60" y="156" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#1d2b36">ψ₄*</text><polyline points="310.0,150.0 490.0,150.0" fill="none" stroke="#1d2b36" stroke-width="3"/><polyline points="90.0,100.0 270.0,100.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="60" y="106" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#1d2b36">ψ₅*</text><polyline points="310.0,100.0 490.0,100.0" fill="none" stroke="#1d2b36" stroke-width="3"/><polyline points="90.0,60.0 270.0,60.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="60" y="66" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#1d2b36">ψ₆*</text><polyline points="310.0,60.0 490.0,60.0" fill="none" stroke="#1d2b36" stroke-width="3"/><polyline points="130.0,302.0 130.0,284.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="170.0,284.0 170.0,302.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="150.0,252.0 150.0,234.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="190.0,234.0 190.0,252.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="170.0,202.0 170.0,184.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="210.0,184.0 210.0,202.0" fill="none" stroke="#1d2b36"