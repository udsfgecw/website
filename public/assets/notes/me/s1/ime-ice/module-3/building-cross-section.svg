<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="title desc"><title id="title">Building cross-section: components from foundation to parapet</title><desc id="desc">Cross-section of a building with foundation, walls, lintel, sunshade, door, floor finish and roof components.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(30,0)"><rect x="60" y="220" width="340" height="40" rx="8" fill="#e7e9ec" stroke="#1d2b36" stroke-width="2" /><text x="230" y="246" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">foundation</text><rect x="110" y="60" width="30" height="160" rx="8" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2" /><rect x="320" y="60" width="30" height="160" rx="8" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2" /><rect x="140" y="50" width="180" height="14" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2" /><text x="230" y="40" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">R.C.C. roof slab</text><rect x="140" y="30" width="180" height="12" rx="8" fill="#ffffff" stroke="#1d2b36" stroke-width="1.5" /><text x="230" y="22" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">parapet</text><rect x="170" y="130" width="100" height="60" rx="8" fill="#ffffff" stroke="#1d2b36" stroke-width="2" /><text x="220" y="165" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">door</text><rect x="150" y="120" width="140" height="10" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="1.5" /><text x="230" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d2b36">lintel</text><text x="400" y="130" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1d2b36">wall</text><text x="400" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1d2b36">sand filling, floor</text><text x="60" y="290" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1d2b36">plinth and floor concrete</text></g></svg>
