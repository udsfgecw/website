<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 290" role="img" aria-labelledby="title desc"><title id="title">Block diagram of an MPFI system</title><desc id="desc">Engine, injectors, ECU, speed sensor and intake manifold connected by air and fuel flow.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(40,0)"><rect x="30" y="60" width="110" height="50" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><text x="85.0" y="81.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Air</text><text x="85.0" y="99.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">filter</text><rect x="180" y="60" width="110" height="50" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><text x="235.0" y="81.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Intake</text><text x="235.0" y="99.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">manifold</text><rect x="330" y="60" width="110" height="50" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><text x="385.0" y="90.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Injector</text><rect x="180" y="170" width="110" height="50" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><text x="235.0" y="200.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Engine</text><rect x="30" y="170" width="110" height="50" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><text x="85.0" y="191.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Speed</text><text x="85.0" y="209.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">sensor</text><rect x="330" y="170" width="110" height="50" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><text x="385.0" y="200.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">ECU</text><polyline points="140.0,85.0 180.0,85.0" fill="none" stroke="#1d2b36" stroke-width="2.2" marker-end="url(#ink)"/><polyline points="290.0,85.0 330.0,85.0" fill="none" stroke="#1d2b36" stroke-width="2.2" marker-end="url(#ink)"/><polyline points="235.0,110.0 235.0,170.0" fill="none" stroke="#1d2b36" stroke-width="2.2" marker-end="url(#ink)"/><polyline points="140.0,195.0 180.0,195.0" fill="none" stroke="#1d2b36" stroke-width="2.2" marker-end="url(#ink)"/><polyline points="330.0,195.0 290.0,195.0" fill="none" stroke="#1d2b36" stroke-width="2.2" marker-end="url(#ink)"/><polyline points="85.0,170.0 85.0,110.0" fill="none" stroke="#1d2b36" stroke-width="2.2" marker-end="url(#ink)"/></g></svg>
