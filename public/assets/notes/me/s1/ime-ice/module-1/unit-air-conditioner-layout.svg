<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 290" role="img" aria-labelledby="title desc"><title id="title">Layout of a unit air conditioner</title><desc id="desc">Closed loop with compressor, condenser (with cooling water), expansion valve and evaporator.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(40,0)"><rect x="60" y="40" width="120" height="46" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><text x="120.0" y="68.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Compressor</text><rect x="290" y="40" width="120" height="46" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><text x="350.0" y="68.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Condenser</text><rect x="290" y="200" width="120" height="46" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><text x="350.0" y="219.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Expansion</text><text x="350.0" y="237.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">valve</text><rect x="60" y="200" width="120" height="46" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><text x="120.0" y="228.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Evaporator</text><polyline points="180.0,63.0 290.0,63.0" fill="none" stroke="#1d2b36" stroke-width="2.2" marker-end="url(#ink)"/><polyline points="350.0,86.0 350.0,200.0" fill="none" stroke="#1d2b36" stroke-width="2.2" marker-end="url(#ink)"/><polyline points="290.0,223.0 180.0,223.0" fill="none" stroke="#1d2b36" stroke-width="2.2" marker-end="url(#ink)"/><polyline points="120.0,200.0 120.0,86.0" fill="none" stroke="#1d2b36" stroke-width="2.2" marker-end="url(#ink)"/><text x="360" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">cooling</text><text x="360" y="166" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">water</text></g></svg>
