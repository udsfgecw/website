<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 290" role="img" aria-labelledby="title desc"><title id="title">Block diagram of a refrigerator</title><desc id="desc">Refrigerator between a hot source T_H and a cold sink T_L, with work input W.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(40,0)"><rect x="160" y="200" width="140" height="60" rx="6" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.5" /><text x="230" y="236" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Source at T_H</text><rect x="160" y="40" width="140" height="60" rx="6" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.5" /><text x="230" y="76" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Sink at T_L</text><circle cx="230" cy="150" r="34" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.5" /><text x="230" y="156" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1d2b36">R</text><polyline points="230.0,200.0 230.0,184.0" fill="none" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#red)"/><text x="240" y="196" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#b03a2e">Q_H</text><polyline points="230.0,100.0 230.0,116.0" fill="none" stroke="#1f4e9a" stroke-width="2.5" marker-end="url(#blue)"/><text x="240" y="110" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1f4e9a">Q_L</text><polyline points="180.0,150.0 196.0,150.0" fill="none" stroke="#2e7d4f" stroke-width="2.5" marker-end="url(#green)"/><text x="120" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="end" fill="#2e7d4f">W</text></g></svg>
