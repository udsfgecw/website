<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" role="img" aria-labelledby="title desc"><title id="title">Principal parts of an internal combustion engine</title><desc id="desc">Cylinder cross-section with spark plug or injector, valves, piston and connecting rod.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(40,0)"><rect x="170" y="60" width="120" height="230" rx="2" fill="#ffffff" stroke="#1d2b36" stroke-width="3" /><rect x="176" y="74" width="108" height="12" rx="2" fill="#c9d0d6" stroke="#1d2b36" stroke-width="1.5" /><rect x="176" y="162.5" width="108" height="18" rx="2" fill="#9aa5b1" stroke="#1d2b36" stroke-width="1.5" /><polyline points="230.0,180.5 230.0,304.0" fill="none" stroke="#1d2b36" stroke-width="4"/><rect x="188" y="52" width="24" height="10" rx="2" fill="#eef4f7" stroke="#1d2b36" stroke-width="1.5" /><text x="200" y="46" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">inlet</text><rect x="248" y="52" width="24" height="10" rx="2" fill="#f3d5d0" stroke="#1d2b36" stroke-width="1.5" /><text x="260" y="46" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">exhaust</text><rect x="212" y="36" width="16" height="26" rx="8" fill="#ffffff" stroke="#1d2b36" stroke-width="2" /><text x="30" y="44" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#1d2b36">Spark plug or fuel injector</text><polyline points="36.0,38.0 220.0,40.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="330" y="90" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2b36">Cylinder head</text><polyline points="324.0,84.0 290.0,90.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="330" y="170" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2b36">Piston</text><polyline points="324.0,164.0 232.0,175.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="330" y="230" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2b36">Connecting rod</text><polyline points="324.0,224.0 230.0,260.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/><text x="330" y="300" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2b36">Crank</text><polyline points="324.0,294.0 230.0,310.0" fill="none" stroke="#1d2b36" stroke-width="1.6"/></g></svg>
