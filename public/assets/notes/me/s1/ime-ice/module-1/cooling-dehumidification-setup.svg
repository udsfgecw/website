<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" role="img" aria-labelledby="title desc"><title id="title">Cooling and dehumidification set-up</title><desc id="desc">Duct with cooling coils; air flows left to right and condensate drips off.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(40,0)"><rect x="100" y="110" width="260" height="110" rx="4" fill="#f7f9fb" stroke="#1d2b36" stroke-width="2.5" /><rect x="230" y="120" width="22" height="90" rx="8" fill="#eef4f7" stroke="#1f4e9a" stroke-width="2" /><text x="241" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">cooling coil</text><polyline points="40.0,165.0 95.0,165.0" fill="none" stroke="#1f4e9a" stroke-width="3" marker-end="url(#blue)"/><text x="60" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1f4e9a">air 1 atm</text><polyline points="365.0,165.0 420.0,165.0" fill="none" stroke="#1f4e9a" stroke-width="3" marker-end="url(#blue)"/><text x="380" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1f4e9a">air 2</text><text x="170" y="260" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#b03a2e">condensate drops</text><circle cx="200" cy="230" r="4" fill="#b03a2e" stroke="#b03a2e" stroke-width="1" /><circle cx="215" cy="245" r="4" fill="#b03a2e" stroke="#b03a2e" stroke-width="1" /></g></svg>
