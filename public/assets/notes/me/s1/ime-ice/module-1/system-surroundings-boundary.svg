<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" role="img" aria-labelledby="title desc"><title id="title">System, surroundings, boundary and universe</title><desc id="desc">Universe containing a system with a boundary and surroundings.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(40,0)"><rect x="40" y="30" width="380" height="280" rx="14" fill="#f7f9fb" stroke="#1d2b36" stroke-width="2" /><text x="230" y="56" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d2b36">Universe</text><circle cx="180" cy="170" r="80" fill="#eef4f7" stroke="#1f4e9a" stroke-width="2.5" stroke-dasharray="7 4"/><text x="180" y="175" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f4e9a">System</text><text x="180" y="275" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1f4e9a">boundary</text><text x="340" y="260" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">surroundings</text></g></svg>
