<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="title desc"><title id="title">Geologic cycle: erosion, transportation, deposition, upheaval</title><desc id="desc">Mountain eroded, sediment transported and deposited, then uplifted again.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(30,0)"><path d="M 40 220 C 110 60 150 60 210 130 C 270 200 330 230 420 210" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="120" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#b03a2e">erosion</text><polyline points="120.0,80.0 120.0,110.0" fill="none" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#red)"/><text x="300" y="90" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f4e9a">transportation</text><polyline points="280.0,110.0 220.0,150.0" fill="none" stroke="#1f4e9a" stroke-width="2.5" marker-end="url(#blue)"/><text x="330" y="250" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#2e7d4f">deposition</text><polyline points="360.0,225.0 360.0,245.0" fill="none" stroke="#2e7d4f" stroke-width="2.5" marker-end="url(#green)"/><text x="60" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2b36">upheaval (uplift) returns the land to the start</text></g></svg>
