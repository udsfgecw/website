<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="title desc"><title id="title">Full journal bearing</title><desc id="desc">Journal with crosshair inside a full hatched bearing with a vertical centreline.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(30,0)"><circle cx="230" cy="170" r="120" fill="#ffffff" stroke="#1d2b36" stroke-width="3" /><circle cx="230" cy="170" r="80" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2.5" /><polyline points="230.0,40.0 230.0,300.0" fill="none" stroke="#1f4e9a" stroke-width="1" stroke-dasharray="5 4"/><polyline points="120.0,170.0 340.0,170.0" fill="none" stroke="#1f4e9a" stroke-width="1" stroke-dasharray="5 4"/><text x="230" y="170" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">journal</text><text x="330" y="80" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2b36">bearing</text></g></svg>
