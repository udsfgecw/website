<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="title desc"><title id="title">Direct and indirect extrusion</title><desc id="desc">Billet in a container pushed by a ram; direct extrusion through a die at the far end, indirect through a hollow ram.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(30,0)"><text x="110" y="36" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d2b36">Direct extrusion</text><rect x="40" y="100" width="130" height="120" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><rect x="60" y="120" width="90" height="80" rx="8" fill="#d9d9d9" stroke="#1d2b36" stroke-width="1.5" /><rect x="10" y="130" width="30" height="60" rx="8" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2" /><rect x="170" y="140" width="30" height="40" rx="8" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2" /><polyline points="200.0,160.0 240.0,160.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><text x="60" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">F direct</text><text x="330" y="36" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d2b36">Indirect extrusion</text><rect x="260" y="100" width="130" height="120" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><rect x="280" y="120" width="90" height="80" rx="8" fill="#d9d9d9" stroke="#1d2b36" stroke-width="1.5" /><polyline points="250.0,150.0 330.0,150.0" fill="none" stroke="#dfe4ea" stroke-width="12"/><polyline points="340.0,160.0 370.0,160.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><text x="290" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">F indirect</text></g></svg>
