<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="title desc"><title id="title">Bevel gear and worm gear</title><desc id="desc">Left: two intersecting conical gears with pitch cones. Right: worm shaft meshing with a worm wheel.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(30,0)"><text x="110" y="36" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d2b36">Bevel gear</text><polygon points="40.0,220.0 180.0,150.0 180.0,290.0 40.0,290.0" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><polygon points="230.0,230.0 150.0,160.0 150.0,290.0" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><polyline points="40.0,220.0 180.0,150.0" fill="none" stroke="#1f4e9a" stroke-width="1.2" stroke-dasharray="5 4"/><text x="330" y="36" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1d2b36">Worm gear</text><circle cx="380" cy="200" r="70" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2.2" /><rect x="230" y="180" width="22" height="140" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2" /><polyline points="240.0,200.0 240.0,320.0" fill="none" stroke="#b03a2e" stroke-width="1.2"/><text x="380" y="292" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">worm wheel</text></g></svg>
