<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="title desc"><title id="title">Shielded metal arc welding (SMAW)</title><desc id="desc">Consumable electrode in an electrode holder, cables to the power source and work clamp, arc between electrode and work.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(30,0)"><rect x="40" y="80" width="90" height="80" rx="6" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><text x="85" y="124" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">AC or DC source</text><polyline points="130.0,100.0 230.0,100.0 230.0,140.0" fill="none" stroke="#1d2b36" stroke-width="3"/><rect x="210" y="140" width="40" height="26" rx="8" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2" /><polyline points="230.0,166.0 230.0,200.0" fill="none" stroke="#1d2b36" stroke-width="5"/><path d="M 230 200 L 232 214 L 228 220 L 234 228" fill="none" stroke="#b03a2e" stroke-width="2"/><text x="245" y="214" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#b03a2e">arc</text><polyline points="130.0,150.0 150.0,240.0 200.0,260.0" fill="none" stroke="#1d2b36" stroke-width="3"/><rect x="120" y="250" width="220" height="24" rx="8" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2" /><text x="240" y="310" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">electrode, flux coating, workpiece</text><text x="160" y="60" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">electrode cable</text></g></svg>
