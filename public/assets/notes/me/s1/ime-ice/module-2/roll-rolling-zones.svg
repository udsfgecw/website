<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="title desc"><title id="title">Rolling process zones and neutral point</title><desc id="desc">Top and bottom rolls with the metal strip entering at V1 and leaving at V2, and the neutral point.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(30,0)"><circle cx="230" cy="80" r="60" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2.2" /><circle cx="230" cy="260" r="60" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2.2" /><rect x="40" y="150" width="380" height="40" rx="8" fill="#e7e9ec" stroke="#1d2b36" stroke-width="2" /><polyline points="60.0,170.0 110.0,170.0" fill="none" stroke="#1f4e9a" stroke-width="3" marker-end="url(#blue)"/><text x="70" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1f4e9a">V₁</text><polyline points="390.0,170.0 420.0,170.0" fill="none" stroke="#1f4e9a" stroke-width="3" marker-end="url(#blue)"/><text x="395" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1f4e9a">V₂</text><circle cx="260" cy="170" r="4" fill="#b03a2e" stroke="#b03a2e" stroke-width="1" /><text x="270" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#b03a2e">neutral point</text><text x="230" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">roll (top), Vr</text><text x="230" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">roll (bottom)</text></g></svg>
