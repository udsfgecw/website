<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="title desc"><title id="title">Horizontal milling machine</title><desc id="desc">Base, column, knee, saddle, table, overhanging arm, arbor and spindle.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(30,0)"><rect x="60" y="270" width="340" height="28" rx="8" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2" /><text x="80" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2b36">base</text><rect x="280" y="80" width="80" height="190" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><text x="320" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">column</text><rect x="180" y="210" width="100" height="22" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2" /><text x="120" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#1d2b36">knee</text><rect x="160" y="160" width="120" height="28" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2" /><text x="100" y="176" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#1d2b36">saddle</text><rect x="170" y="130" width="100" height="16" rx="8" fill="#ffffff" stroke="#1d2b36" stroke-width="2" /><text x="120" y="142" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#1d2b36">table</text><polyline points="280.0,60.0 60.0,60.0" fill="none" stroke="#1d2b36" stroke-width="6"/><text x="60" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2b36">overhanging arm</text><polyline points="140.0,60.0 140.0,110.0" fill="none" stroke="#1d2b36" stroke-width="4"/><text x="160" y="96" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1d2b36">arbor support</text><circle cx="90" cy="80" r="16" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2" /><text x="90" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2b36">arbor / spindle</text></g></svg>
