<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="title desc"><title id="title">Open die forging</title><desc id="desc">Work piece between a movable die above and a fixed die below, with and without friction.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(30,0)"><rect x="120" y="60" width="90" height="40" rx="8" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2" /><text x="165" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">movable die</text><rect x="170" y="130" width="100" height="60" rx="8" fill="#e7e9ec" stroke="#1d2b36" stroke-width="2.2" /><rect x="120" y="230" width="190" height="40" rx="8" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2" /><text x="215" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">fixed die</text><text x="330" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2b36">work piece</text><text x="330" y="160" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1d2b36">no friction: straight sides</text><text x="330" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1d2b36">friction: barrelled</text></g></svg>
