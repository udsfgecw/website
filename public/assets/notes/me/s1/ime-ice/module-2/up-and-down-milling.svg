<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="title desc"><title id="title">Up milling and down milling</title><desc id="desc">Left: cutter rotating against the feed. Right: cutter rotating with the feed.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(30,0)"><text x="110" y="36" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d2b36">Up milling</text><circle cx="110" cy="140" r="50" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2.2" /><rect x="40" y="200" width="140" height="40" rx="8" fill="#e7e9ec" stroke="#1d2b36" stroke-width="2" /><polyline points="60.0,260.0 160.0,260.0" fill="none" stroke="#1f4e9a" stroke-width="3" marker-end="url(#blue)"/><text x="110" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f4e9a">feed</text><text x="330" y="36" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d2b36">Down milling</text><circle cx="330" cy="140" r="50" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2.2" /><rect x="260" y="200" width="140" height="40" rx="8" fill="#e7e9ec" stroke="#1d2b36" stroke-width="2" /><polyline points="390.0,260.0 340.0,260.0" fill="none" stroke="#1f4e9a" stroke-width="3" marker-end="url(#blue)"/><text x="330" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f4e9a">feed</text></g></svg>
