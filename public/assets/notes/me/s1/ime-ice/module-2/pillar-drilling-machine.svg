<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="title desc"><title id="title">Pillar drilling machine</title><desc id="desc">Vertical pillar drilling machine: motor, pulley and belt under a guard, column, table, base and spindle.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(30,0)"><rect x="170" y="40" width="120" height="40" rx="5" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><text x="230" y="66" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">motor</text><rect x="170" y="80" width="40" height="30" rx="8" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2" /><text x="190" y="100" font-family="Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d2b36">pulley</text><rect x="230" y="120" width="22" height="150" rx="8" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2.2" /><text x="330" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2b36">column</text><rect x="130" y="180" width="110" height="16" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2" /><text x="70" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#1d2b36">table</text><rect x="120" y="290" width="180" height="26" rx="8" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2" /><text x="330" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2b36">base</text><rect x="170" y="230" width="40" height="36" rx="8" fill="#ffffff" stroke="#1d2b36" stroke-width="2" /><polyline points="190.0,215.0 190.0,238.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><text x="120" y="250" font-family="Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#1d2b36">spindle, drill</text></g></svg>
