<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="title desc"><title id="title">Reciprocating pump</title><desc id="desc">Cylinder, piston, connecting rod and crank with suction and delivery valves and pipes.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(30,0)"><rect x="190" y="60" width="80" height="120" rx="3" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.5" /><rect x="200" y="100" width="60" height="18" rx="8" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2" /><polyline points="230.0,180.0 230.0,230.0" fill="none" stroke="#1d2b36" stroke-width="3"/><circle cx="230" cy="262" r="30" fill="none" stroke="#1d2b36" stroke-width="2.5" /><circle cx="230" cy="262" r="6" fill="#1d2b36" stroke="#1d2b36" stroke-width="1" /><polyline points="230.0,232.0 230.0,230.0" fill="none" stroke="#1d2b36" stroke-width="2"/><polyline points="260.0,262.0 190.0,262.0" fill="none" stroke="#1d2b36" stroke-width="3"/><rect x="120" y="60" width="70" height="20" rx="8" fill="#ffffff" stroke="#1d2b36" stroke-width="2" /><polyline points="190.0,70.0 120.0,70.0" fill="none" stroke="#1d2b36" stroke-width="4