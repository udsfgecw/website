<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="title desc"><title id="title">Crystal orientation during hot working</title><desc id="desc">Rollers squeezing a sheet, showing old grains and new crystals elongated along the feed.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(30,0)"><circle cx="120" cy="100" r="50" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2.2" /><circle cx="120" cy="240" r="50" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2.2" /><rect x="120" y="140" width="320" height="60" rx="8" fill="#e7e9ec" stroke="#1d2b36" stroke-width="2" /><polyline points="40.0,170.0 90.0,170.0" fill="none" stroke="#1f4e9a" stroke-width="3" marker-end="url(#blue)"/><text x="40" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1f4e9a">feed</text><text x="170" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">old grains</text><text x="300" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">new crystals (elongated)</text></g></svg>
