<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="title desc"><title id="title">Peripheral milling and end milling</title><desc id="desc">Left: cylindrical cutter with horizontal axis. Right: end mill with vertical axis.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(30,0)"><text x="110" y="36" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d2b36">Peripheral milling</text><circle cx="110" cy="130" r="55" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2.2" /><circle cx="110" cy="130" r="12" fill="#ffffff" stroke="#1d2b36" stroke-width="1.5" /><rect x="40" y="220" width="150" height="50" rx="8" fill="#e7e9ec" stroke="#1d2b36" stroke-width="2" /><polyline points="230.0,240.0 200.0,240.0" fill="none" stroke="#1f4e9a" stroke-width="3" marker-end="url(#blue)"/><text x="330" y="36" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d2b36">End milling</text><rect x="340" y="60" width="36" height="80" rx="8" fill="#dfe4ea" stroke="#1d2b36" stroke-width="2" /><rect x="320" y="240" width="76" height