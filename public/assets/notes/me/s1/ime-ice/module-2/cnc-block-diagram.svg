<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-labelledby="title desc"><title id="title">Block diagram of a CNC machine</title><desc id="desc">Input devices, part programs, machine control unit, drive and machine table with feedback.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(30,0)"><rect x="150" y="30" width="160" height="40" rx="6" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><text x="230.0" y="55.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Input devices</text><rect x="150" y="100" width="160" height="40" rx="6" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><text x="230.0" y="125.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Part programs</text><rect x="120" y="170" width="220" height="80" rx="6" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><text x="230.0" y="206.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">MCU</text><text x="230.0" y="224.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">(data processing, control loop)</text><rect x="150" y="280" width="160" height="40" rx="6" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.2" /><text x="230.0" y="305.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">Machine tool and feedback</text><polyline points="230.0,70.0 230.0,100.0" fill="none" stroke="#1d2b36" stroke-width="2.2" marker-end="url(#ink)"/><polyline points="230.0,140.0 230.0,170.0" fill="none" stroke="#1d2b36" stroke-width="2.2" marker-end="url(#ink)"/><polyline points="230.0,250.0 230.0,280.0" fill="none" stroke="#1d2b36" stroke-width="2.2" marker-end="url(#ink)"/></g></svg>
