<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" role="img" aria-labelledby="title desc"><title id="title">Subdivision of mechanics</title><desc id="desc">Mechanics divides into statics and dynamics.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(40,0)"><rect x="150" y="30" width="160" height="44" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2" /><text x="230" y="58" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1d2b36">Mechanics</text><polyline points="230.0,74.0 120.0,120.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="230.0,74.0 340.0,120.0" fill="none" stroke="#1d2b36" stroke-width="2.5" marker-end="url(#ink)"/><rect x="40" y="120" width="160" height="44" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2" /><text x="120" y="148" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#1d2b36">Statics</text><rect x="260" y="120" width="160" height="44" rx="8" fill="#eef4f7" stroke="#1d2b36" stroke-width="2" /><text x="340" y="148" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#1d2b36">Dynamics</text><text x="120" y="200" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">bodies at rest or in equilibrium</text><text x="340" y="200" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">bodies in motion</text></g></svg>
