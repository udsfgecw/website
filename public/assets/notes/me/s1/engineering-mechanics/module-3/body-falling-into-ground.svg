<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" role="img" aria-labelledby="title desc"><title id="title">Body falling from B to A and penetrating into ground to C</title><desc id="desc">15 kg body falls 19.6 m and penetrates into the ground.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(40,0)"><polyline points="120.0,40.0 120.0,290.0" fill="none" stroke="#1d2b36" stroke-width="2"/><polyline points="100.0,40.0 100.0,260.0" fill="none" stroke="#1d2b36" stroke-width="1.2" stroke-dasharray="4 3"/><polyline points="94.0,40.0 106.0,40.0" fill="none" stroke="#1d2b36" stroke-width="1.2"/><polyline points="94.0,260.0 106.0,260.0" fill="none" stroke="#1d2b36" stroke-width="1.2"/><text x="110" y="155.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2b36">19.6 m</text><text x="130" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">B</text><text x="130" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#1d2b36">A</text><polyline points="70.0,260.0 400.0,260.0" fill="none" stroke="#1d2b36" stroke-width="3"/><text x="130" y="300" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2b36">C (penetrates ground)</text><polyline points="70.0,300.0 400.0,300.0" fill="none" stroke="#1d2b36" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="250" y="60" width="40" height="60" rx="3" fill="#eef4f7" stroke="#1d2b36" stroke-width="2" /><text x="270" y="96" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">15 kg</text><polyline points="270.0,130.0 270.0,200.0" fill="none" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#red)"/><text x="280" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#b03a2e">W</text></g></svg>
