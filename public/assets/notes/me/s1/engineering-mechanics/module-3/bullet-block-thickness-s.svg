<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" role="img" aria-labelledby="title desc"><title id="title">Bullet of mass m and a block of wood of thickness s</title><desc id="desc">Bullet of 81 g at 300 m/s penetrates a wooden block of thickness s.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(40,0)"><rect x="200" y="110" width="110" height="120" rx="3" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.5" /><text x="255" y="178" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#1d2b36">s</text><text x="255" y="245" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">block</text><polyline points="60.0,170.0 190.0,170.0" fill="none" stroke="#b03a2e" stroke-width="3.5" marker-end="url(#red)"/><text x="70" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#b03a2e">bullet m, u</text><text x="255" y="90" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">thickness s</text></g></svg>
