<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" role="img" aria-labelledby="title desc"><title id="title">Well: stone fall and sound</title><desc id="desc">Well of depth h; t₁ for the stone to fall, t₂ for the sound to come up.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(40,0)"><polyline points="130.0,40.0 130.0,290.0" fill="none" stroke="#1d2b36" stroke-width="4"/><polyline points="330.0,40.0 330.0,290.0" fill="none" stroke="#1d2b36" stroke-width="4"/><polyline points="130.0,290.0 330.0,290.0" fill="none" stroke="#1d2b36" stroke-width="3"/><circle cx="230" cy="270" r="5" fill="#b03a2e" stroke="#b03a2e" stroke-width="1" /><polyline points="230.0,90.0 230.0,255.0" fill="none" stroke="#b03a2e" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#red)"/><text x="246" y="160" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#b03a2e">t₁ (fall)</text><polyline points="100.0,40.0 100.0,290.0" fill="none" stroke="#1d2b36" stroke-width="1.2" stroke-dasharray="4 3"/><polyline points="94.0,40.0 106.0,40.0" fill="none" stroke="#1d2b36" stroke-width="1.2"/><polyline points="94.0,290.0 106.0,290.0" fill="none" stroke="#1d2b36" stroke-width="1.2"/><text x="110" y="170.0" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2b36">h</text><polyline points="360.0,280.0 360.0,60.0" fill="none" stroke="#1f4e9a" stroke-width="2.2" marker-end="url(#blue)"/><text x="372" y="120" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1f4e9a">t₂ (sound)</text></g></svg>
