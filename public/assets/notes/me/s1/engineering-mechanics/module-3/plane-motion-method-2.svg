<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" role="img" aria-labelledby="title desc"><title id="title">Second method of plane motion decomposition</title><desc id="desc">Rotation followed by translation of the body.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="ink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1d2b36"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b03a2e"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f4e9a"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#2e7d4f"/></marker><marker id="acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#1f6f8b"/></marker></defs><g transform="translate(40,0)"><ellipse cx="90" cy="170" rx="18" ry="60" fill="#eef4f7" stroke="#1d2b36" stroke-width="2.5" transform="rotate(0 90 170)"/><ellipse cx="230" cy="170" rx="18" ry="60" fill="#eef4f7" stroke="#1f4e9a" stroke-width="2.5" transform="rotate(30 230 170)"/><ellipse cx="370" cy="170" rx="18" ry="60" fill="#eef4f7" stroke="#2e7d4f" stroke-width="2.5" transform="rotate(30 370 170)"/><text x="230" y="290" font-family="Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#1d2b36">=</text><text x="90" y="290" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1d2b36">initial</text><text x="230" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1d2b36">translation + rotation</text></g></svg>
