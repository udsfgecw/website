<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1005" viewBox="0 0 720 1005" role="img" aria-labelledby="title desc">
<title id="title">Concert ticket fare</title><desc id="desc">Check conditions in order. A matching branch joins the output directly; it does not test later conditions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="35" text-anchor="middle" fill="#173f35" font-size="23"><tspan x="360" dy="0">Concert ticket fare</tspan></text><rect x="150.0" y="58.0" width="220" height="64" rx="32.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="260" y="96" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="260" dy="0">Start</tspan></text><polygon points="144.0,163.0 400.0,163.0 376.0,227.0 120.0,227.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="260" y="201" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="260" dy="0">READ age</tspan></text><polyline points="260,122 260,161" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polygon points="260,278.0 405.0,330 260,382.0 115.0,330" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="260" y="336" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="260" dy="0">age &lt; 16?</tspan></text><polyline points="260,227 260,276" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="445.0" y="298.0" width="230" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="560" y="336" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="560" dy="0">fare = 7</tspan></text><polyline points="405,330 443,330" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="423" y="315" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="423" dy="0">Yes</tspan></text><polyline points="675,330 700,330 700,795" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="285" y="410" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="285" dy="0">No</tspan></text><polygon points="260,453.0 405.0,505 260,557.0 115.0,505" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="260" y="511" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="260" dy="0">age &gt;= 65?</tspan></text><polyline points="260,382 260,451" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="445.0" y="473.0" width="230" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="560" y="511" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="560" dy="0">fare = 5</tspan></text><polyline points="405,505 443,505" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="423" y="490" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="423" dy="0">Yes</tspan></text><polyline points="675,505 700,505 700,795" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="285" y="585" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="285" dy="0">No</tspan></text><rect x="120.0" y="648.0" width="280" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="260" y="686" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="260" dy="0">fare = 10</tspan></text><polyline points="260,557 260,646" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polygon points="209.0,798.0 535.0,798.0 511.0,862.0 185.0,862.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="836" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">PRINT fare</tspan></text><polyline points="260,712 260,765 360,765 360,796" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="700,795 700,830 537,830" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="235.0" y="908.0" width="250" height="64" rx="32.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="946" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">Stop</tspan></text><polyline points="360,862 360,906" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/></g></svg>
