<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
<title id="title">Flow lines</title><desc id="desc">Arrowheads show which step is followed next.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="38" text-anchor="middle" fill="#173f35" font-size="22"><tspan x="360" dy="0">Flow lines</tspan></text><rect x="75.0" y="93.0" width="180" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="165" y="131" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="165" dy="0">Step 1</tspan></text><rect x="465.0" y="93.0" width="180" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="555" y="131" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="555" dy="0">Step 2</tspan></text><polyline points="255,125 465,125" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="360" y="222" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="360" dy="0">Arrowheads show which step is followed next.</tspan></text></g></svg>
