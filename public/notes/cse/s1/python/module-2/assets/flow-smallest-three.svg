<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1085" viewBox="0 0 720 1085" role="img" aria-labelledby="title desc">
<title id="title">Smallest of three numbers</title><desc id="desc">Start with a as the minimum. Compare b, then c, updating the minimum only when a smaller value is found. Equal values are handled.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="35" text-anchor="middle" fill="#173f35" font-size="23"><tspan x="360" dy="0">Smallest of three numbers</tspan></text><rect x="235.0" y="58.0" width="250" height="64" rx="32.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="96" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">Start</tspan></text><polygon points="234.0,163.0 510.0,163.0 486.0,227.0 210.0,227.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="201" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">READ a, b, c</tspan></text><rect x="210.0" y="268.0" width="300" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="306" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">smallest = a</tspan></text><polygon points="360,378.0 510.0,430 360,482.0 210.0,430" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="436" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">b &lt; smallest?</tspan></text><rect x="470.0" y="508.0" width="230" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="585" y="546" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="585" dy="0">smallest = b</tspan></text><polygon points="360,618.0 510.0,670 360,722.0 210.0,670" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="676" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">c &lt; smallest?</tspan></text><rect x="470.0" y="748.0" width="230" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="585" y="786" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="585" dy="0">smallest = c</tspan></text><polygon points="224.0,878.0 520.0,878.0 496.0,942.0 200.0,942.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="916" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">PRINT smallest</tspan></text><rect x="235.0" y="988.0" width="250" height="64" rx="32.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="1026" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">Stop</tspan></text><polyline points="360,122 360,161" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="360,227 360,266" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="360,332 360,376" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="510,430 585,430 585,506" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="555" y="415" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="555" dy="0">Yes</tspan></text><polyline points="585,572 585,615 360,615 360,616" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="360,482 360,616" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="390" y="540" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="390" dy="0">No</tspan></text><polyline points="510,670 585,670 585,746" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="555" y="655" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="555" dy="0">Yes</tspan></text><polyline points="585,812 585,855 360,855 360,856" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="360,722 360,856" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="390" y="780" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="390" dy="0">No</tspan></text><polyline points="360,942 360,986" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/></g></svg>
