<svg xmlns="http://www.w3.org/2000/svg" width="720" height="965" viewBox="0 0 720 965" role="img" aria-labelledby="title desc">
<title id="title">Factorial · ascending counter</title><desc id="desc">Initialize the product to one. Multiply by each counter value while the condition holds. When the loop finishes, print the factorial.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="35" text-anchor="middle" fill="#173f35" font-size="23"><tspan x="360" dy="0">Factorial · ascending counter</tspan></text><rect x="235.0" y="58.0" width="250" height="64" rx="32.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="96" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">Start</tspan></text><polygon points="194.0,158.0 550.0,158.0 526.0,222.0 170.0,222.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="196" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">READ n; n is an integer &gt;= 0</tspan></text><rect x="190.0" y="258.0" width="340" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="296" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">fact = 1; i = 1</tspan></text><polygon points="360,368.0 500.0,420 360,472.0 220.0,420" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="426" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">i &lt;= n?</tspan></text><polyline points="360,122 360,156" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="360,222 360,256" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="360,322 360,366" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="190.0" y="523.0" width="340" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="561" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">fact = fact × i</tspan></text><rect x="190.0" y="633.0" width="340" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="671" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">i = i + 1</tspan></text><polyline points="360,472 360,521" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="390" y="500" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="390" dy="0">Yes</tspan></text><polyline points="360,587 360,631" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="360,697 120,697 120,420 218,420" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polygon points="214.0,763.0 530.0,763.0 506.0,827.0 190.0,827.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="801" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">PRINT fact</tspan></text><rect x="235.0" y="868.0" width="250" height="64" rx="32.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="906" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">Stop</tspan></text><polyline points="500,420 650,420 650,740 360,740 360,761" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="555" y="402" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="555" dy="0">No</tspan></text><polyline points="360,827 360,866" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/></g></svg>
