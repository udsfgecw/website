<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1180" viewBox="0 0 720 1180" role="img" aria-labelledby="title desc">
<title id="title">Colour-code selection</title><desc id="desc">Check conditions in order. A matching branch joins the output directly; it does not test later conditions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="35" text-anchor="middle" fill="#173f35" font-size="23"><tspan x="360" dy="0">Colour-code selection</tspan></text><rect x="150.0" y="58.0" width="220" height="64" rx="32.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="260" y="96" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="260" dy="0">Start</tspan></text><polygon points="144.0,163.0 400.0,163.0 376.0,227.0 120.0,227.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="260" y="201" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="260" dy="0">READ code</tspan></text><polyline points="260,122 260,161" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polygon points="260,278.0 405.0,330 260,382.0 115.0,330" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="260" y="336" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="260" dy="0">code = R?</tspan></text><polyline points="260,227 260,276" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="445.0" y="298.0" width="230" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="560" y="336" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="560" dy="0">result = Red</tspan></text><polyline points="405,330 443,330" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="423" y="315" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="423" dy="0">Yes</tspan></text><polyline points="675,330 700,330 700,970" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="285" y="410" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="285" dy="0">No</tspan></text><polygon points="260,453.0 405.0,505 260,557.0 115.0,505" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="260" y="511" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="260" dy="0">code = G?</tspan></text><polyline points="260,382 260,451" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="445.0" y="473.0" width="230" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="560" y="511" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="560" dy="0">result = Green</tspan></text><polyline points="405,505 443,505" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="423" y="490" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="423" dy="0">Yes</tspan></text><polyline points="675,505 700,505 700,970" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="285" y="585" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="285" dy="0">No</tspan></text><polygon points="260,628.0 405.0,680 260,732.0 115.0,680" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="260" y="686" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="260" dy="0">code = B?</tspan></text><polyline points="260,557 260,626" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="445.0" y="648.0" width="230" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="560" y="686" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="560" dy="0">result = Blue</tspan></text><polyline points="405,680 443,680" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="423" y="665" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="423" dy="0">Yes</tspan></text><polyline points="675,680 700,680 700,970" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="285" y="760" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="285" dy="0">No</tspan></text><rect x="120.0" y="823.0" width="280" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="260" y="861" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="260" dy="0">result = Wrong code</tspan></text><polyline points="260,732 260,821" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polygon points="209.0,973.0 535.0,973.0 511.0,1037.0 185.0,1037.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="1011" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">PRINT result</tspan></text><polyline points="260,887 260,940 360,940 360,971" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="700,970 700,1005 537,1005" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="235.0" y="1083.0" width="250" height="64" rx="32.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="1121" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">Stop</tspan></text><polyline points="360,1037 360,1081" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/></g></svg>
