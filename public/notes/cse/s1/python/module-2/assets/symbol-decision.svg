<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
<title id="title">Decision</title><desc id="desc">Label each outgoing branch with its outcome.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="38" text-anchor="middle" fill="#173f35" font-size="22"><tspan x="360" dy="0">Decision</tspan></text><polygon points="360,73.0 485.0,125 360,177.0 235.0,125" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="131" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">age &gt;= 18?</tspan></text><polyline points="235,125 135,125" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="175" y="110" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="175" dy="0">No</tspan></text><polyline points="485,125 585,125" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="540" y="110" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="540" dy="0">Yes</tspan></text><text x="360" y="222" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="360" dy="0">Label each outgoing branch with its outcome.</tspan></text></g></svg>
