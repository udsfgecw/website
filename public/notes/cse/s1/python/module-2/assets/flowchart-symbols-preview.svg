<svg xmlns="http://www.w3.org/2000/svg" width="720" height="810" viewBox="0 0 800 900" role="img" aria-labelledby="title desc">
<title id="title">Flowchart symbol reference</title><desc id="desc">Eight flowchart symbols: terminator, flow lines, process, input/output, decision, connectors, module, and counter loop.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="400" y="45" text-anchor="middle" fill="#173f35" font-size="28"><tspan x="400" dy="0">Flowchart symbols · Module 2</tspan></text><g transform="translate(20,75)"><rect width="370" height="184" rx="12" fill="#f7faf8" stroke="#dce9df"/><text x="185" y="30" text-anchor="middle" fill="#173f35" font-size="17"><tspan x="185" dy="0">Start / stop</tspan></text><g transform="translate(5,8) scale(0.5)"><rect x="90.0" y="93.0" width="220" height="64" rx="32.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="200" y="131" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="200" dy="0">START</tspan></text><rect x="410.0" y="93.0" width="220" height="64" rx="32.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="520" y="131" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="520" dy="0">STOP</tspan></text></g></g><g transform="translate(410,75)"><rect width="370" height="184" rx="12" fill="#f7faf8" stroke="#dce9df"/><text x="185" y="30" text-anchor="middle" fill="#173f35" font-size="17"><tspan x="185" dy="0">Flow lines</tspan></text><g transform="translate(5,8) scale(0.5)"><rect x="75.0" y="93.0" width="180" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="165" y="131" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="165" dy="0">Step 1</tspan></text><rect x="465.0" y="93.0" width="180" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="555" y="131" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="555" dy="0">Step 2</tspan></text><polyline points="255,125 465,125" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/></g></g><g transform="translate(20,275)"><rect width="370" height="184" rx="12" fill="#f7faf8" stroke="#dce9df"/><text x="185" y="30" text-anchor="middle" fill="#173f35" font-size="17"><tspan x="185" dy="0">Process</tspan></text><g transform="translate(5,8) scale(0.5)"><rect x="185.0" y="93.0" width="350" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="131" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">total = price × quantity</tspan></text></g></g><g transform="translate(410,275)"><rect width="370" height="184" rx="12" fill="#f7faf8" stroke="#dce9df"/><text x="185" y="30" text-anchor="middle" fill="#173f35" font-size="17"><tspan x="185" dy="0">Input / output</tspan></text><g transform="translate(5,8) scale(0.5)"><polygon points="209.0,93.0 535.0,93.0 511.0,157.0 185.0,157.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="131" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">READ age / PRINT fare</tspan></text></g></g><g transform="translate(20,475)"><rect width="370" height="184" rx="12" fill="#f7faf8" stroke="#dce9df"/><text x="185" y="30" text-anchor="middle" fill="#173f35" font-size="17"><tspan x="185" dy="0">Decision</tspan></text><g transform="translate(5,8) scale(0.5)"><polygon points="360,73.0 485.0,125 360,177.0 235.0,125" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="131" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">age &gt;= 18?</tspan></text><polyline points="235,125 135,125" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="175" y="110" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="175" dy="0">No</tspan></text><polyline points="485,125 585,125" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="540" y="110" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="540" dy="0">Yes</tspan></text></g></g><g transform="translate(410,475)"><rect width="370" height="184" rx="12" fill="#f7faf8" stroke="#dce9df"/><text x="185" y="30" text-anchor="middle" fill="#173f35" font-size="17"><tspan x="185" dy="0">On-page / off-page connectors</tspan></text><g transform="translate(5,8) scale(0.5)"><circle cx="220" cy="125" r="32" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="220" y="131" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="220" dy="0">A</tspan></text><polygon points="452,93 548,93 548,137 500,167 452,137" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="500" y="131" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="500" dy="0">B</tspan></text><text x="220" y="187" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="220" dy="0">Same page</tspan></text><text x="500" y="187" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="500" dy="0">Another page</tspan></text></g></g><g transform="translate(20,675)"><rect width="370" height="184" rx="12" fill="#f7faf8" stroke="#dce9df"/><text x="185" y="30" text-anchor="middle" fill="#173f35" font-size="17"><tspan x="185" dy="0">Predefined process / module</tspan></text><g transform="translate(5,8) scale(0.5)"><rect x="185.0" y="93.0" width="350" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><path d="M202.0,93.0v64 M518.0,93.0v64" fill="none" stroke="#28765a" stroke-width="2.5"/><text x="360" y="131" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">CALL calculate_average</tspan></text></g></g><g transform="translate(410,675)"><rect width="370" height="184" rx="12" fill="#f7faf8" stroke="#dce9df"/><text x="185" y="30" text-anchor="middle" fill="#173f35" font-size="17"><tspan x="185" dy="0">Counter-loop notation</tspan></text><g transform="translate(5,8) scale(0.5)"><polygon points="213.0,93.0 507.0,93.0 535.0,125 507.0,157.0 213.0,157.0 185.0,125" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="131" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">i = 1 TO n, STEP 1</tspan></text></g></g></g></svg>
