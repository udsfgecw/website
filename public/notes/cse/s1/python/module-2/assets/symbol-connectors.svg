<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
<title id="title">On-page / off-page connectors</title><desc id="desc">Matching labels show where the flow continues.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="38" text-anchor="middle" fill="#173f35" font-size="22"><tspan x="360" dy="0">On-page / off-page connectors</tspan></text><circle cx="220" cy="125" r="32" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="220" y="131" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="220" dy="0">A</tspan></text><polygon points="452,93 548,93 548,137 500,167 452,137" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="500" y="131" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="500" dy="0">B</tspan></text><text x="220" y="187" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="220" dy="0">Same page</tspan></text><text x="500" y="187" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="500" dy="0">Another page</tspan></text><text x="360" y="222" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="360" dy="0">Matching labels show where the flow continues.</tspan></text></g></svg>
