<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img" aria-labelledby="title desc">
<title id="title">Calculate simple interest</title><desc id="desc">Follow the arrows from start to stop.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="35" text-anchor="middle" fill="#173f35" font-size="23"><tspan x="360" dy="0">Calculate simple interest</tspan></text><rect x="165.0" y="68.0" width="390" height="64" rx="32.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="106" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">Start</tspan></text><polygon points="189.0,178.0 555.0,178.0 531.0,242.0 165.0,242.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="216" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">READ principal, rate, years</tspan></text><polyline points="360,132 360,176" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="165.0" y="288.0" width="390" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="326" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">interest = principal × rate × years / 100</tspan></text><polyline points="360,242 360,286" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polygon points="189.0,398.0 555.0,398.0 531.0,462.0 165.0,462.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="436" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">PRINT interest</tspan></text><polyline points="360,352 360,396" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="165.0" y="508.0" width="390" height="64" rx="32.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="546" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">Stop</tspan></text><polyline points="360,462 360,506" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/></g></svg>
