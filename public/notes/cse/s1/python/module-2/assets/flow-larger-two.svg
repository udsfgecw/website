<svg xmlns="http://www.w3.org/2000/svg" width="720" height="765" viewBox="0 0 720 765" role="img" aria-labelledby="title desc">
<title id="title">Larger of two numbers</title><desc id="desc">Read the input, evaluate the decision, follow the labelled branch, then display the result.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="35" text-anchor="middle" fill="#173f35" font-size="23"><tspan x="360" dy="0">Larger of two numbers</tspan></text><rect x="235.0" y="58.0" width="250" height="64" rx="32.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="96" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">Start</tspan></text><polygon points="259.0,163.0 485.0,163.0 461.0,227.0 235.0,227.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="201" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">READ a, b</tspan></text><polygon points="360,268.0 485.0,320 360,372.0 235.0,320" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="326" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">a &gt;= b?</tspan></text><polyline points="360,122 360,161" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="360,227 360,266" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="42.5" y="433.0" width="275" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="180" y="471" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="180" dy="0">largest = a</tspan></text><rect x="402.5" y="433.0" width="275" height="64" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="540" y="471" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="540" dy="0">largest = b</tspan></text><polyline points="235,320 180,320 180,431" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="200" y="300" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="200" dy="0">Yes</tspan></text><polyline points="485,320 540,320 540,431" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="520" y="300" text-anchor="middle" fill="#173f35" font-size="16"><tspan x="520" dy="0">No</tspan></text><polygon points="214.0,558.0 530.0,558.0 506.0,622.0 190.0,622.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="596" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">PRINT largest</tspan></text><rect x="235.0" y="668.0" width="250" height="64" rx="32.0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="706" text-anchor="middle" fill="#173f35" font-size="19"><tspan x="360" dy="0">Stop</tspan></text><polyline points="180,497 180,535 360,535 360,556" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="540,497 540,535 360,535 360,556" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="360,622 360,666" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/></g></svg>
