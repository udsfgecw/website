<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
<title id="title">Brute force on a 4-digit padlock</title><desc id="desc">Combinations from 0000 to 9999 are tried one after another. In the worst case the correct combination is the last, and an n-digit lock has ten to the n candidates.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b4561f"/></marker></defs>
<rect width="720" height="380" rx="16" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="38" text-anchor="middle" font-size="24" font-weight="normal" fill="#173f35">Brute force on a 4-digit padlock</text><text x="360" y="78" text-anchor="middle" font-size="17" font-weight="normal" fill="#173f35">Try every candidate in order until the lock opens.</text><rect x="25.0" y="122.0" width="90" height="56" rx="8" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="70" y="156.27" text-anchor="middle" font-size="19" font-weight="normal" fill="#173f35">0000</text><polyline points="117,150 139,150" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="141.0" y="122.0" width="90" height="56" rx="8" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="186" y="156.27" text-anchor="middle" font-size="19" font-weight="normal" fill="#173f35">0001</text><polyline points="233,150 255,150" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="257.0" y="122.0" width="90" height="56" rx="8" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="302" y="156.27" text-anchor="middle" font-size="19" font-weight="normal" fill="#173f35">0002</text><polyline points="349,150 371,150" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="373.0" y="122.0" width="90" height="56" rx="8" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="418" y="156.27" text-anchor="middle" font-size="19" font-weight="normal" fill="#173f35">…</text><polyline points="465,150 487,150" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="489.0" y="122.0" width="90" height="56" rx="8" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="534" y="156.27" text-anchor="middle" font-size="19" font-weight="normal" fill="#173f35">9998</text><polyline points="581,150 603,150" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="605.0" y="122.0" width="90" height="56" rx="8" fill="#fbeee3" stroke="#b4561f" stroke-width="2.5"/><text x="650" y="156.27" text-anchor="middle" font-size="19" font-weight="normal" fill="#173f35">9999</text><text x="70" y="208" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">first try</text><text x="650" y="208" text-anchor="middle" font-size="16" font-weight="normal" fill="#b4561f">worst case: last try</text><rect x="180.0" y="255.0" width="360" height="60" rx="8" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="291.93" text-anchor="middle" font-size="21" font-weight="normal" fill="#173f35">n digits  →  10ⁿ candidates</text><text x="360" y="350" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">A 4-digit lock has 10⁴ = 10,000 combinations; each extra digit multiplies the work by 10.</text></g></svg>
