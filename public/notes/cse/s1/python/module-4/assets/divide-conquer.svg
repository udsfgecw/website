<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" role="img" aria-labelledby="title desc">
<title id="title">Divide, conquer, combine</title><desc id="desc">A problem is divided into smaller sub-problems, each is solved recursively until a base case, and the sub-solutions are combined into the final answer.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b4561f"/></marker></defs>
<rect width="720" height="510" rx="16" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="38" text-anchor="middle" font-size="24" font-weight="normal" fill="#173f35">Divide, conquer, combine</text><rect x="230.0" y="70.0" width="260" height="60" rx="8" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="106.27" text-anchor="middle" font-size="19" font-weight="normal" fill="#173f35">Problem of size n</text><rect x="65.0" y="190.0" width="230" height="60" rx="8" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="180" y="226.27" text-anchor="middle" font-size="19" font-weight="normal" fill="#173f35">Sub-problem 1</text><rect x="425.0" y="190.0" width="230" height="60" rx="8" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="540" y="226.27" text-anchor="middle" font-size="19" font-weight="normal" fill="#173f35">Sub-problem 2</text><polyline points="300,130 180,190" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="420,130 540,190" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="215" y="160" text-anchor="end" font-size="18" font-weight="bold" fill="#b4561f">Divide</text><rect x="65.0" y="310.0" width="230" height="60" rx="8" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="180" y="346.27" text-anchor="middle" font-size="19" font-weight="normal" fill="#173f35">Solved 1</text><rect x="425.0" y="310.0" width="230" height="60" rx="8" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="540" y="346.27" text-anchor="middle" font-size="19" font-weight="normal" fill="#173f35">Solved 2</text><polyline points="180,250 180,310" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="540,250 540,310" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="195" y="285" text-anchor="start" font-size="15" font-weight="normal" fill="#173f35">Conquer (recurse;</text><text x="195" y="303" text-anchor="start" font-size="15" font-weight="normal" fill="#173f35">base case stops)</text><rect x="230.0" y="430.0" width="260" height="60" rx="8" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="466.27" text-anchor="middle" font-size="19" font-weight="normal" fill="#173f35">Combined answer</text><polyline points="180,370 300,432" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="540,370 420,432" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="215" y="425" text-anchor="end" font-size="18" font-weight="bold" fill="#b4561f">Combine</text></g></svg>
