<svg xmlns="http://www.w3.org/2000/svg" width="720" height="505" viewBox="0 0 720 505" role="img" aria-labelledby="title desc">
<title id="title">When greedy is not optimal</title><desc id="desc">For coins of value 1, 3 and 4, the greedy choice for 6 uses 4, 1, 1 which is three coins, while 3 and 3 needs only two.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b4561f"/></marker></defs>
<rect width="720" height="505" rx="16" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="38" text-anchor="middle" font-size="24" font-weight="normal" fill="#173f35">When greedy is not optimal</text><text x="360" y="80" text-anchor="middle" font-size="18" font-weight="normal" fill="#173f35">Make 6 from coins of value 1, 3 and 4</text><text x="40" y="150" text-anchor="start" font-size="21" font-weight="bold" fill="#b4561f">Greedy</text><text x="40" y="176" text-anchor="start" font-size="15" font-weight="normal" fill="#173f35">always take the largest coin that fits</text><circle cx="120" cy="235" r="24" fill="#fbeee3" stroke="#b4561f" stroke-width="2.5"/><text x="120" y="242" text-anchor="middle" font-size="20" font-weight="normal" fill="#173f35">4</text><circle cx="190" cy="235" r="24" fill="#fbeee3" stroke="#b4561f" stroke-width="2.5"/><text x="190" y="242" text-anchor="middle" font-size="20" font-weight="normal" fill="#173f35">1</text><circle cx="260" cy="235" r="24" fill="#fbeee3" stroke="#b4561f" stroke-width="2.5"/><text x="260" y="242" text-anchor="middle" font-size="20" font-weight="normal" fill="#173f35">1</text><text x="420" y="242" text-anchor="start" font-size="20" font-weight="bold" fill="#b4561f">3 coins</text><text x="40" y="330" text-anchor="start" font-size="21" font-weight="bold" fill="#28765a">Optimal</text><text x="40" y="356" text-anchor="start" font-size="15" font-weight="normal" fill="#173f35">consider the combinations (dynamic programming)</text><circle cx="120" cy="415" r="24" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="120" y="422" text-anchor="middle" font-size="20" font-weight="normal" fill="#173f35">3</text><circle cx="190" cy="415" r="24" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="190" y="422" text-anchor="middle" font-size="20" font-weight="normal" fill="#173f35">3</text><text x="420" y="422" text-anchor="start" font-size="20" font-weight="bold" fill="#28765a">2 coins</text><text x="360" y="480" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">A locally best choice does not always give the globally best answer.</text></g></svg>
