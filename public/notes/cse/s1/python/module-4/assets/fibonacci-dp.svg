<svg xmlns="http://www.w3.org/2000/svg" width="720" height="595" viewBox="0 0 720 595" role="img" aria-labelledby="title desc">
<title id="title">Fibonacci: repeated work versus a table</title><desc id="desc">The recursion tree for F(4) computes F(2) twice. A dynamic programming table computes F(0) to F(4) once each by adding the two previous cells.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b4561f"/></marker></defs>
<rect width="720" height="595" rx="16" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="38" text-anchor="middle" font-size="24" font-weight="normal" fill="#173f35">Fibonacci: repeated work versus a table</text><text x="360" y="76" text-anchor="middle" font-size="17" font-weight="normal" fill="#173f35">Plain recursion for F(4) repeats work (highlighted)</text><polyline points="360,134 230,169" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="360,134 510,169" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="230,209 150,244" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="230,209 310,244" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="510,209 440,244" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="510,209 580,244" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="150,284 100,319" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="150,284 200,319" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="323.0" y="98.0" width="74" height="34" rx="17" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="120.28" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">F(4)</text><rect x="193.0" y="173.0" width="74" height="34" rx="17" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="230" y="195.28" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">F(3)</text><rect x="473.0" y="173.0" width="74" height="34" rx="17" fill="#fbeee3" stroke="#b4561f" stroke-width="2.5"/><text x="510" y="195.28" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">F(2)</text><rect x="113.0" y="248.0" width="74" height="34" rx="17" fill="#fbeee3" stroke="#b4561f" stroke-width="2.5"/><text x="150" y="270.28" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">F(2)</text><rect x="273.0" y="248.0" width="74" height="34" rx="17" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="310" y="270.28" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">F(1)</text><rect x="403.0" y="248.0" width="74" height="34" rx="17" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="440" y="270.28" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">F(1)</text><rect x="543.0" y="248.0" width="74" height="34" rx="17" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="580" y="270.28" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">F(0)</text><rect x="63.0" y="323.0" width="74" height="34" rx="17" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="100" y="345.28" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">F(1)</text><rect x="163.0" y="323.0" width="74" height="34" rx="17" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="200" y="345.28" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">F(0)</text><text x="360" y="385" text-anchor="middle" font-size="17" font-weight="normal" fill="#173f35">Dynamic programming: compute each value once and store it</text><rect x="80.0" y="465.0" width="80" height="50" rx="8" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="120" y="496.93" text-anchor="middle" font-size="21" font-weight="normal" fill="#173f35">0</text><text x="120" y="535" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">F(0)</text><rect x="200.0" y="465.0" width="80" height="50" rx="8" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="240" y="496.93" text-anchor="middle" font-size="21" font-weight="normal" fill="#173f35">1</text><text x="240" y="535" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">F(1)</text><rect x="320.0" y="465.0" width="80" height="50" rx="8" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="496.93" text-anchor="middle" font-size="21" font-weight="normal" fill="#173f35">1</text><text x="360" y="535" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">F(2)</text><rect x="440.0" y="465.0" width="80" height="50" rx="8" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="480" y="496.93" text-anchor="middle" font-size="21" font-weight="normal" fill="#173f35">2</text><text x="480" y="535" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">F(3)</text><rect x="560.0" y="465.0" width="80" height="50" rx="8" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="600" y="496.93" text-anchor="middle" font-size="21" font-weight="normal" fill="#173f35">3</text><text x="600" y="535" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">F(4)</text><path d="M265,465 Q300.0,440 338,463" fill="none" stroke="#28765a" stroke-width="2" marker-end="url(#arrow)"/><path d="M120,465 Q240.0,413 360,463" fill="none" stroke="#28765a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M385,465 Q420.0,440 458,463" fill="none" stroke="#28765a" stroke-width="2" marker-end="url(#arrow)"/><path d="M240,465 Q360.0,413 480,463" fill="none" stroke="#28765a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M505,465 Q540.0,440 578,463" fill="none" stroke="#28765a" stroke-width="2" marker-end="url(#arrow)"/><path d="M360,465 Q480.0,413 600,463" fill="none" stroke="#28765a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="360" y="568" text-anchor="middle" font-size="16" font-weight="normal" fill="#173f35">Each cell is the sum of the two cells before it.</text></g></svg>
