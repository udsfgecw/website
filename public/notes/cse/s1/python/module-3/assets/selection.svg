<svg xmlns="http://www.w3.org/2000/svg" width="720" height="665" viewBox="0 0 720 665" role="img" aria-labelledby="title desc">
<title id="title">Two-way selection</title><desc id="desc">If age is at least 18, print Adult; otherwise print Minor. The two branches rejoin after their actions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker></defs>
<rect width="720" height="665" rx="16" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="38" text-anchor="middle" font-size="24" fill="#173f35">Two-way selection</text><rect x="235.0" y="65" width="250" height="60" rx="30" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="101" text-anchor="middle" font-size="19" fill="#173f35">Start</text><polygon points="255.0,165 485.0,165 465.0,225 235.0,225" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="201" text-anchor="middle" font-size="19" fill="#173f35">Read age</text><polygon points="360,275 485.0,325 360,375 235.0,325" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="331" text-anchor="middle" font-size="19" fill="#173f35">age &gt;= 18?</text><polyline points="360,125 360,163" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="360,225 360,273" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polygon points="65.0,435 305.0,435 285.0,495 45.0,495" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="175" y="471" text-anchor="middle" font-size="19" fill="#173f35">Print Adult</text><polygon points="435.0,435 675.0,435 655.0,495 415.0,495" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="545" y="471" text-anchor="middle" font-size="19" fill="#173f35">Print Minor</text><polyline points="235,325 175,325 175,433" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="180" y="305" text-anchor="middle" font-size="16" fill="#173f35">True</text><polyline points="485,325 545,325 545,433" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="540" y="305" text-anchor="middle" font-size="16" fill="#173f35">False</text><rect x="235.0" y="570" width="250" height="60" rx="30" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="360" y="606" text-anchor="middle" font-size="19" fill="#173f35">Continue / stop</text><polyline points="175,495 175,540 360,540 360,568" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="545,495 545,540 360,540 360,568" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/></g></svg>
