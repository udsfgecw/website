<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">Indexing &quot;Hello World&quot;</title><desc id="desc">The eleven characters are indexed from zero to ten or from minus eleven to minus one. The space is index five. There is no extra null terminator cell.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker></defs>
<rect width="720" height="300" rx="16" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="38" text-anchor="middle" font-size="24" fill="#173f35">Indexing &quot;Hello World&quot;</text><text x="360" y="76" text-anchor="middle" font-size="17" fill="#173f35">Each cell is one indexed character, not a byte.</text><text x="80" y="112" text-anchor="middle" font-size="17" fill="#173f35">0</text><rect x="52" y="128" width="56" height="62" fill="#edf6f0" stroke="#28765a"/><text x="80" y="166" text-anchor="middle" font-size="22" fill="#173f35">H</text><text x="80" y="222" text-anchor="middle" font-size="17" fill="#173f35">-11</text><text x="136" y="112" text-anchor="middle" font-size="17" fill="#173f35">1</text><rect x="108" y="128" width="56" height="62" fill="#edf6f0" stroke="#28765a"/><text x="136" y="166" text-anchor="middle" font-size="22" fill="#173f35">e</text><text x="136" y="222" text-anchor="middle" font-size="17" fill="#173f35">-10</text><text x="192" y="112" text-anchor="middle" font-size="17" fill="#173f35">2</text><rect x="164" y="128" width="56" height="62" fill="#edf6f0" stroke="#28765a"/><text x="192" y="166" text-anchor="middle" font-size="22" fill="#173f35">l</text><text x="192" y="222" text-anchor="middle" font-size="17" fill="#173f35">-9</text><text x="248" y="112" text-anchor="middle" font-size="17" fill="#173f35">3</text><rect x="220" y="128" width="56" height="62" fill="#edf6f0" stroke="#28765a"/><text x="248" y="166" text-anchor="middle" font-size="22" fill="#173f35">l</text><text x="248" y="222" text-anchor="middle" font-size="17" fill="#173f35">-8</text><text x="304" y="112" text-anchor="middle" font-size="17" fill="#173f35">4</text><rect x="276" y="128" width="56" height="62" fill="#edf6f0" stroke="#28765a"/><text x="304" y="166" text-anchor="middle" font-size="22" fill="#173f35">o</text><text x="304" y="222" text-anchor="middle" font-size="17" fill="#173f35">-7</text><text x="360" y="112" text-anchor="middle" font-size="17" fill="#173f35">5</text><rect x="332" y="128" width="56" height="62" fill="#edf6f0" stroke="#28765a"/><text x="360" y="166" text-anchor="middle" font-size="15" fill="#173f35">space</text><text x="360" y="222" text-anchor="middle" font-size="17" fill="#173f35">-6</text><text x="416" y="112" text-anchor="middle" font-size="17" fill="#173f35">6</text><rect x="388" y="128" width="56" height="62" fill="#edf6f0" stroke="#28765a"/><text x="416" y="166" text-anchor="middle" font-size="22" fill="#173f35">W</text><text x="416" y="222" text-anchor="middle" font-size="17" fill="#173f35">-5</text><text x="472" y="112" text-anchor="middle" font-size="17" fill="#173f35">7</text><rect x="444" y="128" width="56" height="62" fill="#edf6f0" stroke="#28765a"/><text x="472" y="166" text-anchor="middle" font-size="22" fill="#173f35">o</text><text x="472" y="222" text-anchor="middle" font-size="17" fill="#173f35">-4</text><text x="528" y="112" text-anchor="middle" font-size="17" fill="#173f35">8</text><rect x="500" y="128" width="56" height="62" fill="#edf6f0" stroke="#28765a"/><text x="528" y="166" text-anchor="middle" font-size="22" fill="#173f35">r</text><text x="528" y="222" text-anchor="middle" font-size="17" fill="#173f35">-3</text><text x="584" y="112" text-anchor="middle" font-size="17" fill="#173f35">9</text><rect x="556" y="128" width="56" height="62" fill="#edf6f0" stroke="#28765a"/><text x="584" y="166" text-anchor="middle" font-size="22" fill="#173f35">l</text><text x="584" y="222" text-anchor="middle" font-size="17" fill="#173f35">-2</text><text x="640" y="112" text-anchor="middle" font-size="17" fill="#173f35">10</text><rect x="612" y="128" width="56" height="62" fill="#edf6f0" stroke="#28765a"/><text x="640" y="166" text-anchor="middle" font-size="22" fill="#173f35">d</text><text x="640" y="222" text-anchor="middle" font-size="17" fill="#173f35">-1</text><text x="360" y="267" text-anchor="middle" font-size="17" fill="#173f35">Positive indices above · negative indices below</text></g></svg>
