<svg xmlns="http://www.w3.org/2000/svg" width="720" height="465" viewBox="0 0 720 465" role="img" aria-labelledby="title desc">
<title id="title">Assignment versus a list slice</title><desc id="desc">values and alias refer to one list. copy refers to a separate outer list created by slicing. A shallow copy can still share nested objects.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker></defs>
<rect width="720" height="465" rx="16" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="38" text-anchor="middle" font-size="24" fill="#173f35">Assignment versus a list slice</text><text x="150" y="112" text-anchor="middle" font-size="22" fill="#173f35">values</text><text x="150" y="192" text-anchor="middle" font-size="22" fill="#173f35">alias</text><text x="150" y="317" text-anchor="middle" font-size="22" fill="#173f35">copy</text><rect x="335.0" y="125" width="310" height="60" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="490" y="161" text-anchor="middle" font-size="19" fill="#173f35">[10, 20, 30]</text><rect x="335.0" y="280" width="310" height="60" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="490" y="316" text-anchor="middle" font-size="19" fill="#173f35">[10, 20, 30]</text><polyline points="205,105 270,105 270,155 333,155" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="205,185 270,185 270,155 333,155" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="205,310 333,310" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="490" y="217" text-anchor="middle" font-size="17" fill="#173f35">One shared list</text><text x="490" y="372" text-anchor="middle" font-size="17" fill="#173f35">A separate outer list from values[:]</text><text x="360" y="428" text-anchor="middle" font-size="17" fill="#173f35">Nested objects can still be shared by a shallow copy.</text></g></svg>
