<svg xmlns="http://www.w3.org/2000/svg" width="720" height="535" viewBox="0 0 720 535" role="img" aria-labelledby="title desc">
<title id="title">Arguments, call, and return</title><desc id="desc">The caller supplies 6 and 8 to add_numbers. The function computes 14, returns it, and the caller prints the received answer.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#28765a"/></marker></defs>
<rect width="720" height="535" rx="16" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="360" y="38" text-anchor="middle" font-size="24" fill="#173f35">Arguments, call, and return</text><text x="180" y="95" text-anchor="middle" font-size="21" fill="#173f35">Caller</text><text x="540" y="95" text-anchor="middle" font-size="21" fill="#173f35">Function</text><rect x="45.0" y="125" width="270" height="60" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="180" y="161" text-anchor="middle" font-size="19" fill="#173f35">a = 6; b = 8</text><rect x="45.0" y="235" width="270" height="60" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><path d="M60.0,235v60 M300.0,235v60" stroke="#28765a" stroke-width="2.5"/><text x="180" y="271" text-anchor="middle" font-size="19" fill="#173f35">add_numbers(a, b)</text><rect x="395.0" y="125" width="290" height="60" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="540" y="161" text-anchor="middle" font-size="19" fill="#173f35">first = 6; second = 8</text><rect x="395.0" y="235" width="290" height="60" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="540" y="271" text-anchor="middle" font-size="19" fill="#173f35">total = first + second</text><rect x="395.0" y="345" width="290" height="60" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="540" y="381" text-anchor="middle" font-size="19" fill="#173f35">return total</text><rect x="45.0" y="345" width="270" height="60" rx="0" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="180" y="381" text-anchor="middle" font-size="19" fill="#173f35">answer = 14</text><polygon points="65.0,440 315.0,440 295.0,500 45.0,500" fill="#edf6f0" stroke="#28765a" stroke-width="2.5"/><text x="180" y="476" text-anchor="middle" font-size="19" fill="#173f35">print(answer)</text><polyline points="180,185 180,233" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="315,265 350,265 350,155 393,155" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="356" y="128" text-anchor="middle" font-size="16" fill="#173f35">Arguments</text><polyline points="540,185 540,233" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="540,295 540,343" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="395,375 317,375" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/><text x="356" y="355" text-anchor="middle" font-size="16" fill="#173f35">Result</text><polyline points="180,405 180,438" fill="none" stroke="#28765a" stroke-width="2.3" marker-end="url(#arrow)"/></g></svg>
