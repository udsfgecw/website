<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-label="Benzaldehyde: Electronic Transitions">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#243e57"/>
  </marker>
  <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1d7068"/>
  </marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#6b3ba6"/>
  </marker>
  <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1a5fb4"/>
  </marker>
  <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#28765a"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="16" fill="#ffffff" stroke="#d0e0ed" stroke-width="1.5"/>
<g font-family="DejaVu Sans, Arial, Helvetica, sans-serif">

  <rect x="25" y="18" width="710" height="48" rx="8" fill="#edf5ff"/>
  <text x="45" y="48" font-size="19" font-weight="bold" fill="#172b42">Benzaldehyde: Electronic Transitions</text>
  <text x="360" y="48" font-size="16" fill="#5e7185">C₆H₅CHO</text>
  <rect x="580" y="27" width="145" height="30" rx="15" fill="#e8f5ed"/>
  <text x="652" y="47" text-anchor="middle" font-size="11" font-weight="bold" fill="#28765a">UV-VISIBLE ACTIVE</text>

  <g transform="translate(45, 100)">
    <rect width="180" height="200" rx="12" fill="#fafbfc" stroke="#d0e0ed" stroke-width="1.5"/>
    <text x="90" y="32" text-anchor="middle" font-size="14" font-weight="bold" fill="#5e7185">Structure</text>
    
    <g transform="translate(0, 35)">
      
    <polygon points="94.2,56.0 94.2,84.0 70.0,98.0 45.8,84.0 45.8,56.0 70.0,42.0" fill="none" stroke="#243e57" stroke-width="2.5"/>
    <circle cx="70" cy="70" r="15.4" fill="none" stroke="#243e57" stroke-width="1.8"/>

      <line x1="98" y1="70" x2="115" y2="70" stroke="#243e57" stroke-width="2"/>
      <text x="118" y="75" font-size="13" font-weight="bold" fill="#172b42">CHO</text>
      <text x="90" y="135" text-anchor="middle" font-size="11" fill="#5e7185">Aromatic aldehyde</text>
    </g>
    
  </g>

  <g transform="translate(260, 0)">
    <g stroke="#9bb5c9" stroke-width="2">
      <line x1="20" y1="105" x2="350" y2="105"/>
      <line x1="20" y1="160" x2="350" y2="160"/>
      <line x1="20" y1="210" x2="350" y2="210"/>
      <line x1="20" y1="260" x2="350" y2="260"/>
      <line x1="20" y1="310" x2="350" y2="310"/>
    </g>

    <text x="365" y="110" font-size="15" font-weight="bold" fill="#172b42">σ*</text>
    <text x="365" y="165" font-size="15" font-weight="bold" fill="#172b42">π*</text>
    <text x="365" y="215" font-size="15" font-weight="bold" fill="#172b42">n</text>
    <text x="365" y="265" font-size="15" font-weight="bold" fill="#172b42">π</text>
    <text x="365" y="315" font-size="15" font-weight="bold" fill="#172b42">σ</text>

    
      <line x1="315.0" y1="305" x2="315.0" y2="115" stroke="#1d7068" stroke-width="3" marker-end="url(#arr-teal)"/>
      <text x="315.0" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d7068">σ→σ*</text>

      <line x1="385.0" y1="255" x2="385.0" y2="170" stroke="#1a5fb4" stroke-width="3" marker-end="url(#arr-blue)"/>
      <text x="385.0" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5fb4">π→π*</text>

      <line x1="455.0" y1="205" x2="455.0" y2="170" stroke="#6b3ba6" stroke-width="3" marker-end="url(#arr-purple)"/>
      <text x="455.0" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b3ba6">n→π*</text>

      <line x1="525.0" y1="205" x2="525.0" y2="115" stroke="#1d7068" stroke-width="3" marker-end="url(#arr-teal)"/>
      <text x="525.0" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d7068">n→σ*</text>

  </g>

  <rect x="45" y="335" width="670" height="36" rx="8" fill="#f8fafc" stroke="#d0e0ed" stroke-width="1"/>
  <text x="380" y="358" text-anchor="middle" font-size="13" fill="#172b42">Key note: Carbonyl group conjugated with phenyl ring; exhibits both π → π* and forbidden n → π* bands.</text>

</g>
</svg>
