<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" aria-label="Principle of UV-Visible Spectroscopy">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#243e57"/>
  </marker>
  <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1d7068"/>
  </marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#6b3ba6"/>
  </marker>
  <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1a5fb4"/>
  </marker>
  <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#28765a"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="16" fill="#ffffff" stroke="#d0e0ed" stroke-width="1.5"/>
<g font-family="DejaVu Sans, Arial, Helvetica, sans-serif">

  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#172b42">Principle of UV-Visible Spectroscopy</text>
  <text x="400" y="65" text-anchor="middle" font-size="14" fill="#5e7185">Absorption of UV-visible radiation induces transitions between electronic energy levels</text>
  
  <g transform="translate(60, 95)">
    <rect width="310" height="250" rx="12" fill="#fafbfc" stroke="#d0e0ed" stroke-width="1.5"/>
    <text x="155" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#172b42">1. Electronic Transition</text>
    
    <line x1="40" y1="90" x2="270" y2="90" stroke="#243e57" stroke-width="2.5"/>
    <line x1="40" y1="180" x2="270" y2="180" stroke="#243e57" stroke-width="2.5"/>
    
    <text x="278" y="95" font-size="15" font-weight="bold" fill="#243e57">E_e <tspan font-size="12" font-weight="normal" fill="#5e7185">(excited)</tspan></text>
    <text x="278" y="185" font-size="15" font-weight="bold" fill="#243e57">E_g <tspan font-size="12" font-weight="normal" fill="#5e7185">(ground)</tspan></text>
    
    <line x1="155" y1="175" x2="155" y2="98" stroke="#1d7068" stroke-width="3" marker-end="url(#arr-teal)"/>
    
    <path d="M 60 140 Q 80 120 100 140 T 140 140" fill="none" stroke="#6b3ba6" stroke-width="2.5"/>
    <polygon points="140,140 132,135 132,145" fill="#6b3ba6"/>
    <text x="100" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b3ba6">hν</text>
    <text x="155" y="225" text-anchor="middle" font-size="12" fill="#5e7185">ΔE = E_e − E_g = hν</text>
  </g>
  
  <g transform="translate(430, 95)">
    <rect width="310" height="250" rx="12" fill="#fafbfc" stroke="#d0e0ed" stroke-width="1.5"/>
    <text x="155" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#172b42">2. Resulting Spectrum</text>
    
    <line x1="40" y1="190" x2="270" y2="190" stroke="#243e57" stroke-width="2"/>
    <line x1="40" y1="190" x2="40" y2="70" stroke="#243e57" stroke-width="2"/>
    
    <path d="M 50 185 Q 120 180 140 130 T 170 100 T 200 140 T 260 185" fill="none" stroke="#1a5fb4" stroke-width="2.5"/>
    <line x1="170" y1="100" x2="170" y2="190" stroke="#5e7185" stroke-dasharray="3,3"/>
    <circle cx="170" cy="100" r="4" fill="#1a5fb4"/>
    <text x="170" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5fb4">λ_max</text>
    
    <text x="155" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#243e57">Wavelength λ (nm)</text>
    <text x="30" y="125" text-anchor="middle" font-size="11" fill="#243e57" transform="rotate(-90 30 125)">Absorbance</text>
    <text x="155" y="235" text-anchor="middle" font-size="11" fill="#5e7185">Broad band with characteristic peak</text>
  </g>

</g>
</svg>
