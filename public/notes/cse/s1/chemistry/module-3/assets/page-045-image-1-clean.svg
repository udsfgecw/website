<svg xmlns="http://www.w3.org/2000/svg" width="920" height="680" viewBox="0 0 920 680" role="img" aria-label="Classification of Molecular Vibrations">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#243e57"/>
  </marker>
  <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1d7068"/>
  </marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#6b3ba6"/>
  </marker>
  <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1a5fb4"/>
  </marker>
  <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#28765a"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="16" fill="#ffffff" stroke="#d0e0ed" stroke-width="1.5"/>
<g font-family="DejaVu Sans, Arial, Helvetica, sans-serif">

  <text x="460" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#172b42">Classification of Molecular Vibrations in IR Spectroscopy</text>
  <text x="460" y="62" text-anchor="middle" font-size="13" fill="#5e7185">Absorption of infrared radiation changes dipole moments via stretching and bending vibrations</text>
  
  <rect x="335" y="80" width="250" height="45" rx="8" fill="#243e57"/>
  <text x="460" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Molecular Vibrations</text>
  
  <path d="M 410 125 L 410 150 L 220 150 L 220 175" fill="none" stroke="#243e57" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M 510 125 L 510 150 L 680 150 L 680 175" fill="none" stroke="#243e57" stroke-width="2.5" marker-end="url(#arr)"/>
  
  <g transform="translate(60, 180)">
    <rect width="320" height="70" rx="10" fill="#edf5ff" stroke="#1a5fb4" stroke-width="2"/>
    <text x="160" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a5fb4">1. Stretching Vibrations</text>
    <text x="160" y="48" text-anchor="middle" font-size="12" fill="#172b42">Bond length changes · Bond angle unchanged</text>
    <text x="160" y="62" text-anchor="middle" font-size="11" fill="#5e7185">Higher energy (higher wavenumber)</text>
    
    <path d="M 90 70 L 90 100" fill="none" stroke="#243e57" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 230 70 L 230 100" fill="none" stroke="#243e57" stroke-width="2" marker-end="url(#arr)"/>
    
    <g transform="translate(10, 105)">
      <rect width="140" height="150" rx="8" fill="#fafbfc" stroke="#d0e0ed" stroke-width="1.5"/>
      <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#172b42">Symmetric</text>
      <text x="70" y="40" text-anchor="middle" font-size="10" fill="#5e7185">Bonds extend together</text>
      
        <circle cx="70" cy="75" r="12" fill="#243e57"/>
        <text x="70" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">C</text>
        <circle cx="40" cy="103" r="8" fill="#1d7068"/>
        <text x="40" y="106" text-anchor="middle" font-size="9" fill="#ffffff">H</text>
        <circle cx="100" cy="103" r="8" fill="#1d7068"/>
        <text x="100" y="106" text-anchor="middle" font-size="9" fill="#ffffff">H</text>
        <line x1="61" y1="84" x2="47" y2="97" stroke="#243e57" stroke-width="2.5"/>
        <line x1="79" y1="84" x2="93" y2="97" stroke="#243e57" stroke-width="2.5"/>

        <line x1="34" y1="109" x2="22" y2="120" stroke="#1a5fb4" stroke-width="2" marker-end="url(#arr-blue)"/>
        <line x1="106" y1="109" x2="118" y2="120" stroke="#1a5fb4" stroke-width="2" marker-end="url(#arr-blue)"/>

    </g>
    
    <g transform="translate(170, 105)">
      <rect width="140" height="150" rx="8" fill="#fafbfc" stroke="#d0e0ed" stroke-width="1.5"/>
      <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#172b42">Asymmetric</text>
      <text x="70" y="40" text-anchor="middle" font-size="10" fill="#5e7185">One extends, one compresses</text>
      
        <circle cx="70" cy="75" r="12" fill="#243e57"/>
        <text x="70" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">C</text>
        <circle cx="40" cy="103" r="8" fill="#1d7068"/>
        <text x="40" y="106" text-anchor="middle" font-size="9" fill="#ffffff">H</text>
        <circle cx="100" cy="103" r="8" fill="#1d7068"/>
        <text x="100" y="106" text-anchor="middle" font-size="9" fill="#ffffff">H</text>
        <line x1="61" y1="84" x2="47" y2="97" stroke="#243e57" stroke-width="2.5"/>
        <line x1="79" y1="84" x2="93" y2="97" stroke="#243e57" stroke-width="2.5"/>

        <line x1="34" y1="109" x2="22" y2="120" stroke="#1a5fb4" stroke-width="2" marker-end="url(#arr-blue)"/>
        <line x1="114" y1="115" x2="104" y2="105" stroke="#1a5fb4" stroke-width="2" marker-end="url(#arr-blue)"/>

    </g>
  </g>
  
  <g transform="translate(420, 180)">
    <rect width="460" height="70" rx="10" fill="#e8f5ed" stroke="#28765a" stroke-width="2"/>
    <text x="230" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#28765a">2. Bending Vibrations (Deformation)</text>
    <text x="230" y="48" text-anchor="middle" font-size="12" fill="#172b42">Bond length unchanged · Bond angle changes</text>
    <text x="230" y="62" text-anchor="middle" font-size="11" fill="#5e7185">Lower energy (lower wavenumber)</text>
    
    <path d="M 120 70 L 120 95" fill="none" stroke="#243e57" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 340 70 L 340 95" fill="none" stroke="#243e57" stroke-width="2" marker-end="url(#arr)"/>
    
    <g transform="translate(10, 100)">
      <rect width="210" height="30" rx="6" fill="#e2ece9"/>
      <text x="105" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#243e57">In-Plane Bending</text>
      
      <path d="M 55 30 L 55 50" fill="none" stroke="#243e57" stroke-width="1.5" marker-end="url(#arr)"/>
      <path d="M 155 30 L 155 50" fill="none" stroke="#243e57" stroke-width="1.5" marker-end="url(#arr)"/>
      
      <g transform="translate(0, 55)">
        <rect width="100" height="150" rx="8" fill="#fafbfc" stroke="#d0e0ed" stroke-width="1.5"/>
        <text x="50" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#172b42">Scissoring</text>
        <text x="50" y="36" text-anchor="middle" font-size="9" fill="#5e7185">Move together</text>
        
        <circle cx="50" cy="72" r="12" fill="#243e57"/>
        <text x="50" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">C</text>
        <circle cx="20" cy="100" r="8" fill="#1d7068"/>
        <text x="20" y="103" text-anchor="middle" font-size="9" fill="#ffffff">H</text>
        <circle cx="80" cy="100" r="8" fill="#1d7068"/>
        <text x="80" y="103" text-anchor="middle" font-size="9" fill="#ffffff">H</text>
        <line x1="41" y1="81" x2="27" y2="94" stroke="#243e57" stroke-width="2.5"/>
        <line x1="59" y1="81" x2="73" y2="94" stroke="#243e57" stroke-width="2.5"/>

        <path d="M 10 100 Q 15 87 35 92" fill="none" stroke="#28765a" stroke-width="2" marker-end="url(#arr-green)"/>
        <path d="M 90 100 Q 85 87 65 92" fill="none" stroke="#28765a" stroke-width="2" marker-end="url(#arr-green)"/>

      </g>
      
      <g transform="translate(110, 55)">
        <rect width="100" height="150" rx="8" fill="#fafbfc" stroke="#d0e0ed" stroke-width="1.5"/>
        <text x="50" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#172b42">Rocking</text>
        <text x="50" y="36" text-anchor="middle" font-size="9" fill="#5e7185">Swing same side</text>
        
        <circle cx="50" cy="72" r="12" fill="#243e57"/>
        <text x="50" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">C</text>
        <circle cx="20" cy="100" r="8" fill="#1d7068"/>
        <text x="20" y="103" text-anchor="middle" font-size="9" fill="#ffffff">H</text>
        <circle cx="80" cy="100" r="8" fill="#1d7068"/>
        <text x="80" y="103" text-anchor="middle" font-size="9" fill="#ffffff">H</text>
        <line x1="41" y1="81" x2="27" y2="94" stroke="#243e57" stroke-width="2.5"/>
        <line x1="59" y1="81" x2="73" y2="94" stroke="#243e57" stroke-width="2.5"/>

        <path d="M 10 97 Q 25 87 35 97" fill="none" stroke="#28765a" stroke-width="2" marker-end="url(#arr-green)"/>
        <path d="M 70 97 Q 85 87 95 97" fill="none" stroke="#28765a" stroke-width="2" marker-end="url(#arr-green)"/>

      </g>
    </g>
    
    <g transform="translate(240, 100)">
      <rect width="210" height="30" rx="6" fill="#e2ece9"/>
      <text x="105" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#243e57">Out-of-Plane Bending</text>
      
      <path d="M 55 30 L 55 50" fill="none" stroke="#243e57" stroke-width="1.5" marker-end="url(#arr)"/>
      <path d="M 155 30 L 155 50" fill="none" stroke="#243e57" stroke-width="1.5" marker-end="url(#arr)"/>
      
      <g transform="translate(0, 55)">
        <rect width="100" height="150" rx="8" fill="#fafbfc" stroke="#d0e0ed" stroke-width="1.5"/>
        <text x="50" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#172b42">Wagging</text>
        <text x="50" y="36" text-anchor="middle" font-size="9" fill="#5e7185">Up &amp; down together</text>
        
        <circle cx="50" cy="72" r="12" fill="#243e57"/>
        <text x="50" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">C</text>
        <circle cx="20" cy="100" r="8" fill="#1d7068"/>
        <text x="20" y="103" text-anchor="middle" font-size="9" fill="#ffffff">H</text>
        <circle cx="80" cy="100" r="8" fill="#1d7068"/>
        <text x="80" y="103" text-anchor="middle" font-size="9" fill="#ffffff">H</text>
        <line x1="41" y1="81" x2="27" y2="94" stroke="#243e57" stroke-width="2.5"/>
        <line x1="59" y1="81" x2="73" y2="94" stroke="#243e57" stroke-width="2.5"/>

        <circle cx="20" cy="117" r="6" fill="#f0fdf4" stroke="#1d7068" stroke-width="1.5"/>
        <text x="20" y="120" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d7068">+</text>
        <circle cx="80" cy="117" r="6" fill="#f0fdf4" stroke="#1d7068" stroke-width="1.5"/>
        <text x="80" y="120" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d7068">+</text>
        <text x="50" y="127" text-anchor="middle" font-size="9" fill="#5e7185">both up (+)</text>

      </g>
      
      <g transform="translate(110, 55)">
        <rect width="100" height="150" rx="8" fill="#fafbfc" stroke="#d0e0ed" stroke-width="1.5"/>
        <text x="50" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#172b42">Twisting</text>
        <text x="50" y="36" text-anchor="middle" font-size="9" fill="#5e7185">Opposite sides</text>
        
        <circle cx="50" cy="72" r="12" fill="#243e57"/>
        <text x="50" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">C</text>
        <circle cx="20" cy="100" r="8" fill="#1d7068"/>
        <text x="20" y="103" text-anchor="middle" font-size="9" fill="#ffffff">H</text>
        <circle cx="80" cy="100" r="8" fill="#1d7068"/>
        <text x="80" y="103" text-anchor="middle" font-size="9" fill="#ffffff">H</text>
        <line x1="41" y1="81" x2="27" y2="94" stroke="#243e57" stroke-width="2.5"/>
        <line x1="59" y1="81" x2="73" y2="94" stroke="#243e57" stroke-width="2.5"/>

        <circle cx="20" cy="117" r="6" fill="#f0fdf4" stroke="#1d7068" stroke-width="1.5"/>
        <text x="20" y="120" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d7068">+</text>
        <circle cx="80" cy="117" r="6" fill="#fef2f2" stroke="#b02a37" stroke-width="1.5"/>
        <text x="80" y="120" text-anchor="middle" font-size="10" font-weight="bold" fill="#b02a37">−</text>
        <text x="50" y="127" text-anchor="middle" font-size="9" fill="#5e7185">one up / one down</text>

      </g>
    </g>
  </g>
  
  <rect x="60" y="615" width="820" height="42" rx="8" fill="#f8fafc" stroke="#d0e0ed" stroke-width="1"/>
  <text x="470" y="641" text-anchor="middle" font-size="13" fill="#172b42">Hooke's Law for stretching frequency: ν̄ = (1 / 2πc) · √(K / μ)  where K = force constant, μ = reduced mass (m₁m₂ / (m₁+m₂))</text>

</g>
</svg>
