<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-label="Molecular Energy Levels">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#243e57"/>
  </marker>
  <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1d7068"/>
  </marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#6b3ba6"/>
  </marker>
  <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1a5fb4"/>
  </marker>
  <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#28765a"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="16" fill="#ffffff" stroke="#d0e0ed" stroke-width="1.5"/>
<g font-family="DejaVu Sans, Arial, Helvetica, sans-serif">

  <text x="410" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#172b42">Different Energy Levels in a Molecule</text>
  <text x="410" y="60" text-anchor="middle" font-size="14" fill="#5e7185">Born-Oppenheimer approximation: E_total = E_electronic + E_vibrational + E_rotational</text>
  
  <line x1="80" y1="440" x2="80" y2="85" stroke="#243e57" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="55" y="260" text-anchor="middle" font-size="15" font-weight="bold" fill="#243e57" transform="rotate(-90 55 260)">Energy (E)</text>
  
  <g transform="translate(130, 0)">
    <g stroke="#d0e0ed" stroke-width="1" fill="#f8fafc">
      <rect x="0" y="95" width="560" height="110" rx="6"/>
      <rect x="0" y="295" width="560" height="110" rx="6"/>
    </g>
    
    <text x="15" y="115" font-size="14" font-weight="bold" fill="#243e57">Electronic Excited Level (E₂)</text>
    <text x="15" y="315" font-size="14" font-weight="bold" fill="#243e57">Electronic Ground Level (E₁)</text>
    
    <g stroke="#243e57" stroke-width="1.8">
      <line x1="20" y1="130" x2="480" y2="130"/>
      <line x1="20" y1="165" x2="480" y2="165"/>
      <line x1="20" y1="195" x2="480" y2="195"/>
      
      <line x1="20" y1="330" x2="480" y2="330"/>
      <line x1="20" y1="365" x2="480" y2="365"/>
      <line x1="20" y1="395" x2="480" y2="395"/>
    </g>
    
    <text x="495" y="134" font-size="13" font-weight="bold" fill="#1d7068">v = 2</text>
    <text x="495" y="169" font-size="13" font-weight="bold" fill="#1d7068">v = 1</text>
    <text x="495" y="199" font-size="13" font-weight="bold" fill="#1d7068">v = 0</text>
    
    <text x="495" y="334" font-size="13" font-weight="bold" fill="#1d7068">v = 2</text>
    <text x="495" y="369" font-size="13" font-weight="bold" fill="#1d7068">v = 1</text>
    <text x="495" y="399" font-size="13" font-weight="bold" fill="#1d7068">v = 0</text>
    
    <g stroke="#5e7185" stroke-width="0.8">
      <line x1="60" y1="137" x2="220" y2="137"/>
      <line x1="60" y1="144" x2="220" y2="144"/>
      <line x1="60" y1="151" x2="220" y2="151"/>
      
      <line x1="60" y1="172" x2="220" y2="172"/>
      <line x1="60" y1="179" x2="220" y2="179"/>
      <line x1="60" y1="186" x2="220" y2="186"/>
      
      <line x1="60" y1="337" x2="220" y2="337"/>
      <line x1="60" y1="344" x2="220" y2="344"/>
      <line x1="60" y1="351" x2="220" y2="351"/>
      
      <line x1="60" y1="372" x2="220" y2="372"/>
      <line x1="60" y1="379" x2="220" y2="379"/>
      <line x1="60" y1="386" x2="220" y2="386"/>
    </g>
    <text x="140" y="275" text-anchor="middle" font-size="11" fill="#5e7185">Rotational sublevels (J)</text>
    
    <line x1="280" y1="395" x2="280" y2="197" stroke="#6b3ba6" stroke-width="2.5" marker-end="url(#arr-purple)"/>
    <text x="280" y="245" text-anchor="end" font-size="12" font-weight="bold" fill="#6b3ba6">Electronic transition (UV-Vis) </text>
    
    <line x1="380" y1="395" x2="380" y2="367" stroke="#1d7068" stroke-width="2.5" marker-end="url(#arr-teal)"/>
    <text x="390" y="383" font-size="12" font-weight="bold" fill="#1d7068">Vibrational (IR)</text>
  </g>
  
  <rect x="50" y="430" width="720" height="48" rx="8" fill="#edf5ff" stroke="#d0e0ed" stroke-width="1"/>
  <text x="410" y="452" text-anchor="middle" font-size="14" font-weight="bold" fill="#243e57">ΔE_electronic (1–10 eV) &gt;&gt; ΔE_vibrational (0.1 eV) &gt;&gt; ΔE_rotational (0.001 eV)</text>
  <text x="410" y="468" text-anchor="middle" font-size="12" fill="#5e7185">UV-Visible: Electronic transitions · Infrared (IR): Vibrational transitions · Microwave: Rotational transitions</text>

</g>
</svg>
