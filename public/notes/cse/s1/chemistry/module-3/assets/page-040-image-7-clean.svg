<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-label="Compounds and Allowed Transitions">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#243e57"/>
  </marker>
  <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1d7068"/>
  </marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#6b3ba6"/>
  </marker>
  <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1a5fb4"/>
  </marker>
  <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#28765a"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="16" fill="#ffffff" stroke="#d0e0ed" stroke-width="1.5"/>
<g font-family="DejaVu Sans, Arial, Helvetica, sans-serif">

  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#172b42">Allowed Electronic Transitions by Functional Group</text>
  <text x="400" y="60" text-anchor="middle" font-size="13" fill="#5e7185">Summary of representative organic molecules and their observed transitions</text>
  
  <rect x="40" y="70" width="720" height="265" rx="8" fill="#ffffff" stroke="#d0e0ed" stroke-width="1.5"/>
  <rect x="40" y="70" width="720" height="30" rx="8" fill="#edf5ff"/>
  
  <text x="60" y="90" font-size="13" font-weight="bold" fill="#243e57">Compound</text>
  <text x="230" y="90" font-size="13" font-weight="bold" fill="#243e57">Main Functional Group</text>
  <text x="460" y="90" font-size="13" font-weight="bold" fill="#243e57">Allowed Transitions</text>
  
  
    <rect x="40" y="95" width="720" height="32" fill="#f8fafc"/>
    <text x="60" y="115" font-size="13" font-weight="bold" fill="#172b42">Acetone</text>
    <text x="230" y="115" font-size="13" fill="#243e57">C=O (carbonyl)</text>
    <text x="460" y="115" font-size="13" font-weight="bold" fill="#1d7068">n → π*,  π → π*,  σ → σ*</text>

    <rect x="40" y="127" width="720" height="32" fill="#ffffff"/>
    <text x="60" y="147" font-size="13" font-weight="bold" fill="#172b42">Aniline</text>
    <text x="230" y="147" font-size="13" fill="#243e57">-NH₂ (aromatic ring)</text>
    <text x="460" y="147" font-size="13" font-weight="bold" fill="#1d7068">π → π*,  n → π*,  σ → σ*</text>

    <rect x="40" y="159" width="720" height="32" fill="#f8fafc"/>
    <text x="60" y="179" font-size="13" font-weight="bold" fill="#172b42">Phenol</text>
    <text x="230" y="179" font-size="13" fill="#243e57">-OH (aromatic ring)</text>
    <text x="460" y="179" font-size="13" font-weight="bold" fill="#1d7068">π → π*,  n → π*,  σ → σ*</text>

    <rect x="40" y="191" width="720" height="32" fill="#ffffff"/>
    <text x="60" y="211" font-size="13" font-weight="bold" fill="#172b42">1-Butyne</text>
    <text x="230" y="211" font-size="13" fill="#243e57">C≡C (alkyne)</text>
    <text x="460" y="211" font-size="13" font-weight="bold" fill="#1d7068">π → π*,  σ → σ*</text>

    <rect x="40" y="223" width="720" height="32" fill="#f8fafc"/>
    <text x="60" y="243" font-size="13" font-weight="bold" fill="#172b42">Pentane</text>
    <text x="230" y="243" font-size="13" fill="#243e57">C-C (alkane)</text>
    <text x="460" y="243" font-size="13" font-weight="bold" fill="#1d7068">σ → σ*</text>

    <rect x="40" y="255" width="720" height="32" fill="#ffffff"/>
    <text x="60" y="275" font-size="13" font-weight="bold" fill="#172b42">Ethanol</text>
    <text x="230" y="275" font-size="13" fill="#243e57">-OH (alcohol)</text>
    <text x="460" y="275" font-size="13" font-weight="bold" fill="#1d7068">n → σ*,  σ → σ*</text>

    <rect x="40" y="287" width="720" height="32" fill="#f8fafc"/>
    <text x="60" y="307" font-size="13" font-weight="bold" fill="#172b42">Methoxymethane</text>
    <text x="230" y="307" font-size="13" fill="#243e57">C-O-C (ether)</text>
    <text x="460" y="307" font-size="13" font-weight="bold" fill="#1d7068">n → σ*,  σ → σ*</text>


</g>
</svg>
