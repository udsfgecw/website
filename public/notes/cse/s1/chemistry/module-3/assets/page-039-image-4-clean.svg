    <circle cx="72.0" cy="60" r="13.2" fill="none" stroke="#243e57" stroke-width="1.8"/>

    <polygon points="128.8,48.0 128.8,72.0 108.0,84.0 87.2,72.0 87.2,48.0 108.0,36.0" fill="none" stroke="#243e57" stroke-width="2.5"/>
    <circle cx="108.0" cy="60" r="13.2" fill="none" stroke="#243e57" stroke-width="1.8"/>

    </g>
    <text x="90" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#172b42">Naphthalene</text>
    <text x="90" y="135" text-anchor="middle" font-size="12" fill="#5e7185">2 fused rings (5 C=C)</text>
    <text x="90" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d7068">λ_max = 312 nm</text>
  </g>
  
  <text x="635" y="190" text-anchor="middle" font-size="28" font-weight="bold" fill="#243e57">&lt;</text>
  
  <g transform="translate(650, 90)">
    <rect width="180" height="170" rx="10" fill="#fafbfc" stroke="#d0e0ed" stroke-width="1.5"/>
    <g transform="translate(0, 5)">
      
    <polygon points="77.3,50.0 77.3,70.0 60.0,80.0 42.7,70.0 42.7,50.0 60.0,40.0" fill="none" stroke="#243e57" stroke-width="2.5"/>
    <circle cx="60.0" cy="60" r="11.0" fill="none" stroke="#243e57" stroke-width="1.8"/>

    <polygon points="107.3,50.0 107.3,70.0 90.0,80.0 72.7,70.0 72.7,50.0 90.0,40.0" fill="none" stroke="#243e57" stroke-width="2.5"/>
    <circle cx="90" cy="60" r="11.0" fill="none" stroke="#243e57" stroke-width="1.8"/>

    <polygon points="137.3,50.0 137.3,70.0 120.0,80.0 102.7,70.0 102.7,50.0 120.0,40.0" fill="none" stroke="#243e57" stroke-width="2.5"/>
    <circle cx="120.0" cy="60" r="11.0" fill="none" stroke="#243e57" stroke-width="1.8"/>

    </g>
    <text x="90" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#172b42">Anthracene</text>
    <text x="90" y="135" text-anchor="middle" font-size="12" fill="#5e7185">3 fused rings (7 C=C)</text>
    <text x="90" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d7068">λ_max = 375 nm</text>
  </g>
  
  <rect x="30" y="280" width="800" height="55" rx="8" fill="#edf5ff" stroke="#d0e0ed" stroke-width="1"/>
  <line x1="60" y1="300" x2="800" y2="300" stroke="#1d7068" stroke-width="2" marker-end="url(#arr-teal)"/>
  <text x="430" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#243e57">Increasing Conjugation → Decreasing HOMO–LUMO Gap (ΔE) → Longer Wavelength λ_max (Red / Bathochromic Shift)</text>

