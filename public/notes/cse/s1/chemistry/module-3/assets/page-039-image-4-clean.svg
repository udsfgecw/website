    <circle cx="90" cy="60" r="16.5" fill="none" stroke="#243e57" stroke-width="1.8"/>

    </g>
    <text x="90" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#172b42">1,3-Cyclohexadiene</text>
    <text x="90" y="135" text-anchor="middle" font-size="12" fill="#5e7185">2 conjugated C=C</text>
    <text x="90" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d7068">λ_max = 256 nm</text>
  </g>
  
  <text x="225" y="190" text-anchor="middle" font-size="28" font-weight="bold" fill="#243e57">&lt;</text>
  
