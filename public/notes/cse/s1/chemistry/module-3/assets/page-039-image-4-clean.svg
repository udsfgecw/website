    <circle cx="85" cy="60" r="16.5" fill="none" stroke="#243e57" stroke-width="1.8"/>

    </g>
    <text x="85" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#172b42">Benzene</text>
    <text x="85" y="135" text-anchor="middle" font-size="12" fill="#5e7185">Aromatic ring</text>
    <text x="85" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d7068">λ_max = 255 nm</text>
  </g>
  
  <text x="425" y="190" text-anchor="middle" font-size="28" font-weight="bold" fill="#243e57">&lt;</text>
  
  <g transform="translate(440, 90)">
    <rect width="180" height="170" rx="10" fill="#fafbfc" stroke="#d0e0ed" stroke-width="1.5"/>
