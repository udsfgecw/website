  <text x="430" y="65" text-anchor="middle" font-size="14" fill="#5e7185">Extended conjugation decreases the HOMO–LUMO energy gap (ΔE), shifting absorption to longer wavelengths</text>
  
  <g transform="translate(30, 90)">
    <rect width="180" height="170" rx="10" fill="#fafbfc" stroke="#d0e0ed" stroke-width="1.5"/>
