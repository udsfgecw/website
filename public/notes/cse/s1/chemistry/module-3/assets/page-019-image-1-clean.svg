<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" aria-label="Intermolecular Hydrogen Bonding">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#243e57"/>
  </marker>
  <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1d7068"/>
  </marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#6b3ba6"/>
  </marker>
  <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1a5fb4"/>
  </marker>
  <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#28765a"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="16" fill="#ffffff" stroke="#d0e0ed" stroke-width="1.5"/>
<g font-family="DejaVu Sans, Arial, Helvetica, sans-serif">

  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#172b42">Intermolecular Hydrogen Bonding in p-Hydroxyphenol</text>
  <text x="400" y="65" text-anchor="middle" font-size="14" fill="#5e7185">Hydrogen bonds form between separate hydroquinone molecules (quinol)</text>
  
  <g transform="translate(60, 110)">
    
    <polygon points="150.3,72.5 150.3,107.5 120.0,125.0 89.7,107.5 89.7,72.5 120.0,55.0" fill="none" stroke="#243e57" stroke-width="2.5"/>
    <circle cx="120" cy="90" r="19.2" fill="none" stroke="#243e57" stroke-width="1.8"/>

    <line x1="120" y1="55" x2="120" y2="35" stroke="#243e57" stroke-width="2.5"/>
    <text x="120" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#172b42">HO</text>
    
    <line x1="120" y1="125" x2="120" y2="145" stroke="#243e57" stroke-width="2.5"/>
    <text x="120" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#172b42">O — H</text>
    
    <line x1="150" y1="160" x2="220" y2="160" stroke="#1d7068" stroke-dasharray="5,5" stroke-width="3"/>
    <text x="185" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d7068">H-bond</text>
    
    <text x="245" y="165" font-size="16" font-weight="bold" fill="#172b42">O</text>
    <line x1="250" y1="170" x2="250" y2="190" stroke="#243e57" stroke-width="2"/>
    <text x="250" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#172b42">H</text>
    
    <line x1="265" y1="160" x2="310" y2="160" stroke="#243e57" stroke-width="2.5"/>
    
    <polygon points="380.3,142.5 380.3,177.5 350.0,195.0 319.7,177.5 319.7,142.5 350.0,125.0" fill="none" stroke="#243e57" stroke-width="2.5"/>
    <circle cx="350" cy="160" r="19.2" fill="none" stroke="#243e57" stroke-width="1.8"/>

    
    <line x1="385" y1="160" x2="425" y2="160" stroke="#243e57" stroke-width="2.5"/>
    <text x="445" y="165" font-size="16" font-weight="bold" fill="#172b42">O — H</text>
    
    <line x1="495" y1="160" x2="540" y2="160" stroke="#1d7068" stroke-dasharray="5,5" stroke-width="3"/>
    <text x="518" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d7068">H-bond</text>
    <text x="560" y="165" font-size="16" fill="#5e7185">···</text>
  </g>
  
  <rect x="50" y="315" width="700" height="52" rx="8" fill="#e8f5ed" stroke="#d0e0ed" stroke-width="1"/>
  <text x="400" y="337" text-anchor="middle" font-size="13" font-weight="bold" fill="#28765a">Effect of Dilution on IR Absorption</text>
  <text x="400" y="355" text-anchor="middle" font-size="12" fill="#172b42">Upon dilution, molecules move apart → intermolecular H-bonds break → O–H stretching frequency shifts to higher wavenumber.</text>

</g>
</svg>
