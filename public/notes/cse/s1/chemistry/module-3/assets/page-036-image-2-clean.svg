<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-label="Electronic transitions energy levels">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#243e57"/>
  </marker>
  <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1d7068"/>
  </marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#6b3ba6"/>
  </marker>
  <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1a5fb4"/>
  </marker>
  <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#28765a"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="16" fill="#ffffff" stroke="#d0e0ed" stroke-width="1.5"/>
<g font-family="DejaVu Sans, Arial, Helvetica, sans-serif">

  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#172b42">Different Types of Electronic Transitions</text>
  <text x="400" y="65" text-anchor="middle" font-size="14" fill="#5e7185">Transitions between bonding, non-bonding, and anti-bonding molecular orbitals</text>
  
  <line x1="70" y1="380" x2="70" y2="100" stroke="#243e57" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="50" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#243e57" transform="rotate(-90 50 240)">Energy (E)</text>
  
  <g stroke="#9bb5c9" stroke-width="2">
    <line x1="120" y1="110" x2="660" y2="110"/>
    <line x1="120" y1="180" x2="660" y2="180"/>
    <line x1="120" y1="240" x2="660" y2="240"/>
    <line x1="120" y1="300" x2="660" y2="300"/>
    <line x1="120" y1="360" x2="660" y2="360"/>
  </g>
  
  <text x="675" y="116" font-size="17" font-weight="bold" fill="#172b42">σ* <tspan font-size="14" font-weight="normal" fill="#5e7185">(antibonding)</tspan></text>
  <text x="675" y="186" font-size="17" font-weight="bold" fill="#172b42">π* <tspan font-size="14" font-weight="normal" fill="#5e7185">(antibonding)</tspan></text>
  <text x="675" y="246" font-size="17" font-weight="bold" fill="#172b42">n <tspan font-size="14" font-weight="normal" fill="#5e7185">(non-bonding)</tspan></text>
  <text x="675" y="306" font-size="17" font-weight="bold" fill="#172b42">π <tspan font-size="14" font-weight="normal" fill="#5e7185">(bonding)</tspan></text>
  <text x="675" y="366" font-size="17" font-weight="bold" fill="#172b42">σ <tspan font-size="14" font-weight="normal" fill="#5e7185">(bonding)</tspan></text>
  
  <g stroke-width="3">
    <line x1="200" y1="355" x2="200" y2="120" stroke="#1d7068" marker-end="url(#arr-teal)"/>
    <line x1="320" y1="235" x2="320" y2="120" stroke="#1d7068" marker-end="url(#arr-teal)"/>
    <line x1="440" y1="295" x2="440" y2="190" stroke="#1a5fb4" marker-end="url(#arr-blue)"/>
    <line x1="560" y1="235" x2="560" y2="190" stroke="#6b3ba6" marker-end="url(#arr-purple)"/>
  </g>
  
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="200" y="98" fill="#1d7068">σ → σ*</text>
    <text x="200" y="395" font-size="12" fill="#5e7185">&lt; 150 nm</text>
    <text x="200" y="412" font-size="11" font-weight="normal" fill="#b02a37">UV-inactive</text>
    
    <text x="320" y="98" fill="#1d7068">n → σ*</text>
    <text x="320" y="395" font-size="12" fill="#5e7185">&lt; 200 nm</text>
    <text x="320" y="412" font-size="11" font-weight="normal" fill="#b02a37">UV-inactive</text>
    
    <text x="440" y="168" fill="#1a5fb4">π → π*</text>
    <text x="440" y="395" font-size="12" fill="#5e7185">200–800 nm</text>
    <text x="440" y="412" font-size="11" font-weight="bold" fill="#28765a">UV-active (allowed)</text>
    
    <text x="560" y="168" fill="#6b3ba6">n → π*</text>
    <text x="560" y="395" font-size="12" fill="#5e7185">200–800 nm</text>
    <text x="560" y="412" font-size="11" font-weight="normal" fill="#6b3ba6">UV-active (forbidden)</text>
  </g>

</g>
</svg>
