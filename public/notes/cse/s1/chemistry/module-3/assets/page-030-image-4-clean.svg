<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320" role="img" aria-label="Molecular Spectra Diagram">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#243e57"/>
  </marker>
  <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1d7068"/>
  </marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#6b3ba6"/>
  </marker>
  <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1a5fb4"/>
  </marker>
  <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#28765a"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="16" fill="#ffffff" stroke="#d0e0ed" stroke-width="1.5"/>
<g font-family="DejaVu Sans, Arial, Helvetica, sans-serif">

  <text x="210" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#172b42">Molecular Spectra</text>
  <text x="210" y="50" text-anchor="middle" font-size="12" fill="#5e7185">Transitions with vibrational &amp; rotational sublevels</text>
  
  <g stroke="#243e57" stroke-width="2">
    <line x1="60" y1="90" x2="360" y2="90"/>
    <line x1="60" y1="210" x2="360" y2="210"/>
  </g>
  <text x="375" y="95" font-size="13" font-weight="bold" fill="#243e57">E₂</text>
  <text x="375" y="215" font-size="13" font-weight="bold" fill="#243e57">E₁</text>
  
  <g stroke="#5e7185" stroke-width="1">
    <line x1="80" y1="102" x2="340" y2="102"/>
    <line x1="80" y1="112" x2="340" y2="112"/>
    <line x1="80" y1="122" x2="340" y2="122"/>
    
    <line x1="80" y1="222" x2="340" y2="222"/>
    <line x1="80" y1="232" x2="340" y2="232"/>
    <line x1="80" y1="242" x2="340" y2="242"/>
  </g>
  
  <line x1="160" y1="205" x2="160" y2="95" stroke="#6b3ba6" stroke-width="2.5" marker-end="url(#arr-purple)"/>
  <line x1="180" y1="205" x2="180" y2="105" stroke="#6b3ba6" stroke-width="2" marker-end="url(#arr-purple)"/>
  <line x1="200" y1="205" x2="200" y2="115" stroke="#6b3ba6" stroke-width="1.8" marker-end="url(#arr-purple)"/>
  
  <rect x="40" y="255" width="340" height="52" rx="8" fill="#edf5ff" stroke="#d0e0ed" stroke-width="1"/>
  <text x="210" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#243e57">Broad Band Spectrum</text>
  <text x="210" y="293" text-anchor="middle" font-size="11" fill="#5e7185">Superimposed rotational/vibrational lines form bands.</text>

</g>
</svg>
