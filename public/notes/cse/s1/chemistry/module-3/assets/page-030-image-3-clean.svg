<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320" role="img" aria-label="Atomic Spectra Diagram">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#243e57"/>
  </marker>
  <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1d7068"/>
  </marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#6b3ba6"/>
  </marker>
  <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1a5fb4"/>
  </marker>
  <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#28765a"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="16" fill="#ffffff" stroke="#d0e0ed" stroke-width="1.5"/>
<g font-family="DejaVu Sans, Arial, Helvetica, sans-serif">

  <text x="210" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#172b42">Atomic Spectra</text>
  <text x="210" y="50" text-anchor="middle" font-size="12" fill="#5e7185">Electronic transitions between sharp atomic levels</text>
  
  <g stroke="#243e57" stroke-width="2">
    <line x1="60" y1="90" x2="360" y2="90"/>
    <line x1="60" y1="150" x2="360" y2="150"/>
    <line x1="60" y1="210" x2="360" y2="210"/>
  </g>
  <text x="375" y="95" font-size="13" font-weight="bold" fill="#243e57">E₃</text>
  <text x="375" y="155" font-size="13" font-weight="bold" fill="#243e57">E₂</text>
  <text x="375" y="215" font-size="13" font-weight="bold" fill="#243e57">E₁</text>
  
  <line x1="160" y1="205" x2="160" y2="95" stroke="#1d7068" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <line x1="260" y1="205" x2="260" y2="155" stroke="#1a5fb4" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  
  <rect x="40" y="245" width="340" height="55" rx="8" fill="#edf5ff" stroke="#d0e0ed" stroke-width="1"/>
  <text x="210" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#243e57">Sharp Line Spectrum</text>
  <text x="210" y="286" text-anchor="middle" font-size="11" fill="#5e7185">Discrete energy transitions produce distinct, isolated lines.</text>

</g>
</svg>
