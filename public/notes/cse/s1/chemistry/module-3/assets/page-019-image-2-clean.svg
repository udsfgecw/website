<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" aria-label="Intramolecular Hydrogen Bonding">
<defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#243e57"/>
  </marker>
  <marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1d7068"/>
  </marker>
  <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#6b3ba6"/>
  </marker>
  <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#1a5fb4"/>
  </marker>
  <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0 1 L7 4 L0 7 Z" fill="#28765a"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="16" fill="#ffffff" stroke="#d0e0ed" stroke-width="1.5"/>
<g font-family="DejaVu Sans, Arial, Helvetica, sans-serif">

  <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#172b42">Intramolecular Hydrogen Bonding in o-Hydroxyphenol</text>
  <text x="400" y="65" text-anchor="middle" font-size="14" fill="#5e7185">Hydrogen bonds form internally between adjacent hydroxyl groups (catechol)</text>
  
  <g transform="translate(180, 100)">
    <rect width="440" height="195" rx="12" fill="#fafbfc" stroke="#d0e0ed" stroke-width="1.5"/>
    
    
    <polygon points="186.4,74.0 186.4,116.0 150.0,137.0 113.6,116.0 113.6,74.0 150.0,53.0" fill="none" stroke="#243e57" stroke-width="2.5"/>
    <circle cx="150" cy="95" r="23.1" fill="none" stroke="#243e57" stroke-width="1.8"/>

    
    <line x1="187" y1="75" x2="230" y2="60" stroke="#243e57" stroke-width="2.5"/>
    <text x="245" y="66" font-size="18" font-weight="bold" fill="#172b42">O — H</text>
    
    <line x1="187" y1="115" x2="230" y2="130" stroke="#243e57" stroke-width="2.5"/>
    <text x="245" y="136" font-size="18" font-weight="bold" fill="#172b42">O — H</text>
    
    <path d="M 285 70 Q 300 95 270 120" fill="none" stroke="#1d7068" stroke-dasharray="5,5" stroke-width="3"/>
    
    <g transform="translate(320, 80)">
      <rect width="105" height="35" rx="6" fill="#edf5ff" stroke="#1d7068" stroke-width="1"/>
      <text x="52" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d7068">Internal Ring</text>
      <text x="52" y="30" text-anchor="middle" font-size="10" fill="#5e7185">(chelate ring)</text>
    </g>
  </g>
  
  <rect x="50" y="315" width="700" height="52" rx="8" fill="#e8f5ed" stroke="#d0e0ed" stroke-width="1"/>
  <text x="400" y="337" text-anchor="middle" font-size="13" font-weight="bold" fill="#28765a">Effect of Dilution on IR Absorption</text>
  <text x="400" y="355" text-anchor="middle" font-size="12" fill="#172b42">Intramolecular H-bonding is internal to the molecule and is NOT affected by dilution → O–H stretching frequency remains unchanged.</text>

</g>
</svg>
