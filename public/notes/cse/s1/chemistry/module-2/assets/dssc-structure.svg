<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

  <text x="430" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Dye-Sensitized Solar Cell (DSSC)</text>

  <g transform="translate(60, 60)">
    <circle cx="40" cy="40" r="22" fill="#fbbf24" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="40" y1="8" x2="40" y2="0" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="40" y1="72" x2="40" y2="80" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="8" y1="40" x2="0" y2="40" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="72" y1="40" x2="80" y2="40" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="17" y1="17" x2="11" y2="11" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="63" y1="63" x2="69" y2="69" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="17" y1="63" x2="11" y2="69" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="63" y1="17" x2="69" y2="11" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="40" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#78350f">Sunlight</text>

    <path d="M 75 55 L 145 95" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,3"/>
    <polygon points="145,95 133,90 140,83" fill="#f59e0b"/>
  </g>

  <rect x="230" y="100" width="30" height="260" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2" rx="3"/>
  <text x="245" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0369a1" transform="rotate(-90 245 400)">FTO Glass (Anode)</text>

  <g transform="translate(265, 105)">
    <pattern id="particles" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="11" cy="11" r="5" fill="#f43f5e"/>
    </pattern>
    <rect x="0" y="0" width="90" height="250" fill="url(#particles)" stroke="#cbd5e1" stroke-width="1"/>
  </g>
  <text x="310" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#be123c">Nano-TiO₂ + Dye</text>

  <rect x="360" y="100" width="160" height="260" fill="#fef9c3" stroke="#eab308" stroke-width="1.5" fill-opacity="0.6"/>
  <text x="440" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#854d0e">Electrolyte</text>
  <text x="440" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a16207">(I⁻ / I₃⁻ Redox Couple)</text>

  <g transform="translate(415, 215)">
    <path d="M 0 0 C 35 -20, 35 30, 0 20" fill="none" stroke="#ca8a04" stroke-width="2"/>
    <polygon points="0,0 -8,-3 -3,6" fill="#ca8a04"/>
    <text x="42" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#78350f">I₃⁻</text>

    <path d="M 10 40 C -25 60, -25 10, 10 20" fill="none" stroke="#ca8a04" stroke-width="2"/>
    <polygon points="10,40 18,43 13,34" fill="#ca8a04"/>
    <text x="-40" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#78350f">3I⁻</text>
  </g>

  <rect x="525" y="100" width="12" height="260" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <text x="531" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#334155">Pt Catalyst Layer</text>

  <rect x="540" y="100" width="30" height="260" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2" rx="3"/>
  <text x="555" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0369a1" transform="rotate(-90 555 400)">FTO Glass (Cathode)</text>

  <path d="M 245 100 L 245 60 L 370 60" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <path d="M 430 60 L 555 60 L 555 100" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  
  <rect x="370" y="45" width="60" height="30" fill="#f8fafc" stroke="#0f172a" stroke-width="2" rx="4"/>
  <text x="400" y="65" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Load</text>

  <path d="M 290 50 L 320 50" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polygon points="320,50 312,46 312,54" fill="#2563eb"/>
  <text x="305" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#2563eb">e⁻ flow</text>

  <path d="M 480 50 L 510 50" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polygon points="510,50 502,46 502,54" fill="#2563eb"/>
  <text x="495" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#2563eb">e⁻</text>

  <g transform="translate(620, 160)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Key Components:</text>
    <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">1. FTO Glass (TCO substrate)</text>
    <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">2. Nano-TiO₂ semiconductor</text>
    <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">3. Ruthenium dye sensitizer</text>
    <text x="0" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">4. I⁻/I₃⁻ liquid electrolyte</text>
    <text x="0" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#334155">5. Pt counter electrode</text>
  </g>
</svg>
