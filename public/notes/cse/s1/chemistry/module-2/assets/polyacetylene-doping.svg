<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="10"/>

  <text x="440" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Doping Mechanisms of Polyacetylene</text>

  <g transform="translate(40, 55)">
    <rect x="0" y="0" width="800" height="185" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>
    <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#0369a1">(A) p-type Doping (Oxidative Doping with Lewis Acid, e.g. FeCl₃)</text>

    <g transform="translate(30, 45)">
      <path d="M 0 35 L 25 15 L 50 35 L 75 15 L 100 35 L 125 15 L 150 35" fill="none" stroke="#0f172a" stroke-width="2.5"/>
      <line x1="2" y1="32" x2="23" y2="15" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="52" y1="32" x2="73" y2="15" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="102" y1="32" x2="123" y2="15" stroke="#0f172a" stroke-width="1.5"/>
      <text x="75" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Neutral Polyacetylene</text>
    </g>

    <g transform="translate(200, 70)">
      <line x1="0" y1="10" x2="60" y2="10" stroke="#0284c7" stroke-width="2"/>
      <polygon points="60,10 52,6 52,14" fill="#0284c7"/>
      <text x="30" y="-2" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0369a1">-1e⁻ (FeCl₃)</text>
    </g>

    <g transform="translate(280, 45)">
      <path d="M 0 35 L 25 15 L 50 35 L 75 15 L 100 35 L 125 15 L 150 35" fill="none" stroke="#0f172a" stroke-width="2.5"/>
      <circle cx="75" cy="15" r="4" fill="#0284c7"/>
      <text x="75" y="8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">+</text>
      <circle cx="100" cy="35" r="2.5" fill="#0f172a"/>
      <text x="75" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0369a1">Polaron (Radical Cation)</text>
    </g>

    <g transform="translate(450, 70)">
      <line x1="0" y1="10" x2="60" y2="10" stroke="#0284c7" stroke-width="2"/>
      <polygon points="60,10 52,6 52,14" fill="#0284c7"/>
      <text x="30" y="-2" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0369a1">-1e⁻</text>
    </g>

    <g transform="translate(530, 45)">
      <path d="M 0 35 L 25 15 L 50 35 L 75 15 L 100 35 L 125 15 L 150 35" fill="none" stroke="#0f172a" stroke-width="2.5"/>
      <circle cx="50" cy="35" r="4" fill="#0284c7"/>
      <text x="50" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">+</text>
      <circle cx="100" cy="35" r="4" fill="#0284c7"/>
      <text x="100" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">+</text>
      <text x="75" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#0369a1">Bipolaron (Dication)</text>
    </g>

    <text x="400" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Removal of electrons creates mobile positive charges (holes) along the conjugated chain.</text>
  </g>

  <g transform="translate(40, 255)">
    <rect x="0" y="0" width="800" height="185" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>
    <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#c2410c">(B) n-type Doping (Reductive Doping with Lewis Base, e.g. Sodium Naphthalide)</text>

    <g transform="translate(30, 45)">
      <path d="M 0 35 L 25 15 L 50 35 L 75 15 L 100 35 L 125 15 L 150 35" fill="none" stroke="#0f172a" stroke-width="2.5"/>
      <line x1="2" y1="32" x2="23" y2="15" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="52" y1="32" x2="73" y2="15" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="102" y1="32" x2="123" y2="15" stroke="#0f172a" stroke-width="1.5"/>
      <text x="75" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Neutral Polyacetylene</text>
    </g>

    <g transform="translate(200, 70)">
      <line x1="0" y1="10" x2="60" y2="10" stroke="#ea580c" stroke-width="2"/>
      <polygon points="60,10 52,6 52,14" fill="#ea580c"/>
      <text x="30" y="-2" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#c2410c">+1e⁻ (Na/Naph)</text>
    </g>

    <g transform="translate(280, 45)">
      <path d="M 0 35 L 25 15 L 50 35 L 75 15 L 100 35 L 125 15 L 150 35" fill="none" stroke="#0f172a" stroke-width="2.5"/>
      <circle cx="75" cy="15" r="4" fill="#ea580c"/>
      <text x="75" y="8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ea580c">−</text>
      <circle cx="100" cy="35" r="2.5" fill="#0f172a"/>
      <text x="75" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#c2410c">Polaron (Radical Anion)</text>
    </g>

    <g transform="translate(450, 70)">
      <line x1="0" y1="10" x2="60" y2="10" stroke="#ea580c" stroke-width="2"/>
      <polygon points="60,10 52,6 52,14" fill="#ea580c"/>
      <text x="30" y="-2" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#c2410c">+1e⁻</text>
    </g>

    <g transform="translate(530, 45)">
      <path d="M 0 35 L 25 15 L 50 35 L 75 15 L 100 35 L 125 15 L 150 35" fill="none" stroke="#0f172a" stroke-width="2.5"/>
      <circle cx="50" cy="35" r="4" fill="#ea580c"/>
      <text x="50" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ea580c">−</text>
      <circle cx="100" cy="35" r="4" fill="#ea580c"/>
      <text x="100" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ea580c">−</text>
      <text x="75" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#c2410c">Bipolaron (Dianion)</text>
    </g>

    <text x="400" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Addition of electrons provides free negative charge carriers enhancing electrical conductivity.</text>
  </g>
</svg>
