<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

  <text x="440" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Sol-Gel Synthesis of Silica (SiO₂)</text>

  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="800" height="110" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>
    <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0369a1">Step 1: Hydrolysis of Alkoxide (e.g. TEOS)</text>
    
    <g transform="translate(50, 40)" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">
      <text x="0" y="25">Si(OR)₄  +  4 H₂O</text>
      
      <line x1="165" y1="20" x2="225" y2="20" stroke="#0f172a" stroke-width="2"/>
      <polygon points="225,20 217,16 217,24" fill="#0f172a"/>
      <text x="195" y="12" text-anchor="middle" font-size="11" fill="#64748b">catalyst</text>
      
      <text x="240" y="25">Si(OH)₄  +  4 R-OH</text>
      <text x="240" y="48" font-size="12" font-weight="normal" fill="#64748b">(Silicic acid / Silanol)</text>
    </g>
  </g>

  <g transform="translate(40, 175)">
    <rect x="0" y="0" width="800" height="120" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>
    <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0369a1">Step 2: Water / Alcohol Condensation</text>

    <g transform="translate(50, 40)" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">
      <text x="0" y="25">2 Si(OH)₄</text>

      <line x1="100" y1="20" x2="160" y2="20" stroke="#0f172a" stroke-width="2"/>
      <polygon points="160,20 152,16 152,24" fill="#0f172a"/>
      <text x="130" y="12" text-anchor="middle" font-size="11" fill="#ef4444">- H₂O</text>

      <text x="175" y="25">(HO)₃Si — O — Si(OH)₃  +  H₂O</text>
      <text x="175" y="48" font-size="12" font-weight="normal" fill="#64748b">(Formation of siloxane Si—O—Si linkage)</text>
    </g>
  </g>

  <g transform="translate(40, 310)">
    <rect x="0" y="0" width="800" height="165" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>
    <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0369a1">Step 3: Polycondensation into 3D Silica Gel Network</text>

    <g transform="translate(250, 45)" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">
      <text x="0" y="20">Si</text>
      <line x1="15" y1="16" x2="45" y2="16" stroke="#0f172a" stroke-width="2"/>
      <text x="58" y="20" fill="#2563eb">O</text>
      <line x1="70" y1="16" x2="100" y2="16" stroke="#0f172a" stroke-width="2"/>
      <text x="115" y="20">Si</text>
      <line x1="130" y1="16" x2="160" y2="16" stroke="#0f172a" stroke-width="2"/>
      <text x="173" y="20" fill="#2563eb">O</text>
      <line x1="185" y1="16" x2="215" y2="16" stroke="#0f172a" stroke-width="2"/>
      <text x="230" y="20">Si</text>

      <line x1="0" y1="28" x2="0" y2="48" stroke="#0f172a" stroke-width="2"/>
      <text x="0" y="60" fill="#2563eb">O</text>
      <line x1="0" y1="66" x2="0" y2="86" stroke="#0f172a" stroke-width="2"/>
      <text x="0" y="98">Si</text>

      <line x1="115" y1="28" x2="115" y2="48" stroke="#0f172a" stroke-width="2"/>
      <text x="115" y="60" fill="#2563eb">O</text>
      <line x1="115" y1="66" x2="115" y2="86" stroke="#0f172a" stroke-width="2"/>
      <text x="115" y="98">Si</text>

      <line x1="230" y1="28" x2="230" y2="48" stroke="#0f172a" stroke-width="2"/>
      <text x="230" y="60" fill="#2563eb">O</text>
      <line x1="230" y1="66" x2="230" y2="86" stroke="#0f172a" stroke-width="2"/>
      <text x="230" y="98">Si</text>

      <line x1="15" y1="94" x2="45" y2="94" stroke="#0f172a" stroke-width="2"/>
      <text x="58" y="98" fill="#2563eb">O</text>
      <line x1="70" y1="94" x2="100" y2="94" stroke="#0f172a" stroke-width="2"/>
      <line x1="130" y1="94" x2="160" y2="94" stroke="#0f172a" stroke-width="2"/>
      <text x="173" y="98" fill="#2563eb">O</text>
      <line x1="185" y1="94" x2="215" y2="94" stroke="#0f172a" stroke-width="2"/>
    </g>

    <text x="400" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Continuous 3D Si—O—Si network forms the rigid porous silica gel</text>
  </g>
</svg>
