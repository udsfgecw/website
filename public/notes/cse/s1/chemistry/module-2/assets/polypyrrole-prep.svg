<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="10"/>

  <text x="430" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Oxidative Polymerization of Pyrrole to Polypyrrole (PPy)</text>

  <g transform="translate(100, 70)">
    <text x="-35" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">n</text>
    <polygon points="10,20 60,20 75,60 40,85 5,60" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="18" y1="26" x2="52" y2="26" stroke="#0f172a" stroke-width="2"/>
    <line x1="12" y1="58" x2="30" y2="76" stroke="#0f172a" stroke-width="2"/>
    <text x="40" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">N</text>
    <text x="40" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">H</text>
    <text x="40" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#334155">Pyrrole</text>
  </g>

  <g transform="translate(280, 105)">
    <line x1="0" y1="10" x2="160" y2="10" stroke="#0f172a" stroke-width="2.5"/>
    <polygon points="160,10 148,3 148,17" fill="#0f172a"/>
    <text x="80" y="-3" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">[O] / FeCl₃</text>
    <text x="80" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Oxidative polymerisation</text>
  </g>

  <g transform="translate(520, 70)">
    <path d="M 0 10 L -12 10 L -12 85 L 0 85" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="-30" y1="45" x2="5" y2="60" stroke="#0f172a" stroke-width="2.5"/>

    <polygon points="10,20 60,20 75,60 40,85 5,60" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="18" y1="26" x2="52" y2="26" stroke="#0f172a" stroke-width="2"/>
    <text x="40" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">N</text>
    <text x="40" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">H</text>

    <line x1="75" y1="60" x2="110" y2="45" stroke="#0f172a" stroke-width="2.5"/>
    <path d="M 85 10 L 97 10 L 97 85 L 85 85" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <text x="104" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="bold" fill="#0f172a">n</text>

    <text x="40" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#334155">Polypyrrole (PPy)</text>

    <text x="150" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#0f172a">+ 2n H⁺ + 2n e⁻</text>
  </g>
</svg>
