<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

  <text x="460" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Classification of Carbon Nanotubes (CNTs)</text>

  <rect x="340" y="60" width="240" height="42" fill="#0284c7" rx="8"/>
  <text x="460" y="87" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Carbon Nanotubes</text>

  <path d="M 460 102 L 460 130 L 230 130 L 230 150" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <path d="M 460 130 L 690 130 L 690 150" fill="none" stroke="#64748b" stroke-width="2.5"/>

  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="260" height="42" fill="#0ea5e9" rx="6"/>
    <text x="130" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Single-Walled CNTs (SWCNTs)</text>

    <path d="M 130 42 L 130 70 L 40 70 L 40 90" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 130 70 L 130 90" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 130 70 L 220 70 L 220 90" fill="none" stroke="#94a3b8" stroke-width="2"/>

    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="80" height="34" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
      <text x="40" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0369a1">Armchair</text>
      <text x="40" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">(n, n)</text>
      <text x="40" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#059669">Metallic</text>

      <rect x="90" y="0" width="80" height="34" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
      <text x="130" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0369a1">Zigzag</text>
      <text x="130" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">(n, 0)</text>
      <text x="130" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Semi/Met</text>

      <rect x="180" y="0" width="80" height="34" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
      <text x="220" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0369a1">Chiral</text>
      <text x="220" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">(n, m)</text>
      <text x="220" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Semiconduct</text>
    </g>

    <text x="130" y="240" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Single rolled graphene cylinder</text>
    <text x="130" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Diameter: 0.4 – 2 nm</text>
  </g>

  <g transform="translate(560, 150)">
    <rect x="0" y="0" width="260" height="42" fill="#3b82f6" rx="6"/>
    <text x="130" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Multi-Walled CNTs (MWCNTs)</text>

    <path d="M 130 42 L 130 70 L 40 70 L 40 90" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 130 70 L 130 90" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 130 70 L 220 70 L 220 90" fill="none" stroke="#94a3b8" stroke-width="2"/>

    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="80" height="34" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5" rx="4"/>
      <text x="40" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e40af">Russian Doll</text>
      <text x="40" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Model</text>

      <rect x="90" y="0" width="80" height="34" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5" rx="4"/>
      <text x="130" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e40af">Parchment</text>
      <text x="130" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Model</text>

      <rect x="180" y="0" width="80" height="34" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5" rx="4"/>
      <text x="220" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e40af">Mixed</text>
      <text x="220" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Model</text>
    </g>

    <g transform="translate(130, 200)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </g>

    <text x="130" y="258" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Concentric cylinders (2 – 100 nm)</text>
  </g>
</svg>
