<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="10"/>

  <text x="430" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Oxidative Polymerization of Aniline to Polyaniline (PANI)</text>

  <g transform="translate(100, 70)">
    <text x="-35" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">n</text>
    <polygon points="40,10 70,27 70,63 40,80 10,63 10,27" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="40" cy="45" r="18" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="70" y1="45" x2="105" y2="45" stroke="#0f172a" stroke-width="2.5"/>
    <text x="110" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">NH₂</text>
    <text x="50" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#334155">Aniline</text>
  </g>

  <g transform="translate(300, 100)">
    <line x1="0" y1="15" x2="160" y2="15" stroke="#0f172a" stroke-width="2.5"/>
    <polygon points="160,15 148,8 148,22" fill="#0f172a"/>
    <text x="80" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">[O] / (NH₄)₂S₂O₈</text>
    <text x="80" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">dil. HCl, 0–5 °C</text>
  </g>

  <g transform="translate(520, 70)">
    <line x1="-30" y1="45" x2="10" y2="45" stroke="#0f172a" stroke-width="2.5"/>
    
    <path d="M 0 10 L -10 10 L -10 80 L 0 80" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    
    <polygon points="40,10 70,27 70,63 40,80 10,63 10,27" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="40" cy="45" r="18" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="70" y1="45" x2="95" y2="45" stroke="#0f172a" stroke-width="2.5"/>
    <text x="100" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">NH</text>
    <line x1="135" y1="45" x2="175" y2="45" stroke="#0f172a" stroke-width="2.5"/>

    <path d="M 145 10 L 155 10 L 155 80 L 145 80" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <text x="162" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="bold" fill="#0f172a">n</text>

    <text x="75" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#334155">Polyaniline (PANI)</text>

    <text x="210" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#0f172a">+ n H₂O</text>
  </g>
</svg>
